<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d">
<title id="t">負分數 A 與 B 的數線位置</title><desc id="d">從負一到零分成十二等份。A 在負九分之十二，B 在負八分之十二，A 在 B 左一格。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z"/></marker></defs>
<line x1="90" y1="125" x2="810" y2="125" stroke="currentColor" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="90" y1="112" x2="90" y2="138" stroke="currentColor" stroke-width="3"/><line x1="150" y1="112" x2="150" y2="138" stroke="currentColor" stroke-width="2"/><line x1="210" y1="112" x2="210" y2="138" stroke="currentColor" stroke-width="2"/><line x1="270" y1="112" x2="270" y2="138" stroke="currentColor" stroke-width="2"/><line x1="330" y1="112" x2="330" y2="138" stroke="currentColor" stroke-width="2"/><line x1="390" y1="112" x2="390" y2="138" stroke="currentColor" stroke-width="2"/><line x1="450" y1="112" x2="450" y2="138" stroke="currentColor" stroke-width="3"/><line x1="510" y1="112" x2="510" y2="138" stroke="currentColor" stroke-width="2"/><line x1="570" y1="112" x2="570" y2="138" stroke="currentColor" stroke-width="2"/><line x1="630" y1="112" x2="630" y2="138" stroke="currentColor" stroke-width="2"/><line x1="690" y1="112" x2="690" y2="138" stroke="currentColor" stroke-width="2"/><line x1="750" y1="112" x2="750" y2="138" stroke="currentColor" stroke-width="2"/><line x1="810" y1="112" x2="810" y2="138" stroke="currentColor" stroke-width="3"/>
<text x="90" y="170" text-anchor="middle" font-size="22">-1</text><text x="450" y="170" text-anchor="middle" font-size="22">-1/2</text><text x="810" y="170" text-anchor="middle" font-size="22">0</text>
<circle cx="270" cy="125" r="8" fill="currentColor"/><text x="270" y="82" text-anchor="middle" font-size="24" font-weight="700">A</text>
