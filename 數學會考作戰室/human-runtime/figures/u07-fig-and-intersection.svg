<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">且表示兩解集共同部分</title><desc id="desc">三條對齊數線。第一條從 p 向右，第二條到 q 向左，第三條以粗線標示 p 與 q 之間的重疊區。p 小於 q，端點樣式僅為一般示例。</desc>
<defs><marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z"/></marker></defs>
<g font-family="sans-serif" font-size="18" stroke="#111" fill="none" stroke-linecap="round">
<line x1="130" y1="55" x2="650" y2="55" marker-end="url(#a3)"/><circle cx="300" cy="55" r="8" fill="white" stroke-width="3"/><line id="condition-a" x1="310" y1="55" x2="630" y2="55" marker-end="url(#a3)" stroke-width="6"/>
<line x1="130" y1="115" x2="650" y2="115" marker-end="url(#a3)"/><circle cx="500" cy="115" r="8" fill="#111" stroke-width="3"/><line id="condition-b" x1="490" y1="115" x2="150" y2="115" marker-end="url(#a3)" stroke-width="6"/>
<line x1="130" y1="185" x2="650" y2="185" marker-end="url(#a3)"/><circle cx="300" cy="185" r="8" fill="white" stroke-width="3"/><circle cx="500" cy="185" r="8" fill="#111" stroke-width="3"/><line id="intersection-band" x1="310" y1="185" x2="490" y2="185" stroke-width="10"/>
</g><g font-family="sans-serif" font-size="20" fill="#111"><text x="35" y="62">條件 A</text><text x="35" y="122">條件 B</text><text x="35" y="192">A 且 B</text><text x="293" y="88">p</text><text x="493" y="148">q</text><text x="285" y="225">共同部分</text></g></svg>