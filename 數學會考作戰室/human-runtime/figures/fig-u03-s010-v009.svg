<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="t d">
<title id="t">甲地經休息站到乙地的分段行程</title>
<desc id="d">甲地到休息站距離十八公里，步行速率每小時六公里；休息站到乙地距離未知，前進速率每小時九公里，全程共五小時。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<circle cx="100" cy="150" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
<circle cx="470" cy="150" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
<circle cx="840" cy="150" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
<line x1="122" y1="150" x2="448" y2="150" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
<line x1="492" y1="150" x2="818" y2="150" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
<text x="100" y="115" text-anchor="middle" font-size="26" font-weight="700">甲地</text>
<text x="470" y="115" text-anchor="middle" font-size="26" font-weight="700">休息站</text>
<text x="840" y="115" text-anchor="middle" font-size="26" font-weight="700">乙地</text>
<text x="285" y="195" text-anchor="middle" font-size="24">18 公里</text>
<text x="285" y="225" text-anchor="middle" font-size="22">6 公里/時</text>
<text x="655" y="195" text-anchor="middle" font-size="24">x 公里</text>
<text x="655" y="225" text-anchor="middle" font-size="22">9 公里/時</text>
<rect x="350" y="260" width="240" height="42" rx="8" fill="white" stroke="currentColor" stroke-width="3"/>
<text x="470" y="289" text-anchor="middle" font-size="22">全程時間：5 小時</text>
</svg>
