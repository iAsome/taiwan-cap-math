<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u18-literacy-q010-title u18-literacy-q010-desc">
<title id="u18-literacy-q010-title">平行截線形成的內外相似三角形</title>
<desc id="u18-literacy-q010-desc">大三角形 ADE 中有平行底邊 DE 的內部線段 BC，AB為6、AD為15，小三角形ABC面積24平方公分，陰影概念區為四邊形BCED。</desc>
<rect width="640" height="420" fill="white"/>
<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#333;stroke-width:2;fill:none}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}
.mark{stroke:#111;stroke-width:2}
.txt{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#111}
.small{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;fill:#111}
.note{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;fill:#333}
</style>
<path id="outer-ade" class="line" d="M320 55 L85 350 L565 350 Z"/>
<line id="inner-bc" class="line" x1="226" y1="173" x2="414" y2="173"/>
<path id="band-bced" d="M226 173 L414 173 L565 350 L85 350 Z" fill="#eee" stroke="none"/>
<line class="line" x1="226" y1="173" x2="414" y2="173"/>
<text class="txt" x="310" y="42">A</text><text class="txt" x="196" y="170">B</text><text class="txt" x="422" y="170">C</text>
<text class="txt" x="55" y="378">D</text><text class="txt" x="572" y="378">E</text>
<text class="small" x="205" y="105">AB=6</text><text class="small" x="105" y="230">AD=15</text>
<text class="small" x="265" y="145">面積 24 cm²</text>
<path id="parallel-bc-mark" class="mark" d="M305 167 l10 6 l-10 6"/>
<path id="parallel-de-mark" class="mark" d="M305 344 l10 6 l-10 6"/>
<text class="note" x="185" y="408">灰色只標示待求區域，圖不按比例</text>
</svg>
