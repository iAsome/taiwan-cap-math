<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
<title id="title">三角柱展開圖</title><desc id="desc">三個相鄰長方形排成帶狀，兩端各接一個直角三角形。三角形直角邊標5與12，第三邊標x；長方形共同高度標10。示意圖未按比例。</desc>
<rect x="100" y="100" width="70" height="90" fill="none" stroke="black" stroke-width="3"/>
<rect x="170" y="100" width="120" height="90" fill="none" stroke="black" stroke-width="3"/>
<rect x="290" y="100" width="130" height="90" fill="none" stroke="black" stroke-width="3"/>
<path d="M100 100 L170 100 L100 40 Z" fill="none" stroke="black" stroke-width="3"/>
<path d="M100 190 L170 190 L100 250 Z" fill="none" stroke="black" stroke-width="3"/>
<path d="M100 91 h9 v9" fill="none" stroke="black" stroke-width="2"/>
<text x="135" y="92" font-size="16">5</text><text x="88" y="70" font-size="16">12</text><text x="139" y="63" font-size="16">x</text>
<line x1="450" y1="100" x2="450" y2="190" stroke="black" stroke-width="2"/><path d="M450 100 l-5 10 h10 z M450 190 l-5 -10 h10 z" fill="black"/>
<text x="480" y="150" font-size="16" text-anchor="middle">柱高 10</text>
<text x="20" y="285" font-size="14">示意圖，未按比例；x 需由條件求得。</text></svg>