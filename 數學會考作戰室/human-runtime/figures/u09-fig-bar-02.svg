<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">截斷縱軸的達標率長條圖</title><desc id="desc">甲54%，乙58%，縱軸從50%開始，因此可見柱高4與8呈二倍，但實際達標率不是二倍。</desc>
<style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;}</style>
<rect width="640" height="400" fill="white"/><text x="320" y="28" text-anchor="middle" font-size="21">達標率比較（縱軸從50開始）</text>
<g stroke="#aaa"><line x1="110" y1="270" x2="570" y2="270"/><line x1="110" y1="210" x2="570" y2="210"/><line x1="110" y1="150" x2="570" y2="150"/><line x1="110" y1="90" x2="570" y2="90"/></g>
<g stroke="#222" stroke-width="2"><line x1="110" y1="330" x2="570" y2="330"/><line x1="110" y1="330" x2="110" y2="55"/><line x1="102" y1="318" x2="118" y2="308"/><line x1="102" y1="330" x2="118" y2="320"/></g>
<g font-size="16" text-anchor="end"><text x="98" y="335">50</text><text x="98" y="275">52</text><text x="98" y="215">54</text><text x="98" y="155">56</text><text x="98" y="95">58</text></g>
<g fill="#c8d6bf" stroke="#222" stroke-width="2"><rect x="210" y="210" width="100" height="120"/><rect x="390" y="90" width="100" height="240"/></g>
<g font-size="19" text-anchor="middle"><text x="260" y="200">54</text><text x="440" y="80">58</text><text x="260" y="357">甲</text><text x="440" y="357">乙</text></g>
<text x="34" y="195" font-size="16" transform="rotate(-90 34 195)" text-anchor="middle">達標率（%）</text><text x="340" y="386" font-size="15" text-anchor="middle">注意：可見柱高以50為基線</text>
</svg>
