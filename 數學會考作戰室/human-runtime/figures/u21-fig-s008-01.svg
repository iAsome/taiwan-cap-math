<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="u21-fig-s008-01-title u21-fig-s008-01-desc" viewBox="0 0 720 420" width="720" height="420"><title id="u21-fig-s008-01-title">以對稱值表作圖</title><desc id="u21-fig-s008-01-desc">左側列出 x 為負三到一與 y 為零負三負四負三零，右側畫出頂點負一負四的平滑拋物線。</desc><rect x="1" y="1" width="718" height="418" fill="white" stroke="black"/><text x="25" y="32" font-size="19">y=(x+1)²-4</text><g stroke="black" fill="none"><rect x="25" y="52" width="230" height="270"/><line x1="110" y1="52" x2="110" y2="322"/><line x1="25" y1="92" x2="255" y2="92"/><line x1="25" y1="138" x2="255" y2="138"/><line x1="25" y1="184" x2="255" y2="184"/><line x1="25" y1="230" x2="255" y2="230"/><line x1="25" y1="276" x2="255" y2="276"/></g><g font-size="18"><text x="62" y="80">x</text><text x="172" y="80">y</text><text x="60" y="124">-3</text><text x="174" y="124">0</text><text x="60" y="170">-2</text><text x="168" y="170">-3</text><text x="60" y="216">-1</text><text x="168" y="216">-4</text><text x="66" y="262">0</text><text x="168" y="262">-3</text><text x="66" y="308">1</text><text x="174" y="308">0</text></g><line x1="300" y1="190" x2="690" y2="190" stroke="black" stroke-width="2"/><line x1="568" y1="390" x2="568" y2="35" stroke="black" stroke-width="2"/><line x1="500" y1="390" x2="500" y2="35" stroke="black" stroke-width="2" stroke-dasharray="8 7"/><path d="M330 80 C345 130 355 175 365 190 C390 250 410 300 432 300 C455 330 480 340 500 340 C520 340 545 330 568 300 C590 300 610 250 635 190 C645 175 655 130 670 80" fill="none" stroke="black" stroke-width="4"/><g fill="white" stroke="black" stroke-width="2"><circle cx="365" cy="190" r="6"/><circle cx="432" cy="300" r="6"/><circle cx="500" cy="340" r="6"/><circle cx="568" cy="300" r="6"/><circle cx="635" cy="190" r="6"/></g><text x="510" y="335" font-size="17">(-1,-4)</text><text x="295" y="410" font-size="16">先標點，再依對稱畫平滑曲線；不可用折線代替。</text></svg>