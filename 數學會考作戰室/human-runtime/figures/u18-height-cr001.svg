<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u18-height-cr001-title u18-height-cr001-desc">
<title id="u18-height-cr001-title">鏡面測高申論圖</title>
<desc id="u18-height-cr001-desc">建築物底B、鏡面M、觀測者腳P共線；樓頂S與眼睛E的光線在M反射，BM為18公尺、MP為2.4公尺、PE為1.6公尺。</desc>
<rect width="640" height="420" fill="white"/>
<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#333;stroke-width:2;fill:none}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}
.mark{stroke:#111;stroke-width:2}
.txt{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#111}
.small{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;fill:#111}
.note{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;fill:#333}
</style>
<line id="hcr-ground" class="line" x1="65" y1="345" x2="590" y2="345"/>
<line id="hcr-building" class="line" x1="105" y1="345" x2="105" y2="65"/>
<line id="hcr-eye" class="line" x1="540" y1="345" x2="540" y2="280"/>
<rect id="hcr-mirror" x="398" y="338" width="40" height="8" fill="#ddd" stroke="#111" stroke-width="2"/>
<line id="hcr-ray1" class="dash" x1="105" y1="65" x2="418" y2="342"/>
<line id="hcr-ray2" class="dash" x1="418" y1="342" x2="540" y2="280"/>
<text class="txt" x="80" y="375">B</text><text class="txt" x="82" y="54">S</text><text class="txt" x="407" y="375">M</text>
<text class="txt" x="545" y="375">P</text><text class="txt" x="547" y="275">E</text>
<text class="small" x="235" y="370">18 m</text><text class="small" x="458" y="370">2.4 m</text><text class="small" x="548" y="315">1.6 m</text>
<text class="note" x="165" y="410">反射角相等，圖不按比例</text>
</svg>
