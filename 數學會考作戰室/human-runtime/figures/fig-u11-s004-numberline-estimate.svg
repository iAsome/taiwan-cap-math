<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-labelledby="fig-u11-s004-numberline-estimate-title fig-u11-s004-numberline-estimate-desc"><title id="fig-u11-s004-numberline-estimate-title">平方根估算邊界數線</title><desc id="fig-u11-s004-numberline-estimate-desc">數線標出8與9，並注明8²=64、9²=81；圖中不標出√70的位置或四捨五入結果。</desc><rect width="100%" height="100%" fill="white"/><line x1="70" y1="110" x2="450" y2="110" stroke="#111" stroke-width="4"/><line x1="110" y1="90" x2="110" y2="130" stroke="#111" stroke-width="3"/><line x1="410" y1="90" x2="410" y2="130" stroke="#111" stroke-width="3"/><text x="110" y="160" text-anchor="middle" font-size="20">8，8²=64</text><text x="410" y="160" text-anchor="middle" font-size="20">9，9²=81</text><text x="260" y="70" text-anchor="middle" font-size="19">√70 介於 8 與 9 之間</text></svg>