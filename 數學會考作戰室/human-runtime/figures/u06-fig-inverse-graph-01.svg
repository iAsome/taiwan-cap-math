<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;}</style>
<title id="title">反比關係 y 等於 12 除以 x 的第一象限示意圖</title>
<desc id="desc">第一象限座標示意圖：黑色遞減曲線靠近但不接觸兩軸，曲線上標出(1,12)、(2,6)、(3,4)、(4,3)、(6,2)，圖下提醒不可由外觀估讀未標數值。</desc>
<rect x="0" y="0" width="720" height="100%" fill="white"/>
<line x1="80" y1="440" x2="660" y2="440" stroke="black" stroke-width="3"/>
<polygon points="660,440 645,432 645,448" fill="black"/>
<line x1="80" y1="440" x2="80" y2="50" stroke="black" stroke-width="3"/>
<polygon points="80,50 72,65 88,65" fill="black"/>
<text x="675" y="450" font-size="24">x</text>
<text x="62" y="40" font-size="24">y</text>
<text x="58" y="463" font-size="18">0</text>
<path d="M 126 116 C 140 190, 155 250, 172 278 C 188 304, 203 323, 218 332 C 234 343, 249 353, 264 359 C 294 372, 327 381, 356 386 C 420 398, 500 408, 580 416" fill="none" stroke="black" stroke-width="4"/>
<circle cx="126" cy="116" r="6" fill="black"/><text x="138" y="110" font-size="18">(1,12)</text>
<circle cx="172" cy="278" r="6" fill="black"/><text x="184" y="272" font-size="18">(2,6)</text>
<circle cx="218" cy="332" r="6" fill="black"/><text x="230" y="326" font-size="18">(3,4)</text>
<circle cx="264" cy="359" r="6" fill="black"/><text x="276" y="353" font-size="18">(4,3)</text>
<circle cx="356" cy="386" r="6" fill="black"/><text x="368" y="380" font-size="18">(6,2)</text>
<text x="370" y="490" text-anchor="middle" font-size="21">y＝12÷x；曲線僅為示意，不可由外觀讀取未標示的精確值</text>
</svg>