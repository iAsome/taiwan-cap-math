<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="u21-fig-s002-01-title u21-fig-s002-01-desc" viewBox="0 0 640 400" width="640" height="400"><title id="u21-fig-s002-01-title">頂點與垂直對稱軸</title><desc id="u21-fig-s002-01-desc">拋物線 y=(x-2)²-3 的最低點標為 V 二負三，虛線 x=2 通過頂點並把曲線分成對稱兩半。</desc><rect x="1" y="1" width="638" height="398" fill="white" stroke="black"/><line x1="60" y1="220" x2="600" y2="220" stroke="black" stroke-width="2"/><line x1="220" y1="365" x2="220" y2="35" stroke="black" stroke-width="2"/><line x1="360" y1="40" x2="360" y2="355" stroke="black" stroke-width="2" stroke-dasharray="8 7"/><path d="M150 45 Q255 340 360 340 Q465 340 570 45" fill="none" stroke="black" stroke-width="4"/><circle cx="360" cy="340" r="7" fill="black"/><text x="370" y="337" font-size="18">V(2,-3)</text><text x="369" y="62" font-size="18">x=2</text><text x="500" y="85" font-size="18">y=(x-2)²-3</text><text x="580" y="215">x</text><text x="230" y="48">y</text></svg>