<path class="mark" d="M229 249 l10 0 l0 -10"/>
<text class="lbl" x="137" y="35">A</text><text class="lbl" x="38" y="275">B</text><text class="lbl" x="430" y="270">C</text><text class="lbl" x="238" y="181">I</text>

</svg>
