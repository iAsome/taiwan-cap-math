<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="fig-u20-incenter-sign-01-title fig-u20-incenter-sign-01-desc">
<title id="fig-u20-incenter-sign-01-title">三角形標誌相切驗證圖</title>
<desc id="fig-u20-incenter-sign-01-desc">細長三角形標誌內放一圓，兩條角平分線以虛線交於I，另畫I到下邊的垂直半徑。</desc>

<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.aux{stroke:#555;stroke-width:2.5;fill:none;stroke-dasharray:8 7}
.mark{stroke:#111;stroke-width:2.5;fill:none}
.pt{fill:#111}
.lbl{font:18px sans-serif;fill:#111}
.small{font:15px sans-serif;fill:#111}
</style>

<path class="line" d="M70 250 L170 10 L350 250 Z"/>
<path class="aux" d="M170 10 L190 170 M70 250 L190 170"/>
<circle class="line" cx="190" cy="170" r="80"/>
<circle class="pt" cx="190" cy="170" r="4"/>
<path class="aux" d="M190 170 L190 250"/>
<path class="mark" d="M190 250 l12 0 l0 -12"/>
<text class="lbl" x="162" y="27">A</text><text class="lbl" x="48" y="271">B</text><text class="lbl" x="355" y="270">C</text><text class="lbl" x="198" y="165">I</text>

</svg>
