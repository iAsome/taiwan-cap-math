<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="u16-fig-003-isosceles-structure-title u16-fig-003-isosceles-structure-desc">
<title id="u16-fig-003-isosceles-structure-title">等腰與等邊三角形的結構比較</title>
<desc id="u16-fig-003-isosceles-structure-desc">左側等腰三角形只有兩腰同刻痕，右側等邊三角形三邊皆同刻痕；兩圖下方分別標示分類。</desc>
<rect x="1" y="1" width="358" height="238" fill="white" stroke="black"/>
<g fill="none" stroke="black" stroke-width="2.5"><path d="M35 180 L105 45 L175 180 Z"/><path d="M215 180 L285 59 L345 180 Z"/>
<path d="M66 112 l11 6"/><path d="M143 112 l-11 6"/>
<path d="M246 119 l11 6"/><path d="M315 119 l-11 6"/><path d="M278 180 v-12"/></g>
<g font-size="15" font-family="Noto Sans CJK TC, sans-serif"><text x="72" y="215">等腰：兩邊相等</text><text x="242" y="215">等邊：三邊相等</text></g>
</svg>