<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="u21-fig-s010-01-title u21-fig-s010-01-desc" viewBox="0 0 760 430" width="760" height="430"><title id="u21-fig-s010-01-title">長方形面積建模與二次函數</title><desc id="u21-fig-s010-01-desc">左側長方形標示寬 x、長 20-x，右側面積圖 A=x(20-x) 為向下拋物線，頂點十逗號一百。</desc><rect x="1" y="1" width="758" height="428" fill="white" stroke="black"/><rect x="55" y="95" width="250" height="170" fill="none" stroke="black" stroke-width="4"/><line x1="55" y1="285" x2="305" y2="285" stroke="black"/><text x="130" y="315" font-size="20">長 20-x</text><text x="15" y="185" font-size="20">寬 x</text><text x="55" y="65" font-size="20">長+寬=20</text><line x1="390" y1="330" x2="725" y2="330" stroke="black" stroke-width="2"/><line x1="450" y1="385" x2="450" y2="45" stroke="black" stroke-width="2"/><path d="M450 330 C490 180 530 55 565 55 C600 55 640 180 680 330" fill="none" stroke="black" stroke-width="4"/><circle cx="565" cy="55" r="7" fill="black"/><line x1="565" y1="55" x2="565" y2="330" stroke="black" stroke-dasharray="7 6"/><text x="575" y="58" font-size="18">(10,100)</text><text x="455" y="35" font-size="18">A=x(20-x)</text><text x="40" y="405" font-size="17">幾何條件先決定可行範圍 0&lt;x&lt;20；面積單位為平方單位。</text></svg>