<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330" role="img" aria-labelledby="fig-u11-s014-triangle-check-title fig-u11-s014-triangle-check-desc"><title id="fig-u11-s014-triangle-check-title">三邊判定直角</title><desc id="fig-u11-s014-triangle-check-desc">三角形三邊標30、40、50，最長邊為50，左下角畫直角，並標示平方關係。</desc><rect width="100%" height="100%" fill="white"/><path d="M70 270 L70 90 L430 270 Z" fill="white" stroke="#111" stroke-width="4"/><text x="45" y="190" text-anchor="middle" font-size="21">30</text><text x="250" y="300" text-anchor="middle" font-size="21">40</text><text x="265" y="165" text-anchor="middle" font-size="21" transform="rotate(27 265 165)">50</text><path d="M70 240 L100 240 L100 270" fill="none" stroke="#111" stroke-width="3"/><text x="250" y="55" text-anchor="middle" font-size="20">30²+40²=50²</text></svg>