<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;}</style>
<title id="title">比例尺一比五萬的地圖線段示意圖</title>
<desc id="desc">地圖上 A 點與 B 點以直線連接，線段旁標示圖上距離三點六公分，下方標示比例尺一比五萬，並提醒圖形不按實際方向與距離繪製。</desc>
<rect x="0" y="0" width="720" height="100%" fill="white"/>
<circle cx="130" cy="145" r="10" fill="black"/>
<circle cx="590" cy="145" r="10" fill="black"/>
<line x1="140" y1="145" x2="580" y2="145" stroke="black" stroke-width="5"/>
<line x1="130" y1="120" x2="130" y2="170" stroke="black" stroke-width="3"/>
<line x1="590" y1="120" x2="590" y2="170" stroke="black" stroke-width="3"/>
<text x="130" y="105" text-anchor="middle" font-size="26">A</text>
<text x="590" y="105" text-anchor="middle" font-size="26">B</text>
<text x="360" y="125" text-anchor="middle" font-size="24">圖上距離 3.6 cm</text>
<line x1="250" y1="220" x2="470" y2="220" stroke="black" stroke-width="4"/>
<line x1="250" y1="208" x2="250" y2="232" stroke="black" stroke-width="3"/>
<line x1="470" y1="208" x2="470" y2="232" stroke="black" stroke-width="3"/>
<text x="360" y="260" text-anchor="middle" font-size="26">比例尺 1：50,000</text>
<text x="360" y="315" text-anchor="middle" font-size="21">示意圖不按實際方向或距離繪製，計算必須使用標示數值</text>
</svg>