<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u15-fig-slope-intercept-title u15-fig-slope-intercept-desc"><title id="u15-fig-slope-intercept-title">斜率與截距比較</title><desc id="u15-fig-slope-intercept-desc">同一坐標平面有直線甲 y 等於二 x 減二與直線乙 y 等於負 x 加三，標示各自 y 軸截距。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#111" /></marker></defs><rect x="0" y="0" width="640" height="420" fill="white" /><line x1="80.0" y1="40" x2="80.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="130.0" y1="40" x2="130.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="180.0" y1="40" x2="180.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="230.0" y1="40" x2="230.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="280.0" y1="40" x2="280.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="330.0" y1="40" x2="330.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="380.0" y1="40" x2="380.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="430.0" y1="40" x2="430.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="480.0" y1="40" x2="480.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="530.0" y1="40" x2="530.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="580.0" y1="40" x2="580.0" y2="360" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="40.0" x2="580" y2="40.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="80.0" x2="580" y2="80.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="120.0" x2="580" y2="120.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="160.0" x2="580" y2="160.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="200.0" x2="580" y2="200.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="240.0" x2="580" y2="240.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="280.0" x2="580" y2="280.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="320.0" x2="580" y2="320.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="360.0" x2="580" y2="360.0" stroke="#e5e7eb" stroke-width="1" /><line id="u15-fig-slope-intercept-x-axis" x1="80" y1="226.7" x2="590" y2="226.7" stroke="#111" stroke-width="2" marker-end="url(#arrow)" /><line id="u15-fig-slope-intercept-y-axis" x1="267.5" y1="360" x2="267.5" y2="30" stroke="#111" stroke-width="2" marker-end="url(#arrow)" /><text x="608" y="254.7" font-size="16">x</text><text x="277.5" y="50" font-size="16">y</text><text x="68.0" y="246.7" font-size="12">-3</text><text x="255.5" y="246.7" font-size="12">0</text><text x="568.0" y="246.7" font-size="12">5</text><text x="232.5" y="364.0" font-size="12">-5</text><text x="232.5" y="230.7" font-size="12">0</text><text x="232.5" y="44.0" font-size="12">7</text><line id="u15-fig-slope-intercept-obj-1" x1="205.0" y1="333.3" x2="517.5" y2="66.7" stroke="#1f2937" stroke-width="3" /><text x="400" y="295" font-size="14">甲 y=2x-2</text><line id="u15-fig-slope-intercept-obj-2" x1="80.0" y1="66.7" x2="580.0" y2="280.0" stroke="#1f2937" stroke-width="3" /><text x="100" y="145" font-size="14">乙 y=-x+3</text><circle id="u15-fig-slope-intercept-obj-3" cx="267.5" cy="280.0" r="6" fill="#111" /><text x="275.5" y="272.0" font-size="14">甲截距</text><circle id="u15-fig-slope-intercept-obj-4" cx="267.5" cy="146.7" r="6" fill="#111" /><text x="275.5" y="138.7" font-size="14">乙截距</text><text x="80" y="400" font-size="12">圖形依坐標刻度繪製；線條粗細不可作為數值依據。</text></svg>