<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 640 400" width="640" height="400"><title>y 等於 x 平方的拋物線與五個取樣點</title><desc>座標平面上畫出開口向上的 y=x²，標出負二到二的五個對稱點，並以文字提醒曲線不是折線。</desc><defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z"/></marker></defs><rect x="1" y="1" width="638" height="398" fill="white" stroke="black"/><line x1="60" y1="310" x2="600" y2="310" stroke="black" stroke-width="2" marker-end="url(#a1)"/><line x1="320" y1="365" x2="320" y2="35" stroke="black" stroke-width="2" marker-end="url(#a1)"/><text x="604" y="306">x</text><text x="330" y="38">y</text><path d="M120 70 Q220 310 320 310 Q420 310 520 70" fill="none" stroke="black" stroke-width="4"/><g fill="white" stroke="black" stroke-width="2"><circle cx="220" cy="250" r="6"/><circle cx="270" cy="295" r="6"/><circle cx="320" cy="310" r="6"/><circle cx="370" cy="295" r="6"/><circle cx="420" cy="250" r="6"/></g><g font-size="16"><text x="196" y="242">(-2,4)</text><text x="242" y="286">(-1,1)</text><text x="326" y="330">(0,0)</text><text x="375" y="286">(1,1)</text><text x="425" y="242">(2,4)</text><text x="430" y="90">y=x²</text><text x="70" y="380">五個點只是取樣；完整圖形為平滑曲線。</text></g></svg>