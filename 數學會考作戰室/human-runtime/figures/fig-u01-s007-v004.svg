/><text x="680" y="178" text-anchor="middle" font-size="18">5</text><line x1="740" y1="119" x2="740" y2="141" stroke="currentColor" stroke-width="2"/><text x="740" y="178" text-anchor="middle" font-size="18">6</text><circle cx="140" cy="130" r="7" fill="currentColor"/><circle cx="680" cy="130" r="7" fill="currentColor"/><text x="140" y="112" text-anchor="middle" font-size="20">M</text><text x="680" y="112" text-anchor="middle" font-size="20">N</text><line x1="140" y1="65" x2="680" y2="65" stroke="currentColor" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="410" y="50" text-anchor="middle" font-size="20">距離？</text></svg>
