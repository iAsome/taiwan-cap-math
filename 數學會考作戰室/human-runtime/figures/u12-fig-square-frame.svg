<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
<title id="title">外正方形與內正方形的面積差</title>
<desc id="desc">外正方形邊長標為 A，中央內正方形邊長標為 B，陰影以斜線表示兩者面積差，示意圖不按比例。</desc>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="currentColor" stroke-width="2"/></pattern></defs>
<rect x="110" y="50" width="300" height="300" fill="url(#hatch)" stroke="currentColor" stroke-width="4"/>
<rect x="200" y="140" width="120" height="120" fill="white" stroke="currentColor" stroke-width="4"/>
<line x1="110" y1="375" x2="410" y2="375" stroke="currentColor" stroke-width="2"/>
<line x1="110" y1="365" x2="110" y2="385" stroke="currentColor" stroke-width="2"/>
<line x1="410" y1="365" x2="410" y2="385" stroke="currentColor" stroke-width="2"/>
<text x="250" y="405" font-size="24">A</text>
<text x="250" y="205" font-size="24">B</text>
<text x="435" y="210" font-size="22">面積差 A²-B²</text>
<text x="170" y="30" font-size="20">示意圖不按比例</text>
</svg>