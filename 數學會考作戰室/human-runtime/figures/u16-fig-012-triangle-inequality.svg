<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="u16-fig-012-triangle-inequality-title u16-fig-012-triangle-inequality-desc">
<title id="u16-fig-012-triangle-inequality-title">三角形不等式的兩短邊合併比較</title>
<desc id="u16-fig-012-triangle-inequality-desc">上方兩段短線標a、b首尾相接，下方一段長線標c；右側以大於符號表示a+b必須大於c。</desc>
<rect x="1" y="1" width="358" height="238" fill="white" stroke="black"/>
<g fill="none" stroke="black" stroke-width="5"><path d="M35 80 H130"/><path d="M130 80 H245"/><path d="M35 150 H230"/></g>
<g font-size="18" font-family="Noto Sans CJK TC, sans-serif"><text x="78" y="67">a</text><text x="183" y="67">b</text><text x="125" y="176">c</text><text x="270" y="120">a+b &gt; c</text><text x="52" y="218">等號時只能排成一直線</text></g>
</svg>