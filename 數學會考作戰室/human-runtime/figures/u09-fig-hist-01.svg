<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">連續資料的次數直方圖</title><desc id="desc">四個相連區間0至10、10至20、20至30、30至40，次數依序4、7、5、3。</desc>
<style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;}</style>
<rect width="640" height="400" fill="white"/><text x="320" y="28" text-anchor="middle" font-size="22">連續資料的次數直方圖</text>
<g stroke="#aaa"><line x1="100" y1="300" x2="520" y2="300"/><line x1="100" y1="270" x2="520" y2="270"/><line x1="100" y1="240" x2="520" y2="240"/><line x1="100" y1="210" x2="520" y2="210"/><line x1="100" y1="180" x2="520" y2="180"/><line x1="100" y1="150" x2="520" y2="150"/><line x1="100" y1="120" x2="520" y2="120"/><line x1="100" y1="90" x2="520" y2="90"/></g>
<g stroke="#222" stroke-width="2"><line x1="100" y1="330" x2="520" y2="330"/><line x1="100" y1="330" x2="100" y2="60"/></g>
<g fill="#c6d7e8" stroke="#222" stroke-width="2"><rect x="100" y="210" width="100" height="120"/><rect x="200" y="120" width="100" height="210"/><rect x="300" y="180" width="100" height="150"/><rect x="400" y="240" width="100" height="90"/></g>
<g font-size="16" text-anchor="end"><text x="92" y="335">0</text><text x="92" y="305">1</text><text x="92" y="275">2</text><text x="92" y="245">3</text><text x="92" y="215">4</text><text x="92" y="185">5</text><text x="92" y="155">6</text><text x="92" y="125">7</text><text x="92" y="95">8</text></g>
<g font-size="17" text-anchor="middle"><text x="100" y="355">0</text><text x="200" y="355">10</text><text x="300" y="355">20</text><text x="400" y="355">30</text><text x="500" y="355">40</text><text x="250" y="110">7</text></g>
<text x="32" y="195" font-size="16" transform="rotate(-90 32 195)" text-anchor="middle">次數</text><text x="310" y="385" font-size="16" text-anchor="middle">資料值 x</text>
</svg>
