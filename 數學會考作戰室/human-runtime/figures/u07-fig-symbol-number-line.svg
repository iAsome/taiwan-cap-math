<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">不等號數線端點與方向示意</title><desc id="desc">兩條不按比例的水平數線圖例：上方在字母a畫空心點並以粗線向右延伸；下方在字母b畫實心點並以粗線向左延伸，文字分別說明端點不包含與包含。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs>
<rect x="0" y="0" width="720" height="240" fill="white"/>
<g font-family="sans-serif" font-size="22" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round">
<line x1="80" y1="72" x2="640" y2="72"/><line x1="330" y1="61" x2="330" y2="83"/>
<circle id="open-endpoint" cx="330" cy="72" r="10" fill="white"/><line id="right-ray" x1="342" y1="72" x2="620" y2="72" marker-end="url(#arrow)" stroke-width="7"/>
<line x1="80" y1="168" x2="640" y2="168"/><line x1="390" y1="157" x2="390" y2="179"/>
<circle id="closed-endpoint" cx="390" cy="168" r="10" fill="#111"/><line id="left-ray" x1="378" y1="168" x2="100" y2="168" marker-end="url(#arrow)" stroke-width="7"/>
</g><g font-family="sans-serif" font-size="22" fill="#111"><text x="322" y="112">a</text><text x="382" y="208">b</text><text x="80" y="35">空心端點：不包含端點</text><text x="80" y="138">實心端點：包含端點</text></g></svg>