<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u18-aa-cr001-title u18-aa-cr001-desc">
<title id="u18-aa-cr001-title">平行截線的AA證明圖</title>
<desc id="u18-aa-cr001-desc">△ABC中D在AB、E在AC，DE平行BC；圖上標示共用頂點A及平行記號，供證明△ADE與△ABC相似。</desc>
<rect width="640" height="420" fill="white"/>
<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#333;stroke-width:2;fill:none}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}
.mark{stroke:#111;stroke-width:2}
.txt{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#111}
.small{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;fill:#111}
.note{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;fill:#333}
</style>
<path id="aa-cr-triangle" class="line" d="M320 55 L90 350 L555 350 Z"/>
<line id="aa-cr-de" class="line" x1="228" y1="173" x2="414" y2="173"/>
<text class="txt" x="310" y="42">A</text><text class="txt" x="60" y="378">B</text><text class="txt" x="563" y="378">C</text>
<text class="txt" x="198" y="170">D</text><text class="txt" x="423" y="170">E</text>
<path id="aa-cr-angle-a" class="thin" d="M300 82 Q320 98 340 82"/>
<path id="aa-cr-parallel-de" class="mark" d="M305 167 l10 6 l-10 6 M322 167 l10 6 l-10 6"/>
<path id="aa-cr-parallel-bc" class="mark" d="M305 344 l10 6 l-10 6 M322 344 l10 6 l-10 6"/>
<text class="note" x="178" y="405">請依平行線角關係證明，圖不按比例</text>
</svg>
