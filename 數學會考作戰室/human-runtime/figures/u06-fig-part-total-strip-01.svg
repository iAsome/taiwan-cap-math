<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;}</style>
<title id="title">部分量與總量的五等分長條圖</title>
<desc id="desc">一條長方形被平均分成五格，前兩格標示甲占二份，後三格標示乙占三份，整條代表總量五份。本圖不表示實際長度。</desc>
<rect x="0" y="0" width="720" height="100%" fill="white"/>
<rect x="60" y="70" width="600" height="80" fill="white" stroke="black" stroke-width="3"/>
<line x1="180" y1="70" x2="180" y2="150" stroke="black" stroke-width="2"/>
<line x1="300" y1="70" x2="300" y2="150" stroke="black" stroke-width="2"/>
<line x1="420" y1="70" x2="420" y2="150" stroke="black" stroke-width="2"/>
<line x1="540" y1="70" x2="540" y2="150" stroke="black" stroke-width="2"/>
<text x="180" y="50" text-anchor="middle" font-size="24">甲：2 份</text>
<text x="480" y="50" text-anchor="middle" font-size="24">乙：3 份</text>
<text x="360" y="195" text-anchor="middle" font-size="22">總量：5 份（示意圖，不按實際長度）</text>
<text x="120" y="120" text-anchor="middle" font-size="24">1</text>
<text x="240" y="120" text-anchor="middle" font-size="24">1</text>
<text x="360" y="120" text-anchor="middle" font-size="24">1</text>
<text x="480" y="120" text-anchor="middle" font-size="24">1</text>
<text x="600" y="120" text-anchor="middle" font-size="24">1</text>
</svg>