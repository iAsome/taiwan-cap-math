<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="u21-fig-s009-01-title u21-fig-s009-01-desc" viewBox="0 0 680 410" width="680" height="410"><title id="u21-fig-s009-01-title">限制區間內比較頂點與端點</title><desc id="u21-fig-s009-01-desc">向上拋物線 y=(x-1)² 截取在 x=-1 到 x=4，標出左端、頂點、右端及其函數值，右端為區間最大值。</desc><rect x="1" y="1" width="678" height="408" fill="white" stroke="black"/><line x1="55" y1="330" x2="640" y2="330" stroke="black" stroke-width="2"/><line x1="220" y1="380" x2="220" y2="35" stroke="black" stroke-width="2"/><path d="M150 230 Q220 330 290 330 Q395 330 500 105" fill="none" stroke="black" stroke-width="4"/><line x1="150" y1="50" x2="150" y2="360" stroke="black" stroke-dasharray="6 6"/><line x1="500" y1="50" x2="500" y2="360" stroke="black" stroke-dasharray="6 6"/><circle cx="150" cy="230" r="7" fill="black"/><circle cx="290" cy="330" r="7" fill="black"/><circle cx="500" cy="105" r="7" fill="black"/><text x="100" y="220" font-size="17">(-1,4)</text><text x="300" y="325" font-size="17">(1,0) 最小</text><text x="510" y="103" font-size="17">(4,9) 最大</text><text x="75" y="395" font-size="18">只比較允許區間 -1≤x≤4；全域形狀不能取代邊界檢查。</text></svg>