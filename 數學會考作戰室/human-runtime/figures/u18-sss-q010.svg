<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u18-sss-q010-title u18-sss-q010-desc">
<title id="u18-sss-q010-title">兩個三角形標誌的邊長資料</title>
<desc id="u18-sss-q010-desc">左側小三角形三邊標示24、32、40毫米，右側大三角形三邊標示42、56、70毫米。</desc>
<rect width="640" height="420" fill="white"/>
<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#333;stroke-width:2;fill:none}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}
.mark{stroke:#111;stroke-width:2}
.txt{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#111}
.small{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;fill:#111}
.note{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;fill:#333}
</style>
<path id="small-logo" class="line" d="M65 330 L145 130 L285 330 Z"/>
<path id="large-logo" class="line" d="M350 330 L455 90 L605 330 Z"/>
<text class="small" x="70" y="220">24 mm</text><text class="small" x="200" y="220">32 mm</text><text class="small" x="145" y="360">40 mm</text>
<text class="small" x="360" y="205">42 mm</text><text class="small" x="520" y="205">56 mm</text><text class="small" x="445" y="360">70 mm</text>
<text class="note" x="170" y="405">邊長標示為資料，外觀不按比例</text>
</svg>
