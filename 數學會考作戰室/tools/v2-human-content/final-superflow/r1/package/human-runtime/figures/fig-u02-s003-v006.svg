<line x1="329" y1="278" x2="308" y2="325"/><line x1="361" y1="278" x2="382" y2="325"/>
<line x1="547" y1="178" x2="528" y2="215"/><line x1="583" y1="178" x2="602" y2="215"/>
</g>
<g stroke="currentColor" stroke-width="3" fill="white">
<circle cx="410" cy="55" r="37"/><circle cx="255" cy="145" r="33"/><circle cx="565" cy="145" r="33"/><circle cx="345" cy="245" r="33"/>
</g>
