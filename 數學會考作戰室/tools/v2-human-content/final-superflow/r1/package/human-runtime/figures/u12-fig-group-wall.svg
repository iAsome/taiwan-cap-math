<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
<title id="title">四區拼接牆的分組面積</title>
<desc id="desc">一個長方形分成二乘二四區，兩列高度為 a、b，兩欄寬為 x、y，各區標出 ax、ay、bx、by，示意圖不按比例。</desc>
<rect x="120" y="70" width="500" height="300" fill="none" stroke="currentColor" stroke-width="4"/>
<line x1="395" y1="70" x2="395" y2="370" stroke="currentColor" stroke-width="4"/>
<line x1="120" y1="225" x2="620" y2="225" stroke="currentColor" stroke-width="4"/>
<text x="245" y="155" font-size="25">ax</text><text x="500" y="155" font-size="25">ay</text>
<text x="245" y="310" font-size="25">bx</text><text x="500" y="310" font-size="25">by</text>
<text x="245" y="410" font-size="24">x</text><text x="500" y="410" font-size="24">y</text>
<text x="75" y="155" font-size="24">a</text><text x="75" y="310" font-size="24">b</text>
<text x="250" y="35" font-size="20">示意圖不按比例</text>
</svg>