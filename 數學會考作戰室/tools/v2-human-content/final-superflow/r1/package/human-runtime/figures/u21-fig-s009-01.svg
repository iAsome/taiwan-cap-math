<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 680 410" width="680" height="410"><title>限制區間內比較頂點與端點</title><desc>向上拋物線 y=(x-1)² 截取在 x=-1 到 x=4，標出左端、頂點、右端及其函數值，右端為區間最大值。</desc><rect x="1" y="1" width="678" height="408" fill="white" stroke="black"/><line x1="55" y1="325" x2="640" y2="325" stroke="black" stroke-width="2"/><line x1="240" y1="380" x2="240" y2="35" stroke="black" stroke-width="2"/><path d="M150 225 C175 300 210 360 240 360 C310 360 405 160 510 90" fill="none" stroke="black" stroke-width="4"/><line x1="150" y1="50" x2="150" y2="360" stroke="black" stroke-dasharray="6 6"/><line x1="510" y1="50" x2="510" y2="360" stroke="black" stroke-dasharray="6 6"/><circle cx="150" cy="225" r="7" fill="black"/><circle cx="240" cy="360" r="7" fill="black"/><circle cx="510" cy="90" r="7" fill="black"/><text x="100" y="215" font-size="17">(-1,4)</text><text x="250" y="355" font-size="17">(1,0) 最小</text><text x="520" y="88" font-size="17">(4,9) 最大</text><text x="75" y="395" font-size="18">只比較允許區間 -1≤x≤4；全域形狀不能取代邊界檢查。</text></svg>