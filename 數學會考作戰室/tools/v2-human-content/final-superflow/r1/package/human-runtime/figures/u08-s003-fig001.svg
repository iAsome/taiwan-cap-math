<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
<title id="title">相交直線的鄰補角</title><desc id="desc">兩條直線在 O 點相交，上方角標示 124 度，右側相鄰角標示問號。兩角的非共邊形成一直線。</desc>
<line x1="100" y1="260" x2="620" y2="60" stroke="currentColor" stroke-width="4"/><line x1="100" y1="60" x2="620" y2="260" stroke="currentColor" stroke-width="4"/>
<circle cx="360" cy="160" r="6" fill="currentColor"/><text x="360" y="190" text-anchor="middle" font-size="22">O</text>
<path d="M310 122 A65 65 0 0 1 410 122" fill="none" stroke="currentColor" stroke-width="3"/>
<text x="360" y="105" text-anchor="middle" font-size="25">124°</text>
<path d="M412 128 A62 62 0 0 1 412 192" fill="none" stroke="currentColor" stroke-width="3"/>
<text x="450" y="168" text-anchor="middle" font-size="28">?</text>
<text x="360" y="300" text-anchor="middle" font-size="18">示意圖，未按比例</text></svg>