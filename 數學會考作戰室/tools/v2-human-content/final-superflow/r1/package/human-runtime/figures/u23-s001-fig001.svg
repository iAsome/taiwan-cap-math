<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
<title id="title">立方體十字形展開圖</title><desc id="desc">六個等大正方形組成立方體展開圖，中央A，上方B，下方C，左方D，右方E，E的右方F。圖未按實際尺寸比例推論。</desc>
<rect x="150" y="100" width="60" height="60" fill="none" stroke="black" stroke-width="3"/>
<rect x="150" y="40" width="60" height="60" fill="none" stroke="black" stroke-width="3"/>
<rect x="150" y="160" width="60" height="60" fill="none" stroke="black" stroke-width="3"/>
<rect x="90" y="100" width="60" height="60" fill="none" stroke="black" stroke-width="3"/>
<rect x="210" y="100" width="60" height="60" fill="none" stroke="black" stroke-width="3"/>
<rect x="270" y="100" width="60" height="60" fill="none" stroke="black" stroke-width="3"/>
<g font-family="sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle">
<text x="180" y="130">A</text><text x="180" y="70">B</text><text x="180" y="190">C</text>
<text x="120" y="130">D</text><text x="240" y="130">E</text><text x="300" y="130">F</text></g>
<text x="20" y="275" font-family="sans-serif" font-size="14">示意圖，未按比例；請依相鄰關係判斷。</text></svg>