<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="fig-u11-s009-right-triangle-title fig-u11-s009-right-triangle-desc"><title id="fig-u11-s009-right-triangle-title">畢氏定理直角三角形</title><desc id="fig-u11-s009-right-triangle-desc">直角三角形左下角標示直角，兩股標a和b，斜邊標c，上方寫a平方加b平方等於c平方。</desc><rect width="100%" height="100%" fill="white"/><path d="M80 260 L80 70 L400 260 Z" fill="white" stroke="#111" stroke-width="4"/><path d="M80 230 L110 230 L110 260" fill="none" stroke="#111" stroke-width="3"/><text x="55" y="170" text-anchor="middle" font-size="22">a</text><text x="240" y="292" text-anchor="middle" font-size="22">b</text><text x="255" y="145" text-anchor="middle" font-size="22">c</text><text x="270" y="45" text-anchor="middle" font-size="20">a²+b²=c²</text></svg>