<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u18-similar-q010-title u18-similar-q010-desc">
<title id="u18-similar-q010-title">兩個已標示對應的相似三角形</title>
<desc id="u18-similar-q010-desc">左側三角形 ABC 與右側三角形 DEF，角弧和邊刻痕標示 A 對應 D、B 對應 F、C 對應 E。</desc>
<rect width="640" height="420" fill="white"/>
<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#333;stroke-width:2;fill:none}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}
.mark{stroke:#111;stroke-width:2}
.txt{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#111}
.small{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;fill:#111}
.note{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;fill:#333}
</style>
<path id="tri-abc" class="line" d="M70 330 L210 80 L290 330 Z"/>
<path id="tri-def" class="line" d="M365 330 L515 80 L590 330 Z"/>
<text class="txt" x="202" y="65">A</text><text class="txt" x="42" y="360">B</text><text class="txt" x="294" y="360">C</text>
<text class="txt" x="508" y="65">D</text><text class="txt" x="594" y="360">E</text><text class="txt" x="337" y="360">F</text>
<path id="angle-a" class="thin" d="M192 110 Q210 125 226 110"/>
<path id="angle-d" class="thin" d="M497 110 Q515 125 531 110"/>
<path id="angle-b" class="thin" d="M85 310 Q105 318 112 292"/>
<path id="angle-f" class="thin" d="M381 310 Q400 318 407 292"/>
<line id="tick-ac" class="mark" x1="252" y1="204" x2="266" y2="210"/>
<line id="tick-de" class="mark" x1="553" y1="204" x2="567" y2="210"/>
<text class="note" x="145" y="400">角弧與刻痕只表示對應，不表示實際大小</text>
</svg>
