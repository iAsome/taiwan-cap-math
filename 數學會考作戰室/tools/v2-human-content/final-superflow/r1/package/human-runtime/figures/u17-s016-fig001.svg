<title id="u17-s016-fig001-title">四邊形內角和分割證明</title><desc id="u17-s016-fig001-desc">凸四邊形ABCD畫對角線AC，形成兩個三角形並標示各180度。 圖形不一定按比例，請依標示與題幹條件推理。</desc>
<style>line,path,polygon,rect,ellipse,circle{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} text{fill:#111;stroke:none;font-size:14px;font-family:sans-serif}</style><g>
<polygon points='55,70 285,35 340,205 90,235'/><line x1='55' y1='70' x2='340' y2='205'/><text x='150' y='95'>180°</text><text x='205' y='190'>180°</text><text x='72' y='60'>A</text><text x='288' y='30'>B</text><text x='345' y='215'>C</text><text x='78' y='250'>D</text><text x='120' y='265'>內角和=360°</text>
</g>
</svg>