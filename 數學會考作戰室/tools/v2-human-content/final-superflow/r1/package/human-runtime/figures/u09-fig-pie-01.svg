<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" role="img" aria-labelledby="title desc">
<title id="title">圓形圖中的90度扇形</title><desc id="desc">完整圓中從12點方向順時針到3點方向的扇形為90度。</desc>
<style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;}</style>
<rect width="520" height="400" fill="white"/><text x="260" y="30" text-anchor="middle" font-size="22">圓形圖中的 90° 扇形</text>
<circle cx="240" cy="210" r="130" fill="none" stroke="#222" stroke-width="3"/>
<path d="M 240 210 L 240 80 A 130 130 0 0 1 370 210 Z" fill="#d9e3c7" stroke="#222" stroke-width="3"/>
<path d="M 240 192 L 258 192 L 258 210" fill="none" stroke="#222" stroke-width="2"/>
<text x="292" y="159" font-size="22" text-anchor="middle">90°</text>
<line x1="240" y1="210" x2="240" y2="80" stroke="#222" stroke-width="3"/><line x1="240" y1="210" x2="370" y2="210" stroke="#222" stroke-width="3"/>
<text x="260" y="382" text-anchor="middle" font-size="16">完整圓為 360°</text>
</svg>
