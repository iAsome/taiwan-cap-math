<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
<title id="title">通過 A 與 B 的直線</title><desc id="desc">一條向左右兩端延伸的直線，點 A 在左側、點 B 在右側。圖示用來說明直線 AB 與直線 BA 是同一條直線。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z"/></marker></defs>
<line x1="90" y1="110" x2="630" y2="110" stroke="currentColor" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle cx="260" cy="110" r="8" fill="currentColor"/><circle cx="460" cy="110" r="8" fill="currentColor"/>
<text x="260" y="75" text-anchor="middle" font-size="25" font-weight="700">A</text><text x="460" y="75" text-anchor="middle" font-size="25" font-weight="700">B</text>
<text x="360" y="190" text-anchor="middle" font-size="18">示意圖，未按比例</text></svg>