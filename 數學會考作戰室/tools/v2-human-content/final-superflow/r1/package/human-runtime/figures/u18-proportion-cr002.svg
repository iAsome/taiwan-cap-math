<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u18-proportion-cr002-title u18-proportion-cr002-desc">
<title id="u18-proportion-cr002-title">平行線分割三角形的線段資料</title>
<desc id="u18-proportion-cr002-desc">三角形ABC內，D在AB、E在AC，DE平行BC；AD為6、DB為4、AE為9，EC未知。</desc>
<rect width="640" height="420" fill="white"/>
<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#333;stroke-width:2;fill:none}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}
.mark{stroke:#111;stroke-width:2}
.txt{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#111}
.small{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;fill:#111}
.note{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;fill:#333}
</style>
<path id="cr2-triangle" class="line" d="M320 55 L95 350 L550 350 Z"/>
<line id="cr2-de" class="line" x1="230" y1="175" x2="410" y2="175"/>
<text class="txt" x="310" y="42">A</text><text class="txt" x="68" y="378">B</text><text class="txt" x="558" y="378">C</text>
<text class="txt" x="202" y="171">D</text><text class="txt" x="420" y="171">E</text>
<text class="small" x="205" y="105">6</text><text class="small" x="130" y="265">4</text><text class="small" x="420" y="105">9</text><text class="small" x="462" y="258">EC</text>
<path id="cr2-parallel1" class="mark" d="M310 169 l10 6 l-10 6"/>
<path id="cr2-parallel2" class="mark" d="M310 344 l10 6 l-10 6"/>
<text class="note" x="235" y="405">DE ∥ BC，圖不按比例</text>
</svg>
