<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="u17-s014-fig001-title u17-s014-fig001-desc">
<title id="u17-s014-fig001-title">矩形與正方形比較</title><desc id="u17-s014-fig001-desc">左側矩形標示等長對角線，右側正方形標示等長且垂直對角線。 圖形不一定按比例，請依標示與題幹條件推理。</desc>
<style>line,path,polygon,rect,ellipse,circle{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} text{fill:#111;stroke:none;font-size:14px;font-family:sans-serif}</style><g>
<rect x='25' y='55' width='155' height='125'/><line x1='25' y1='55' x2='180' y2='180'/><line x1='180' y1='55' x2='25' y2='180'/><text x='72' y='205'>矩形：對角線等長</text>
<rect x='230' y='45' width='130' height='130'/><line x1='230' y1='45' x2='360' y2='175'/><line x1='360' y1='45' x2='230' y2='175'/><text x='222' y='205'>正方形：等長且垂直</text>
</g>
</svg>