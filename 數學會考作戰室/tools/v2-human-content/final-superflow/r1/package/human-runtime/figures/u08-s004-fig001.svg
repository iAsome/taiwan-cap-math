<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">三個角以 x 表示的三角形</title><desc id="desc">三角形 ABC，A 角標示 x 度，B 角標示 x 加 20 度，C 角標示 2x 減 10 度。圖形未按比例。</desc>
<polygon points="360,55 110,320 610,320" fill="none" stroke="currentColor" stroke-width="4"/>
<text x="360" y="42" text-anchor="middle" font-size="24">A</text><text x="88" y="345" text-anchor="middle" font-size="24">B</text><text x="632" y="345" text-anchor="middle" font-size="24">C</text>
<path d="M327 90 A50 50 0 0 1 393 90" fill="none" stroke="currentColor" stroke-width="3"/><text x="360" y="118" text-anchor="middle" font-size="23">x°</text>
<path d="M140 287 A45 45 0 0 1 168 320" fill="none" stroke="currentColor" stroke-width="3"/><text x="205" y="292" text-anchor="middle" font-size="22">(x+20)°</text>
<path d="M552 320 A45 45 0 0 1 580 287" fill="none" stroke="currentColor" stroke-width="3"/><text x="515" y="292" text-anchor="middle" font-size="22">(2x−10)°</text>
<text x="360" y="375" text-anchor="middle" font-size="18">示意圖，未按比例；角度以標示為準</text></svg>