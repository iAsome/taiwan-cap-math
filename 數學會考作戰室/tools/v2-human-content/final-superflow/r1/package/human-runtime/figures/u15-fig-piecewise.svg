0" y2="320.0" stroke="#e5e7eb" stroke-width="1" /><line x1="80" y1="360.0" x2="580" y2="360.0" stroke="#e5e7eb" stroke-width="1" /><line id="u15-fig-piecewise-x-axis" x1="80" y1="253.3" x2="590" y2="253.3" stroke="#111" stroke-width="2" marker-end="url(#arrow)" /><line id="u15-fig-piecewise-y-axis" x1="330.0" y1="360" x2="330.0" y2="30" stroke="#111" stroke-width="2" marker-end="url(#arrow)" /><text x="608" y="281.3" font-size="16">x</text><text x="340.0" y="50" font-size="16">y</text><text x="68.0" y="273.3" font-size="12">-4</text><text x="318.0" y="273.3" font-size="12">0</text><text x="568.0" y="273.3" font-size="12">4</text><text x="295.0" y="364.0" font-size="12">-4</text><text x="295.0" y="257.3" font-size="12">0</text><text x="295.0" y="44.0" font-size="12">8</text><line id="u15-fig-piecewise-obj-1" x1="80.0" y1="333.3" x2="330.0" y2="226.7" stroke="#1f2937" stroke-width="3" /><text x="211.0" y="272.0" font-size="14">第一段 x≤0</text><circle cx="330.0" cy="226.7" r="5" fill="#111" /><line id="u15-fig-piecewise-obj-2" x1="330.0" y1="226.7" x2="517.5" y2="66.7" stroke="#1f2937" stroke-width="3" stroke-dasharray="8 5" /><text x="429.8" y="138.7" font-size="14">第二段 x&gt;0</text><circle cx="330.0" cy="226.7" r="6" fill="white" stroke="#111" stroke-width="2" /><circle id="u15-fig-piecewise-obj-3" cx="330.0" cy="226.7" r="6" fill="#111" /><text x="338.0" y="218.7" font-size="14">分界 (0,1)</text><text x="80" y="400" font-size="12">圖形依坐標刻度繪製；線條粗細不可作為數值依據。</text></svg>