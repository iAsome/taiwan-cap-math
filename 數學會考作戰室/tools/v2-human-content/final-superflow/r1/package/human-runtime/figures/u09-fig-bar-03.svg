<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">四隊募款金額長條圖</title><desc id="desc">甲48、乙52、丙45、丁55千元，水平虛線為50千元加碼門檻。</desc>
<style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;}</style>
<rect width="640" height="400" fill="white"/><text x="320" y="28" text-anchor="middle" font-size="22">四隊募款金額</text>
<g stroke="#aaa"><line x1="90" y1="280" x2="600" y2="280"/><line x1="90" y1="230" x2="600" y2="230"/><line x1="90" y1="180" x2="600" y2="180"/><line x1="90" y1="130" x2="600" y2="130"/><line x1="90" y1="80" x2="600" y2="80"/></g>
<g stroke="#222" stroke-width="2"><line x1="90" y1="330" x2="600" y2="330"/><line x1="90" y1="330" x2="90" y2="30"/></g>
<line x1="90" y1="80" x2="600" y2="80" stroke="#555" stroke-width="3" stroke-dasharray="10 8"/><text x="595" y="68" text-anchor="end" font-size="16">加碼門檻50</text>
<g font-size="15" text-anchor="end"><text x="82" y="335">0</text><text x="82" y="285">10</text><text x="82" y="235">20</text><text x="82" y="185">30</text><text x="82" y="135">40</text><text x="82" y="85">50</text></g>
<g fill="#dfc9b8" stroke="#222" stroke-width="2"><rect x="130" y="90" width="70" height="240"/><rect x="250" y="70" width="70" height="260"/><rect x="370" y="105" width="70" height="225"/><rect x="490" y="55" width="70" height="275"/></g>
<g font-size="18" text-anchor="middle"><text x="165" y="84">48</text><text x="285" y="64">52</text><text x="405" y="99">45</text><text x="525" y="49">55</text><text x="165" y="355">甲</text><text x="285" y="355">乙</text><text x="405" y="355">丙</text><text x="525" y="355">丁</text></g>
<text x="31" y="190" font-size="16" transform="rotate(-90 31 190)" text-anchor="middle">金額（千元）</text><text x="345" y="385" font-size="16" text-anchor="middle">隊別</text>
