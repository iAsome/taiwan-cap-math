<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">長方形長比寬多四公尺示意圖</title><desc id="desc">未按比例的長方形，水平邊標示 x 加 4 公尺，垂直邊標示 x 公尺，內部標示面積 60 平方公尺。</desc>
<rect x="145" y="90" width="350" height="220" fill="none" stroke="currentColor" stroke-width="4"/>
<text x="320" y="350" font-size="28" text-anchor="middle">x＋4 m</text><text x="105" y="205" font-size="28" text-anchor="middle" transform="rotate(-90 105 205)">x m</text>
<text x="320" y="210" font-size="30" text-anchor="middle">面積 60 m²</text><text x="320" y="382" font-size="19" text-anchor="middle">未按比例</text>
</svg>