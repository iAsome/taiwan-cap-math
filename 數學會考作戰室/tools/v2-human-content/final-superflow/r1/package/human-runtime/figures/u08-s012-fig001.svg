<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
<title id="title">長方體與右側視線方向</title><desc id="desc">長方體的長為 9 公分、寬為 4 公分、高為 6 公分。箭頭由右側指向長方體，表示右側視圖保留寬與高。</desc>
<g fill="none" stroke="currentColor" stroke-width="4"><rect x="210" y="115" width="330" height="210"/><path d="M210 115 L300 55 H630 L540 115 M540 115 L630 55 V265 L540 325 M630 265 L540 325"/></g>
<text x="375" y="355" text-anchor="middle" font-size="23">長 9 公分</text><text x="594" y="315" text-anchor="middle" font-size="23" transform="rotate(-34 594 315)">寬 4 公分</text><text x="170" y="225" text-anchor="middle" font-size="23" transform="rotate(-90 170 225)">高 6 公分</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<line x1="760" y1="210" x2="665" y2="210" stroke="currentColor" stroke-width="5" marker-end="url(#arr)"/><text x="715" y="180" text-anchor="middle" font-size="22">由右側看</text>
<text x="410" y="405" text-anchor="middle" font-size="18">示意圖，未按比例；尺寸以標示為準</text></svg>