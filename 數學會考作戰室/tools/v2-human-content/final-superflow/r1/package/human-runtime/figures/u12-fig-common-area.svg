<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title desc">
<title id="title">共享高度的兩個並排長方形</title>
<desc id="desc">一個大長方形被垂直分成左右兩區，兩區共同高度標為 h，左右寬分別標為 u 與 v，圖不按比例。</desc>
<rect x="90" y="70" width="500" height="210" fill="none" stroke="currentColor" stroke-width="4"/>
<line x1="360" y1="70" x2="360" y2="280" stroke="currentColor" stroke-width="4"/>
<line x1="65" y1="70" x2="65" y2="280" stroke="currentColor" stroke-width="2"/>
<line x1="55" y1="70" x2="75" y2="70" stroke="currentColor" stroke-width="2"/>
<line x1="55" y1="280" x2="75" y2="280" stroke="currentColor" stroke-width="2"/>
<text x="35" y="185" font-size="24">h</text>
<text x="215" y="320" font-size="24">u</text>
<text x="465" y="320" font-size="24">v</text>
<text x="195" y="185" font-size="24">面積 hu</text>
<text x="425" y="185" font-size="24">面積 hv</text>
<text x="200" y="40" font-size="20">示意圖不按比例</text>
</svg>