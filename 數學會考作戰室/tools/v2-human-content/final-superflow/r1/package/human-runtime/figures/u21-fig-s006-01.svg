<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 680 400" width="680" height="400"><title>由兩個等高點求對稱軸</title><desc>拋物線上 A 負五逗號六與 B 一逗號六等高，以水平線連接，兩點中點的垂直虛線為 x=-2。</desc><rect x="1" y="1" width="678" height="398" fill="white" stroke="black"/><line x1="50" y1="320" x2="640" y2="320" stroke="black" stroke-width="2"/><line x1="410" y1="370" x2="410" y2="30" stroke="black" stroke-width="2"/><path d="M90 55 C120 110 140 160 170 160 C195 270 220 350 250 350 C280 350 305 270 330 160 C360 160 380 110 400 55" fill="none" stroke="black" stroke-width="4"/><line x1="170" y1="160" x2="330" y2="160" stroke="black" stroke-width="2"/><circle cx="170" cy="160" r="7" fill="black"/><circle cx="330" cy="160" r="7" fill="black"/><line x1="250" y1="45" x2="250" y2="350" stroke="black" stroke-width="2" stroke-dasharray="8 7"/><text x="95" y="150" font-size="18">A(-5,6)</text><text x="340" y="150" font-size="18">B(1,6)</text><text x="260" y="67" font-size="18">x=-2</text><text x="72" y="385" font-size="17">(-5+1)÷2=-2；兩點到虛線的水平距離相同。</text></svg>