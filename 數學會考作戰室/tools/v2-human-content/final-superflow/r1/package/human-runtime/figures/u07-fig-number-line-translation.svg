<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">數線翻譯的中性端點圖例</title><desc id="desc">四個小圖依序展示空心向左、實心向左、空心向右、實心向右；端點皆標為 c，不提供特定題目的答案。</desc>
<defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z"/></marker></defs>
<g font-family="sans-serif" font-size="18" stroke="#111" fill="none" stroke-linecap="round">
<g transform="translate(25 35)"><line x1="0" y1="35" x2="145" y2="35" marker-end="url(#a2)"/><circle cx="78" cy="35" r="8" fill="white" stroke-width="3"/><line x1="68" y1="35" x2="8" y2="35" marker-end="url(#a2)" stroke-width="6"/><text x="73" y="70" fill="#111">c</text></g>
<g transform="translate(195 35)"><line x1="0" y1="35" x2="145" y2="35" marker-end="url(#a2)"/><circle cx="78" cy="35" r="8" fill="#111" stroke-width="3"/><line x1="68" y1="35" x2="8" y2="35" marker-end="url(#a2)" stroke-width="6"/><text x="73" y="70" fill="#111">c</text></g>
<g transform="translate(365 35)"><line x1="0" y1="35" x2="145" y2="35" marker-end="url(#a2)"/><circle cx="68" cy="35" r="8" fill="white" stroke-width="3"/><line x1="78" y1="35" x2="137" y2="35" marker-end="url(#a2)" stroke-width="6"/><text x="63" y="70" fill="#111">c</text></g>
<g transform="translate(535 35)"><line x1="0" y1="35" x2="145" y2="35" marker-end="url(#a2)"/><circle cx="68" cy="35" r="8" fill="#111" stroke-width="3"/><line x1="78" y1="35" x2="137" y2="35" marker-end="url(#a2)" stroke-width="6"/><text x="63" y="70" fill="#111">c</text></g>
</g><g font-family="sans-serif" font-size="20" fill="#111"><text x="55" y="170">空心向左</text><text x="225" y="170">實心向左</text><text x="395" y="170">空心向右</text><text x="565" y="170">實心向右</text><text x="185" y="215">方向與端點必須分開判讀</text></g></svg>