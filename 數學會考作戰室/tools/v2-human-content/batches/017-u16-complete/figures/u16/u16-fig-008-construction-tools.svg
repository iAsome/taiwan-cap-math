<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="u16-fig-008-construction-tools-title u16-fig-008-construction-tools-desc">
<title id="u16-fig-008-construction-tools-title">無刻度直尺與圓規的允許操作</title>
<desc id="u16-fig-008-construction-tools-desc">左側畫無刻度直尺只能連兩點，右側畫圓規跨距搬運，中央列出不可直接量長度的警示。</desc>
<rect x="1" y="1" width="358" height="238" fill="white" stroke="black"/>
<g fill="none" stroke="black" stroke-width="2.2"><rect x="25" y="65" width="135" height="24"/><circle cx="45" cy="150" r="4" fill="black"/><circle cx="140" cy="150" r="4" fill="black"/><path d="M45 150 L140 150"/>
<path d="M235 55 L205 175 L270 175 Z"/><circle cx="205" cy="175" r="4" fill="black"/><path d="M205 175 A95 95 0 0 1 300 80" stroke-dasharray="5 4"/></g>
<g font-size="15" font-family="Noto Sans CJK TC, sans-serif"><text x="40" y="52">直尺：只畫直線</text><text x="218" y="43">圓規：搬運距離</text><text x="80" y="212">不可用刻度直接量長度或角度</text></g>
</svg>