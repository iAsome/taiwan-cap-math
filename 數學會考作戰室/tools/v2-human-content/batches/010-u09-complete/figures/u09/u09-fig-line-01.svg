<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">週一至週五最高溫折線圖</title><desc id="desc">週一20、週二23、週三21、週四25、週五24攝氏度。</desc>
<style>text{font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif;}</style>
<rect width="640" height="400" fill="white"/><text x="320" y="28" text-anchor="middle" font-size="22">週一至週五最高溫</text>
<g stroke="#aaa"><line x1="90" y1="330" x2="600" y2="330"/><line x1="90" y1="270" x2="600" y2="270"/><line x1="90" y1="210" x2="600" y2="210"/><line x1="90" y1="150" x2="600" y2="150"/><line x1="90" y1="90" x2="600" y2="90"/></g>
<g stroke="#222" stroke-width="2"><line x1="90" y1="330" x2="600" y2="330"/><line x1="90" y1="330" x2="90" y2="55"/></g>
<g font-size="15" text-anchor="end"><text x="82" y="335">18</text><text x="82" y="275">20</text><text x="82" y="215">22</text><text x="82" y="155">24</text><text x="82" y="95">26</text></g>
<polyline points="130,270 240,180 350,240 460,120 570,150" fill="none" stroke="#345" stroke-width="4"/>
<g fill="white" stroke="#345" stroke-width="3"><circle cx="130" cy="270" r="6"/><circle cx="240" cy="180" r="6"/><circle cx="350" cy="240" r="6"/><circle cx="460" cy="120" r="6"/><circle cx="570" cy="150" r="6"/></g>
<g font-size="17" text-anchor="middle"><text x="130" y="256">20</text><text x="240" y="166">23</text><text x="350" y="226">21</text><text x="460" y="106">25</text><text x="570" y="136">24</text><text x="130" y="355">週一</text><text x="240" y="355">週二</text><text x="350" y="355">週三</text><text x="460" y="355">週四</text><text x="570" y="355">週五</text></g>
<text x="30" y="195" font-size="16" transform="rotate(-90 30 195)" text-anchor="middle">最高溫（°C）</text><text x="345" y="385" font-size="16" text-anchor="middle">日期</text>
</svg>
