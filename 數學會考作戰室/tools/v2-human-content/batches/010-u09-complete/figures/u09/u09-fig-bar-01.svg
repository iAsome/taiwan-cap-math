<g font-size="18" text-anchor="middle"><text x="165" y="70">18</text><text x="285" y="154">12</text><text x="405" y="112">15</text><text x="525" y="196">9</text><text x="165" y="355">籃球</text><text x="285" y="355">音樂</text><text x="405" y="355">美術</text><text x="525" y="355">科學</text></g>
<text x="30" y="190" font-size="16" transform="rotate(-90 30 190)" text-anchor="middle">人數（人）</text><text x="345" y="385" font-size="16" text-anchor="middle">社團</text>
