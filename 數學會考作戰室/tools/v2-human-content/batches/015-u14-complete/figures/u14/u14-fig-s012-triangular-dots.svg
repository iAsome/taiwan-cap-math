<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" style="font-family:Noto Sans CJK TC,sans-serif" aria-labelledby="title desc"><title id="title">前三個三角點陣</title><desc id="desc">第1階段一點，第2階段三點，第3階段六點，點以逐列增加的三角形排列。</desc><rect x="10" y="10" width="700" height="240" rx="12" fill="white" stroke="black"/><g fill="black"><circle cx="105" cy="100" r="8"/><circle cx="300" cy="75" r="8"/><circle cx="280" cy="110" r="8"/><circle cx="320" cy="110" r="8"/><circle cx="545" cy="60" r="8"/><circle cx="525" cy="95" r="8"/><circle cx="565" cy="95" r="8"/><circle cx="505" cy="130" r="8"/><circle cx="545" cy="130" r="8"/><circle cx="585" cy="130" r="8"/></g><g font-size="22" text-anchor="middle"><text x="105" y="190">第1階段：1點</text><text x="300" y="190">第2階段：3點</text><text x="545" y="190">第3階段：6點</text></g></svg>
