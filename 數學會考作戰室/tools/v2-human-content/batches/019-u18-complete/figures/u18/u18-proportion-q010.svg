<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="u18-proportion-q010-title u18-proportion-q010-desc">
<title id="u18-proportion-q010-title">三角形支架與平行橫桿</title>
<desc id="u18-proportion-q010-desc">三角形 ABC 內有線段 DE 平行底邊 BC，D 在 AB 上、E 在 AC 上，標示 AD、DB、AE。</desc>
<rect width="640" height="420" fill="white"/>
<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#333;stroke-width:2;fill:none}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}
.mark{stroke:#111;stroke-width:2}
.txt{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#111}
.small{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;fill:#111}
.note{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:16px;fill:#333}
</style>
<path id="tri-main" class="line" d="M320 55 L105 350 L545 350 Z"/>
<line id="parallel-de" class="line" x1="230" y1="180" x2="410" y2="180"/>
<text class="txt" x="310" y="42">A</text><text class="txt" x="76" y="377">B</text><text class="txt" x="553" y="377">C</text>
<text class="txt" x="202" y="176">D</text><text class="txt" x="420" y="176">E</text>
<text class="small" x="200" y="110">18 cm</text><text class="small" x="120" y="270">12 cm</text>
<text class="small" x="415" y="112">15 cm</text><text class="small" x="458" y="270">EC</text>
<path id="parallel-mark-de" class="mark" d="M312 174 l10 6 l-10 6 M328 174 l10 6 l-10 6"/>
<path id="parallel-mark-bc" class="mark" d="M302 344 l10 6 l-10 6 M318 344 l10 6 l-10 6"/>
<text class="note" x="225" y="405">圖不按比例，DE ∥ BC</text>
</svg>
