<title id="u18-shadow-q010-title">標桿與旗桿的同時刻影子</title>
<desc id="u18-shadow-q010-desc">左側標桿AB高1.5公尺、影BC長2公尺；右側旗桿DE高未知、影EF長14公尺；兩條陽光斜線平行。</desc>
<rect width="640" height="420" fill="white"/>
<style>
