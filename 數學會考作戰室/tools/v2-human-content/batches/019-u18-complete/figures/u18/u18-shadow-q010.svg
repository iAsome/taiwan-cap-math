<text class="txt" x="420" y="95">D</text><text class="txt" x="420" y="375">E</text><text class="txt" x="595" y="375">F</text>
<text class="small" x="75" y="290">1.5 m</text><text class="small" x="185" y="370">2 m</text><text class="small" x="495" y="370">14 m</text>
<path id="right-b-shadow" class="thin" d="M145 330 h15 v15"/><path id="right-e-shadow" class="thin" d="M440 330 h15 v15"/>
