<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" style="font-family: Noto Sans CJK TC, sans-serif" aria-labelledby="title desc"><title id="title">邊長 x+5 與 x-5 的長方形</title><desc id="desc">一個不按比例的長方形，水平邊為 x+5 公尺，垂直邊為 x-5 公尺。</desc><rect x="70" y="55" width="290" height="150" fill="none" stroke="currentColor" stroke-width="3"/><line x1="70" y1="38" x2="360" y2="38" stroke="currentColor" stroke-width="1.5"/><path d="M70 38 l10 -5 v10 z M360 38 l-10 -5 v10 z" fill="currentColor"/><text x="185" y="28" font-size="22">x+5 公尺</text><line x1="48" y1="55" x2="48" y2="205" stroke="currentColor" stroke-width="1.5"/><path d="M48 55 l-5 10 h10 z M48 205 l-5 -10 h10 z" fill="currentColor"/><text x="-130" y="30" font-size="22" text-anchor="middle" transform="rotate(-90)">x-5 公尺</text></svg>
