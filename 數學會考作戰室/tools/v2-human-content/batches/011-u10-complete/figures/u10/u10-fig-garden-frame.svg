<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" role="img" style="font-family: Noto Sans CJK TC, sans-serif" aria-labelledby="title desc"><title id="title">外花園與中央草地的矩形框</title><desc id="desc">外矩形尺寸 x+6 乘 x+4 公尺，內矩形草地尺寸 x+2 乘 x 公尺，兩者之間為鋪面，圖形不按比例。</desc><rect x="60" y="55" width="340" height="230" fill="none" stroke="currentColor" stroke-width="3"/><rect x="120" y="105" width="220" height="130" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="8 5"/><text x="175" y="35" font-size="21">外長 x+6 公尺</text><text x="28" y="210" font-size="21" transform="rotate(-90 28 210)">外寬 x+4 公尺</text><text x="165" y="96" font-size="19">草地長 x+2 公尺</text><text x="110" y="205" font-size="19" transform="rotate(-90 110 205)">草地寬 x 公尺</text><text x="205" y="180" font-size="22">草地</text><text x="75" y="90" font-size="18">鋪面</text></svg>
