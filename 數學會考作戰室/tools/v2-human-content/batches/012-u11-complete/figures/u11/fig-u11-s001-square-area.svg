<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="fig-u11-s001-square-area-title fig-u11-s001-square-area-desc"><title id="fig-u11-s001-square-area-title">正方形面積與邊長</title><desc id="fig-u11-s001-square-area-desc">一個正方形，中央標示面積196平方公分，下方以s大於0表示邊長。</desc><rect width="100%" height="100%" fill="white"/><rect x="110" y="50" width="200" height="200" fill="white" stroke="#111" stroke-width="4"/><text x="210" y="145" text-anchor="middle" font-size="22">面積 196 cm²</text><text x="210" y="278" text-anchor="middle" font-size="20">邊長 s &gt; 0</text></svg>