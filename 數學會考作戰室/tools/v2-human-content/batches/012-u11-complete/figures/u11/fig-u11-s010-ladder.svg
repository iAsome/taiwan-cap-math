<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="fig-u11-s010-ladder-title fig-u11-s010-ladder-desc"><title id="fig-u11-s010-ladder-title">梯子靠牆模型</title><desc id="fig-u11-s010-ladder-desc">垂直牆面與水平地面形成直角，一把10公尺梯子斜靠牆，梯腳離牆6公尺，高度標h。</desc><rect width="100%" height="100%" fill="white"/><line x1="90" y1="40" x2="90" y2="280" stroke="#111" stroke-width="5"/><line x1="60" y1="280" x2="430" y2="280" stroke="#111" stroke-width="5"/><line x1="90" y1="70" x2="360" y2="280" stroke="#111" stroke-width="6"/><path d="M90 250 L120 250 L120 280" fill="none" stroke="#111" stroke-width="3"/><text x="245" y="155" text-anchor="middle" font-size="20" transform="rotate(38 245 155)">梯子 10 m</text><text x="225" y="310" text-anchor="middle" font-size="20">離牆 6 m</text><text x="52" y="175" text-anchor="middle" font-size="20" transform="rotate(-90 52 175)">高度 h</text></svg>