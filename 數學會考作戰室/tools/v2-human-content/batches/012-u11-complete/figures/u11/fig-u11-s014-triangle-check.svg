<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330" role="img" aria-labelledby="fig-u11-s014-triangle-check-title fig-u11-s014-triangle-check-desc"><title id="fig-u11-s014-triangle-check-title">三邊長度條件圖</title><desc id="fig-u11-s014-triangle-check-desc">一個不按比例繪製的三角形，三邊分別標示30、40、50；圖中沒有直角記號或平方關係。</desc><rect width="100%" height="100%" fill="white"/><path d="M70 270 L165 80 L430 270 Z" fill="white" stroke="#111" stroke-width="4"/><text x="92" y="170" text-anchor="middle" font-size="21">30</text><text x="250" y="300" text-anchor="middle" font-size="21">40</text><text x="305" y="160" text-anchor="middle" font-size="21">50</text><text x="250" y="45" text-anchor="middle" font-size="20">圖形未按比例</text></svg>