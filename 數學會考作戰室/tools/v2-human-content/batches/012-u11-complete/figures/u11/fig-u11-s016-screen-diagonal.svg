<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-labelledby="fig-u11-s016-screen-diagonal-title fig-u11-s016-screen-diagonal-desc"><title id="fig-u11-s016-screen-diagonal-title">方形螢幕對角線</title><desc id="fig-u11-s016-screen-diagonal-desc">正方形螢幕邊長12公分，畫出從左下到右上的對角線，標示保護膜至少需要長度d。</desc><rect width="100%" height="100%" fill="white"/><rect x="70" y="45" width="280" height="220" rx="8" fill="white" stroke="#111" stroke-width="5"/><line x1="70" y1="265" x2="350" y2="45" stroke="#111" stroke-width="4"/><text x="210" y="300" text-anchor="middle" font-size="20">邊長 12 cm</text><text x="225" y="145" text-anchor="middle" font-size="20" transform="rotate(-38 225 145)">保護膜至少 d</text></svg>