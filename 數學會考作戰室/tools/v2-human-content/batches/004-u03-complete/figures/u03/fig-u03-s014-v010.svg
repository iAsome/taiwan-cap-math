<line x1="110" y1="215" x2="790" y2="215" stroke="currentColor" stroke-width="3"/>
<line x1="310" y1="65" x2="310" y2="310" stroke="currentColor" stroke-width="3"/>
<line x1="550" y1="65" x2="550" y2="310" stroke="currentColor" stroke-width="3"/>
<text x="210" y="105" text-anchor="middle" font-size="25" font-weight="700">方案</text>
<text x="430" y="105" text-anchor="middle" font-size="25" font-weight="700">基本費</text>
<text x="670" y="105" text-anchor="middle" font-size="25" font-weight="700">每次費用</text>
