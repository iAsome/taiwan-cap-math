<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">甲地經休息站到乙地的分段行程示意圖</title>
  <desc id="desc">甲地到休息站距離十八公里，速率每小時六公里；休息站到乙地距離為 x 公里，速率每小時九公里；全程五小時。圖中線段長度不代表實際距離比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <circle cx="90" cy="150" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
  <circle cx="390" cy="150" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
  <circle cx="870" cy="150" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
  <line x1="112" y1="150" x2="368" y2="150" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="412" y1="150" x2="848" y2="150" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="90" y="112" text-anchor="middle" font-size="26" font-weight="700">甲地</text>
  <text x="390" y="112" text-anchor="middle" font-size="26" font-weight="700">休息站</text>
  <text x="870" y="112" text-anchor="middle" font-size="26" font-weight="700">乙地</text>
  <text x="240" y="198" text-anchor="middle" font-size="24">18 公里</text>
  <text x="240" y="230" text-anchor="middle" font-size="22">6 公里/時</text>
  <text x="630" y="198" text-anchor="middle" font-size="24">x 公里</text>
  <text x="630" y="230" text-anchor="middle" font-size="22">9 公里/時</text>
  <rect x="350" y="265" width="260" height="46" rx="8" fill="white" stroke="currentColor" stroke-width="3"/>
  <text x="480" y="296" text-anchor="middle" font-size="22">全程時間：5 小時</text>
  <text x="480" y="350" text-anchor="middle" font-size="21" font-weight="700">示意圖不按比例繪製</text>
</svg>
