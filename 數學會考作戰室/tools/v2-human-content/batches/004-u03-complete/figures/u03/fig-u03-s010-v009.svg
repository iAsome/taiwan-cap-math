<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" aria-labelledby="t d">
<title id="t">甲地經休息站到乙地的分段行程</title>
<desc id="d">不按比例的折線路線示意圖。甲地到休息站距離十八公里，步行速率每小時六公里；休息站到乙地距離未知，前進速率每小時九公里，全程共五小時。線段長短不得用來推測距離。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<circle cx="100" cy="145" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
<circle cx="385" cy="100" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
<circle cx="840" cy="175" r="18" fill="white" stroke="currentColor" stroke-width="4"/>
<line x1="120" y1="142" x2="363" y2="104" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
<line x1="407" y1="104" x2="818" y2="171" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/>
<text x="100" y="100" text-anchor="middle" font-size="26" font-weight="700">甲地</text>
<text x="385" y="55" text-anchor="middle" font-size="26" font-weight="700">休息站</text>
<text x="840" y="130" text-anchor="middle" font-size="26" font-weight="700">乙地</text>
<text x="240" y="170" text-anchor="middle" font-size="24">18 公里</text>
<text x="240" y="200" text-anchor="middle" font-size="22">6 公里/時</text>
<text x="620" y="205" text-anchor="middle" font-size="24">x 公里</text>
<text x="620" y="235" text-anchor="middle" font-size="22">9 公里/時</text>
<rect x="100" y="255" width="260" height="42" rx="8" fill="white" stroke="currentColor" stroke-width="3"/>
<text x="230" y="284" text-anchor="middle" font-size="22">全程時間：5 小時</text>
<text x="650" y="283" text-anchor="middle" font-size="22" font-weight="700">示意圖不按比例</text>
</svg>
