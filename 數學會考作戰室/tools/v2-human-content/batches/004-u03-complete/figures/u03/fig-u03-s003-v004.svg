<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
<title id="t">平衡天平表示 x 加 3 等於 8</title>
<desc id="d">天平左盤有一個標示 x 的盒子與三個相同砝碼，右盤有八個相同砝碼，兩盤水平平衡。</desc>
<line x1="450" y1="70" x2="450" y2="310" stroke="currentColor" stroke-width="8"/>
<polygon points="390,340 510,340 450,270" fill="none" stroke="currentColor" stroke-width="6"/>
<line x1="180" y1="145" x2="720" y2="145" stroke="currentColor" stroke-width="7"/>
<circle cx="450" cy="145" r="14" fill="white" stroke="currentColor" stroke-width="5"/>
<line x1="250" y1="145" x2="205" y2="245" stroke="currentColor" stroke-width="4"/>
<line x1="650" y1="145" x2="695" y2="245" stroke="currentColor" stroke-width="4"/>
<path d="M125 245 H285 L255 300 H155 Z" fill="none" stroke="currentColor" stroke-width="4"/>
<path d="M615 245 H775 L745 300 H645 Z" fill="none" stroke="currentColor" stroke-width="4"/>
<rect x="145" y="190" width="62" height="50" rx="6" fill="white" stroke="currentColor" stroke-width="3"/>
<text x="176" y="224" text-anchor="middle" font-size="28" font-weight="700">x</text>
<g fill="white" stroke="currentColor" stroke-width="3">
<circle cx="225" cy="222" r="15"/><circle cx="255" cy="222" r="15"/><circle cx="240" cy="192" r="15"/>
<circle cx="650" cy="220" r="15"/><circle cx="685" cy="220" r="15"/><circle cx="720" cy="220" r="15"/><circle cx="755" cy="220" r="15"/>
<circle cx="667" cy="188" r="15"/><circle cx="702" cy="188" r="15"/><circle cx="737" cy="188" r="15"/><circle cx="702" cy="156" r="15"/>
</g>
<text x="205" y="365" text-anchor="middle" font-size="23">左盤：x 與 3 個單位砝碼</text>
<text x="695" y="365" text-anchor="middle" font-size="23">右盤：8 個單位砝碼</text>
</svg>
