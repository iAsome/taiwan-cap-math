<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 700 420" width="700" height="420"><title>頂點式中 a h k 的圖形意義</title><desc>拋物線 y=2(x-3)²-4 的頂點 V 三負四、對稱軸 x=3，旁邊以三個文字框說明 a h k。</desc><rect x="1" y="1" width="698" height="418" fill="white" stroke="black"/><line x1="35" y1="260" x2="430" y2="260" stroke="black" stroke-width="2"/><line x1="160" y1="390" x2="160" y2="30" stroke="black" stroke-width="2"/><line x1="300" y1="35" x2="300" y2="365" stroke="black" stroke-width="2" stroke-dasharray="8 7"/><path d="M170 45 Q235 345 300 345 Q365 345 425 45" fill="none" stroke="black" stroke-width="4"/><circle cx="300" cy="345" r="7" fill="black"/><text x="326" y="334" font-size="18">V(3,-4)</text><text x="306" y="58" font-size="17">x=3</text><rect x="470" y="55" width="190" height="70" fill="white" stroke="black"/><rect x="470" y="165" width="190" height="70" fill="white" stroke="black"/><rect x="470" y="275" width="190" height="70" fill="white" stroke="black"/><text x="485" y="85" font-size="18">a=2：向上且較窄</text><text x="485" y="195" font-size="18">h=3：軸 x=3</text><text x="485" y="305" font-size="18">k=-4：頂點高度</text><text x="35" y="410" font-size="18">y=2(x-3)²-4</text></svg>