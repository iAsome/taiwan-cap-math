<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 640 400" width="640" height="400"><title>開口向上與開口向下</title><desc>左側向上拋物線標示 a 大於零，右側向下拋物線標示 a 小於零，兩圖各標出頂點。</desc><rect x="1" y="1" width="638" height="398" fill="white" stroke="black"/><line x1="320" y1="20" x2="320" y2="380" stroke="black" stroke-width="2"/><path d="M45 55 C80 180 120 330 160 330 C200 330 240 180 275 55" fill="none" stroke="black" stroke-width="4"/><circle cx="160" cy="330" r="6" fill="black"/><path d="M365 340 C400 190 440 65 480 65 C520 65 560 190 595 340" fill="none" stroke="black" stroke-width="4"/><circle cx="480" cy="65" r="6" fill="black"/><text x="80" y="35" font-size="22">a&gt;0：開口向上</text><text x="380" y="35" font-size="22">a&lt;0：開口向下</text><text x="130" y="360" font-size="17">最低頂點</text><text x="500" y="72" font-size="17">最高頂點</text><text x="65" y="390" font-size="16">常數項改變位置；最高次係數 a 的正負決定方向。</text></svg>