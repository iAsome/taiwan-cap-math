<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="u21-fig-s011-01-title u21-fig-s011-01-desc" viewBox="0 0 720 420" width="720" height="420"><title id="u21-fig-s011-01-title">球體高度模型與有效時間</title><desc id="u21-fig-s011-01-desc">時間高度圖 h=-(t-3)²+16，標出初始高度七公尺、最高點三秒十六公尺、落地七秒，負根負一秒用灰色虛線標為事件前。</desc><rect x="1" y="1" width="718" height="418" fill="white" stroke="black"/><line x1="70" y1="340" x2="680" y2="340" stroke="black" stroke-width="2"/><line x1="150" y1="390" x2="150" y2="35" stroke="black" stroke-width="2"/><path d="M70 340 C150 170 260 35 350 35 C440 35 550 170 630 340" fill="none" stroke="black" stroke-width="4"/><circle cx="150" cy="205" r="7" fill="black"/><circle cx="350" cy="35" r="7" fill="black"/><circle cx="630" cy="340" r="7" fill="black"/><circle cx="70" cy="340" r="6" fill="white" stroke="black" stroke-width="2"/><line x1="70" y1="340" x2="70" y2="385" stroke="black" stroke-dasharray="5 5"/><text x="45" y="195" font-size="17">t=0，h=7</text><text x="360" y="45" font-size="17">最高：(3,16)</text><text x="585" y="365" font-size="17">落地 t=7</text><text x="28" y="400" font-size="16">t=-1：事件前</text><text x="645" y="333">t</text><text x="158" y="48">h</text><text x="180" y="405" font-size="16">代數根仍須用 t≥0 的情境範圍篩選。</text></svg>