<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 640 400" width="640" height="400"><title>相同頂點但不同寬窄的兩條拋物線</title><desc>同一座標比例下，實線 y=2x² 較窄，虛線 y=二分之一 x² 較寬；兩者頂點都在原點。</desc><rect x="1" y="1" width="638" height="398" fill="white" stroke="black"/><line x1="50" y1="335" x2="600" y2="335" stroke="black" stroke-width="2"/><line x1="320" y1="370" x2="320" y2="35" stroke="black" stroke-width="2"/><path d="M205 55 Q260 335 320 335 Q380 335 435 55" fill="none" stroke="black" stroke-width="4"/><path d="M75 80 Q195 335 320 335 Q445 335 565 80" fill="none" stroke="black" stroke-width="4" stroke-dasharray="10 7"/><circle cx="320" cy="335" r="6" fill="black"/><text x="430" y="85" font-size="18">實線：y=2x²</text><text x="420" y="122" font-size="18">虛線：y=½x²</text><text x="70" y="385" font-size="16">同一刻度比較：|a| 較大者較窄。</text></svg>