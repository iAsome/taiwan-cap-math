<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">兩列積木的高度表</title><desc id="d">前列三欄高度依序為1、3、2，後列依序為2、1、2。從正面看每欄取前後兩列較高值。</desc><g stroke="currentColor" stroke-width="3" fill="none"><rect x="120" y="80" width="240" height="120"/><rect x="400" y="80" width="240" height="120"/><path d="M200 80V200 M280 80V200 M480 80V200 M560 80V200"/></g><g font-size="25" text-anchor="middle"><text x="240" y="55">前列</text><text x="520" y="55">後列</text><text x="160" y="150">1</text><text x="240" y="150">3</text><text x="320" y="150">2</text><text x="440" y="150">2</text><text x="520" y="150">1</text><text x="600" y="150">2</text></g><path d="M100 300 H660" stroke="currentColor" stroke-width="4"/><text x="380" y="340" text-anchor="middle" font-size="22">正面視線：每欄取前後最高值</text><text x="380" y="390" text-anchor="middle" font-size="18">示意圖，未按比例</text></svg>