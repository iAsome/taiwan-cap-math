<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" role="img" aria-labelledby="t d"><title id="t">半徑三高四的直圓錐</title><desc id="d">直圓錐的軸截面形成直角三角形，高為4公分、底面半徑為3公分、母線為未知量。</desc><ellipse cx="330" cy="325" rx="180" ry="55" fill="none" stroke="currentColor" stroke-width="4"/><path d="M330 55 L150 325 M330 55 L510 325" fill="none" stroke="currentColor" stroke-width="4"/><path d="M330 55V325 H510" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6"/><path d="M330 305h20v20" fill="none" stroke="currentColor" stroke-width="3"/><text x="305" y="195" font-size="24">4 公分</text><text x="405" y="350" font-size="24">3 公分</text><text x="445" y="170" font-size="26">母線 ?</text><text x="330" y="410" text-anchor="middle" font-size="18">軸截面示意圖，未按比例</text></svg>