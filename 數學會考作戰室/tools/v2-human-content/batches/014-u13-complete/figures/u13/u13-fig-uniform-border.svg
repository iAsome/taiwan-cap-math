<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">長方形四周等寬外擴示意圖</title><desc id="desc">內長方形為十公尺乘六公尺，外側四周等寬 x 公尺，外框尺寸標為十加二 x 與六加二 x，圖未按比例。</desc>
<rect x="95" y="55" width="450" height="290" fill="none" stroke="currentColor" stroke-width="4"/>
<rect x="185" y="115" width="270" height="170" fill="none" stroke="currentColor" stroke-width="4"/>
<line x1="95" y1="80" x2="185" y2="80" stroke="currentColor" stroke-width="2"/><path d="M100 74 L95 80 L100 86 M180 74 L185 80 L180 86" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="140" y="70" font-size="24" text-anchor="middle">x</text><text x="320" y="318" font-size="26" text-anchor="middle">10＋2x m</text>
<text x="62" y="200" font-size="26" text-anchor="middle" transform="rotate(-90 62 200)">6＋2x m</text>
<text x="320" y="205" font-size="27" text-anchor="middle">10 m × 6 m</text><text x="320" y="380" font-size="19" text-anchor="middle">外部大長方形面積 192 m²；未按比例</text>
</svg>