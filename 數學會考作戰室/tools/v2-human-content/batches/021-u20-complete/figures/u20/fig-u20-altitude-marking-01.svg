<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="fig-u20-altitude-marking-01-title fig-u20-altitude-marking-01-desc">
<title id="fig-u20-altitude-marking-01-title">高與直角標記位置圖</title>
<desc id="fig-u20-altitude-marking-01-desc">三角形ABC中從A作高AD至BC，垂足D有直角方框；另畫一條不通過頂點的垂線作對照。</desc>

<style>
.line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.aux{stroke:#555;stroke-width:2.5;fill:none;stroke-dasharray:8 7}
.mark{stroke:#111;stroke-width:2.5;fill:none}
.pt{fill:#111}
.lbl{font:18px sans-serif;fill:#111}
.small{font:15px sans-serif;fill:#111}
</style>

<path class="line" d="M70 250 L230 55 L420 250 Z"/>
<path class="line" d="M230 55 L230 250"/>
<path class="aux" d="M330 75 L330 250"/>
<path class="mark" d="M230 250 l14 0 l0 -14 M330 250 l14 0 l0 -14"/>
<text class="lbl" x="222" y="44">A</text><text class="lbl" x="48" y="270">B</text><text class="lbl" x="425" y="270">C</text><text class="lbl" x="217" y="274">D</text>
<text class="lbl" x="338" y="95">t</text>

</svg>
