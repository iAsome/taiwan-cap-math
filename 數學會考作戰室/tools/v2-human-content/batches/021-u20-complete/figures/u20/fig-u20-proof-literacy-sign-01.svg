<title id="fig-u20-proof-literacy-sign-01-title">不規則標誌內切圓設計流程圖</title>
<desc id="fig-u20-proof-literacy-sign-01-desc">不規則三角形ABC內畫兩條角平分虛線交於I，從I向三邊畫垂線段，尚未畫完整圓以避免直接洩漏。</desc>

