<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="title desc"><title id="title">Script letter pair A and a</title><desc id="desc">A connected-writing capital A appears on the left and lowercase a on the right.</desc><rect x="3" y="3" width="354" height="174" fill="#fff" stroke="#000" stroke-width="3"/><path d="M180 20v140" stroke="#000" stroke-dasharray="8 6"/><text x="90" y="125" text-anchor="middle" font-family="Segoe Script, cursive" font-size="96">A</text><text x="270" y="125" text-anchor="middle" font-family="Segoe Script, cursive" font-size="96">a</text><text x="90" y="160" text-anchor="middle" font-family="sans-serif" font-size="15">CAPITAL</text><text x="270" y="160" text-anchor="middle" font-family="sans-serif" font-size="15">LOWERCASE</text></svg>