<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Library seat signs</title><desc id="desc">左側點紋牌為 QUIET AREA、NO GROUP TALK；右側白牌為 GROUP AREA、TABLES FOR 4。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><rect x="80" y="65" width="250" height="165" fill="url(#dots)" stroke="#000" stroke-width="4"/><text x="205" y="120" text-anchor="middle" font-size="30" font-family="sans-serif">QUIET AREA</text><text x="205" y="175" text-anchor="middle" font-size="24" font-family="sans-serif">NO GROUP TALK</text><rect x="390" y="65" width="250" height="165" fill="#fff" stroke="#000" stroke-width="4"/><text x="515" y="120" text-anchor="middle" font-size="30" font-family="sans-serif">GROUP AREA</text><text x="515" y="175" text-anchor="middle" font-size="24" font-family="sans-serif">TABLES FOR 4</text></svg>