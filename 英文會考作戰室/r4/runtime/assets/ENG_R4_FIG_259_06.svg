<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Room schedule card</title><desc id="desc">黑白表格顯示 3:00 的 A 教室已滿，4:30 的 B 教室可用。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><rect x="90" y="55" width="540" height="190" fill="#fff" stroke="#000" stroke-width="4"/><path d="M90 115h540M90 180h540M300 55v190" stroke="#000" stroke-width="3"/><g font-family="sans-serif" font-size="24"><text x="120" y="95">TIME</text><text x="330" y="95">ROOM</text><text x="120" y="158">3:00</text><text x="330" y="158">A — FULL</text><text x="120" y="225">4:30</text><text x="330" y="225">B — OPEN</text></g></svg>