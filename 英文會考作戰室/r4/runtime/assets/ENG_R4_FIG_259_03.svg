<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Closed bridge and alternate route</title><desc id="desc">路線圖從 START 到 PARK；直行橋梁被叉掉，彎曲箭頭沿 GREEN STREET 通往公園。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="90" cy="150" r="34" fill="#fff" stroke="#000" stroke-width="4"/><text x="90" y="158" text-anchor="middle" font-size="20" font-family="sans-serif">START</text><path d="M125 150h180" stroke="#000" stroke-width="5"/><rect x="305" y="100" width="130" height="100" fill="url(#dots)" stroke="#000" stroke-width="4"/><text x="370" y="145" text-anchor="middle" font-size="22" font-family="sans-serif">BRIDGE</text><path d="M330 115l80 70m0-70l-80 70" stroke="#000" stroke-width="8"/><path d="M125 165q170 115 360 0" fill="none" stroke="#000" stroke-width="5" marker-end="url(#arrow)"/><text x="310" y="270" text-anchor="middle" font-size="24" font-family="sans-serif">GREEN STREET</text><circle cx="550" cy="150" r="34" fill="#fff" stroke="#000" stroke-width="4"/><text x="550" y="158" text-anchor="middle" font-size="20" font-family="sans-serif">PARK</text></svg>