<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Weather card for Friday</title><desc id="desc">黑白天氣卡標示 FRIDAY、雨雲、14°C 與 WINDY。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><text x="110" y="65" font-size="30" font-family="sans-serif" font-weight="700">FRIDAY</text><circle cx="190" cy="145" r="48" fill="url(#dots)" stroke="#000" stroke-width="4"/><path d="M150 190l-22 48m60-48l-22 48m60-48l-22 48" stroke="#000" stroke-width="5"/><path d="M120 110q70-70 140 0" fill="#fff" stroke="#000" stroke-width="4"/><text x="420" y="135" text-anchor="middle" font-size="48" font-family="sans-serif">14°C</text><text x="420" y="190" text-anchor="middle" font-size="28" font-family="sans-serif">WINDY</text></svg>