<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Food label with nut warning</title><desc id="desc">OAT BAR 包裝含點紋堅果圖示，警語框寫 WARNING、CONTAINS NUTS。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><rect x="100" y="40" width="520" height="220" fill="#fff" stroke="#000" stroke-width="4"/><text x="360" y="90" text-anchor="middle" font-size="32" font-family="sans-serif" font-weight="700">OAT BAR</text><path d="M170 145q45-55 90 0q-45 70-90 0z" fill="url(#dots)" stroke="#000" stroke-width="3"/><text x="215" y="215" text-anchor="middle" font-size="20" font-family="sans-serif">NUTS</text><rect x="310" y="125" width="250" height="90" fill="none" stroke="#000" stroke-width="4"/><text x="435" y="160" text-anchor="middle" font-size="24" font-family="sans-serif">WARNING</text><text x="435" y="195" text-anchor="middle" font-size="22" font-family="sans-serif">CONTAINS NUTS</text></svg>