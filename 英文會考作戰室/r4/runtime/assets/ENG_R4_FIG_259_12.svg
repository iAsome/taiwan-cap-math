<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Bus seat card</title><desc id="desc">BUS 1 的八個座位皆為點紋，文字寫 8 / 8 USED；右側標 NEXT 8:45。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><rect x="60" y="65" width="600" height="170" fill="#fff" stroke="#000" stroke-width="4"/><text x="120" y="110" font-size="24" font-family="sans-serif">BUS 1</text><g fill="url(#dots)" stroke="#000" stroke-width="2"><rect x="230" y="80" width="48" height="42"/><rect x="310" y="80" width="48" height="42"/><rect x="390" y="80" width="48" height="42"/><rect x="470" y="80" width="48" height="42"/><rect x="230" y="145" width="48" height="42"/><rect x="310" y="145" width="48" height="42"/><rect x="390" y="145" width="48" height="42"/><rect x="470" y="145" width="48" height="42"/></g><text x="120" y="205" font-size="24" font-family="sans-serif">8 / 8 USED</text><path d="M570 100h55v80h-55z" fill="#fff" stroke="#000" stroke-width="3"/><text x="598" y="200" text-anchor="middle" font-size="18" font-family="sans-serif">NEXT 8:45</text></svg>