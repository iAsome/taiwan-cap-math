<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Returnable cup counter</title><desc id="desc">黑白流程圖顯示 USED 杯子經箭頭送往 RETURN COUNTER，旁邊另有 CLEAN 杯。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><rect x="70" y="170" width="580" height="70" fill="none" stroke="#000" stroke-width="4"/><text x="360" y="215" text-anchor="middle" font-size="28" font-family="sans-serif">RETURN COUNTER</text><path d="M150 65h90l-12 80h-66z" fill="url(#dots)" stroke="#000" stroke-width="4"/><text x="195" y="115" text-anchor="middle" font-size="18" font-family="sans-serif">USED</text><path d="M470 65h90l-12 80h-66z" fill="#fff" stroke="#000" stroke-width="4"/><text x="515" y="115" text-anchor="middle" font-size="18" font-family="sans-serif">CLEAN</text><path d="M250 105h170" stroke="#000" stroke-width="4" marker-end="url(#arrow)"/></svg>