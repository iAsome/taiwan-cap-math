<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Three waste bins</title><desc id="desc">三個黑白垃圾箱依序標示 PAPER、CANS、OTHER；各有不同圖案與文字，不只靠顏色。</desc><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker></defs><rect x="4" y="4" width="712" height="292" fill="#fff" stroke="#000" stroke-width="3"/><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="60" y="70" width="170" height="160" fill="#fff" stroke="#000" stroke-width="4"/><text x="145" y="125">PAPER</text><path d="M105 150h80v45h-80z" fill="none" stroke="#000" stroke-width="3"/><rect x="275" y="70" width="170" height="160" fill="url(#dots)" stroke="#000" stroke-width="4"/><text x="360" y="125">CANS</text><circle cx="360" cy="175" r="28" fill="#fff" stroke="#000" stroke-width="3"/><rect x="490" y="70" width="170" height="160" fill="#fff" stroke="#000" stroke-width="4"/><text x="575" y="125">OTHER</text><path d="M535 155l80 40m0-40l-80 40" stroke="#000" stroke-width="3"/></g></svg>