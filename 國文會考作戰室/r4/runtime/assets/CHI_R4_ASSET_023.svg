<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡十一</title><desc id="desc">書法觀察卡十一為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：筆畫次序清楚，結體略長但仍方正，偏旁比例穩定；線條：方折與圓轉並用，點畫各有起止；行款：每行字數一致，行列秩序清楚；載體提示：碑帖影印本，已經攝影與印刷，應區分原碑、拓本及再製層次。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡十一（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M145 78 L320 78 M235 48 L235 232 M145 135 L320 135 M130 225 L340 225" fill="none" stroke="black" stroke-width="15" stroke-linecap="square"/><path d="M155 145 L125 205 M310 145 L345 205" stroke="black" stroke-width="13"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：筆畫次序清楚，結體略長</tspan><tspan x="465" dy="21">但仍方正，偏旁比例穩定</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：方折與圓轉並用，點畫各</tspan><tspan x="465" dy="21">有起止</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：每行字數一致，行列秩序</tspan><tspan x="465" dy="21">清楚</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
