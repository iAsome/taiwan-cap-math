<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡二</title><desc id="desc">書法觀察卡二為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：字形較扁，橫向伸展明顯，部分橫畫收筆向上挑出；線條：橫勢較強，常見起收筆的波勢；行款：橫向字勢彼此呼應，行距大於字距；載體提示：墨跡紙本，可直接看出落筆濃淡與收筆速度變化。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡二（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M115 105 C145 86 315 86 355 112" fill="none" stroke="black" stroke-width="18" stroke-linecap="square"/><path d="M155 72 L155 225 M300 72 L300 220" stroke="black" stroke-width="13"/><path d="M105 218 C170 245 305 245 370 205" fill="none" stroke="black" stroke-width="20" stroke-linecap="round"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：字形較扁，橫向伸展明顯</tspan><tspan x="465" dy="21">，部分橫畫收筆向上挑出</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：橫勢較強，常見起收筆的</tspan><tspan x="465" dy="21">波勢</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：橫向字勢彼此呼應，行距</tspan><tspan x="465" dy="21">大於字距</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
