<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">工作坊四類任務時間比例</title><desc id="desc">工作坊四類任務時間比例，單位為百分比。說明25百分比；分組操作25百分比；成果檢核30百分比；回饋修訂20百分比。以一百分鐘工作坊換算，各類別互斥且合計百分之百。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">工作坊四類任務時間比例</text><path d="M235,235 L235.00,90.00 A145,145 0 0,1 380.00,235.00 Z" fill="#111" stroke="black" stroke-width="2"/><path d="M235,235 L380.00,235.00 A145,145 0 0,1 235.00,380.00 Z" fill="#666" stroke="black" stroke-width="2"/><path d="M235,235 L235.00,380.00 A145,145 0 0,1 97.10,190.19 Z" fill="#aaa" stroke="black" stroke-width="2"/><path d="M235,235 L97.10,190.19 A145,145 0 0,1 235.00,90.00 Z" fill="#fff" stroke="black" stroke-width="2"/><rect x="440" y="115" width="28" height="28" fill="#111" stroke="black" stroke-width="2"/><text x="482" y="136" font-size="17" font-family="sans-serif">說明：25%</text><rect x="440" y="180" width="28" height="28" fill="#666" stroke="black" stroke-width="2"/><text x="482" y="201" font-size="17" font-family="sans-serif">分組操作：25%</text><rect x="440" y="245" width="28" height="28" fill="#aaa" stroke="black" stroke-width="2"/><text x="482" y="266" font-size="17" font-family="sans-serif">成果檢核：30%</text><rect x="440" y="310" width="28" height="28" fill="#fff" stroke="black" stroke-width="2"/><text x="482" y="331" font-size="17" font-family="sans-serif">回饋修訂：20%</text><text x="360" y="435" text-anchor="middle" font-size="14" font-family="sans-serif">每一扇區均以文字圖例直接標示分類與百分比，不只靠灰階辨識。</text></svg>
