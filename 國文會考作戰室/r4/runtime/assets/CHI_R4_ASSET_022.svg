<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡十</title><desc id="desc">書法觀察卡十為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：上下字勢相接，許多部件化為短點與長弧，辨讀依上下文；線條：速度快，墨線有枯濕與粗細突變；行款：橫卷行氣連續，空白在急密處後突然放大；載體提示：墨跡長卷，接筆與飛白能直接觀察。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡十（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M112 110 C175 42 330 62 270 128 C230 170 145 128 170 188 C195 245 325 212 370 145" fill="none" stroke="black" stroke-width="17" stroke-linecap="round"/><path d="M325 70 C285 110 260 155 245 230 M128 205 Q95 225 120 242" fill="none" stroke="black" stroke-width="9"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：上下字勢相接，許多部件</tspan><tspan x="465" dy="21">化為短點與長弧，辨讀依上下文</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：速度快，墨線有枯濕與粗</tspan><tspan x="465" dy="21">細突變</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：橫卷行氣連續，空白在急</tspan><tspan x="465" dy="21">密處後突然放大</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
