<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">四班一週紙類回收重量</title><desc id="desc">四班一週紙類回收重量，單位為公斤。甲班32公斤；乙班44公斤；丙班51公斤；丁班47公斤。四班使用同一臺秤，數值四捨五入到整公斤。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">四班一週紙類回收重量</text><line x1="70" y1="370" x2="675" y2="370" stroke="black" stroke-width="2"/><line x1="70" y1="70" x2="70" y2="370" stroke="black" stroke-width="2"/><text x="26" y="78" font-size="15" font-family="sans-serif">公斤</text><rect x="95" y="194" width="72" height="176" fill="#222" stroke="black" stroke-width="2"/><text x="131" y="186" text-anchor="middle" font-size="17" font-family="sans-serif">32</text><text x="131" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">甲班</text><rect x="240" y="128" width="72" height="242" fill="#777" stroke="black" stroke-width="2"/><text x="276" y="120" text-anchor="middle" font-size="17" font-family="sans-serif">44</text><text x="276" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">乙班</text><rect x="385" y="90" width="72" height="280" fill="#222" stroke="black" stroke-width="2"/><text x="421" y="82" text-anchor="middle" font-size="17" font-family="sans-serif">51</text><text x="421" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">丙班</text><rect x="530" y="112" width="72" height="258" fill="#777" stroke="black" stroke-width="2"/><text x="566" y="104" text-anchor="middle" font-size="17" font-family="sans-serif">47</text><text x="566" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">丁班</text><text x="360" y="442" text-anchor="middle" font-size="14" font-family="sans-serif">灰階深淺不代表額外數值；請依標籤與數字閱讀。</text></svg>
