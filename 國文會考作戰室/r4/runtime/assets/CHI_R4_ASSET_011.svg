<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">活動日累計補水瓶數</title><desc id="desc">活動日累計補水瓶數，單位為瓶。上午九時5瓶；上午十一時9瓶；下午一時14瓶；下午三時20瓶。數值為當日從開始至各時點的累計量，不是單一時段新增量。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">活動日累計補水瓶數</text><line x1="70" y1="360" x2="675" y2="360" stroke="black" stroke-width="2"/><line x1="70" y1="70" x2="70" y2="360" stroke="black" stroke-width="2"/><text x="26" y="78" font-size="15" font-family="sans-serif">瓶</text><path d="M100,345 L275,281 L450,201 L625,105" fill="none" stroke="black" stroke-width="4"/><circle cx="100" cy="345" r="7" fill="white" stroke="black" stroke-width="3"/><text x="100" y="331" text-anchor="middle" font-size="17" font-family="sans-serif">5</text><text x="100" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">上午九時</text><circle cx="275" cy="281" r="7" fill="white" stroke="black" stroke-width="3"/><text x="275" y="267" text-anchor="middle" font-size="17" font-family="sans-serif">9</text><text x="275" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">上午十一時</text><circle cx="450" cy="201" r="7" fill="white" stroke="black" stroke-width="3"/><text x="450" y="187" text-anchor="middle" font-size="17" font-family="sans-serif">14</text><text x="450" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">下午一時</text><circle cx="625" cy="105" r="7" fill="white" stroke="black" stroke-width="3"/><text x="625" y="91" text-anchor="middle" font-size="17" font-family="sans-serif">20</text><text x="625" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">下午三時</text><text x="360" y="435" text-anchor="middle" font-size="14" font-family="sans-serif">各點均附直接數字標籤，折線只連接相鄰觀察時點。</text></svg>
