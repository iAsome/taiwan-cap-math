<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">四週志工借還書處理量</title><desc id="desc">四週志工借還書處理量，單位為冊。第一週12冊；第二週18冊；第三週25冊；第四週22冊。每週皆統計同一服務時段完成上架的冊數。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">四週志工借還書處理量</text><line x1="70" y1="370" x2="675" y2="370" stroke="black" stroke-width="2"/><line x1="70" y1="70" x2="70" y2="370" stroke="black" stroke-width="2"/><text x="26" y="78" font-size="15" font-family="sans-serif">冊</text><rect x="95" y="236" width="72" height="134" fill="#222" stroke="black" stroke-width="2"/><text x="131" y="228" text-anchor="middle" font-size="17" font-family="sans-serif">12</text><text x="131" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">第一週</text><rect x="240" y="168" width="72" height="202" fill="#777" stroke="black" stroke-width="2"/><text x="276" y="160" text-anchor="middle" font-size="17" font-family="sans-serif">18</text><text x="276" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">第二週</text><rect x="385" y="90" width="72" height="280" fill="#222" stroke="black" stroke-width="2"/><text x="421" y="82" text-anchor="middle" font-size="17" font-family="sans-serif">25</text><text x="421" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">第三週</text><rect x="530" y="124" width="72" height="246" fill="#777" stroke="black" stroke-width="2"/><text x="566" y="116" text-anchor="middle" font-size="17" font-family="sans-serif">22</text><text x="566" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">第四週</text><text x="360" y="442" text-anchor="middle" font-size="14" font-family="sans-serif">灰階深淺不代表額外數值；請依標籤與數字閱讀。</text></svg>
