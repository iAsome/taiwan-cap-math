<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡八</title><desc id="desc">書法觀察卡八為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：字形大小略有變化，相鄰筆畫偶爾牽絲，多數部件仍完整；線條：提按與連帶交替，速度比楷書自由；行款：行距不等，遇到長詞時字距變密；載體提示：墨跡信札，折痕與墨色可見實際書寫載體。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡八（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M135 85 C205 50 305 75 330 105 C280 105 215 110 165 140 C210 155 285 145 315 170 C270 195 195 205 125 225" fill="none" stroke="black" stroke-width="15" stroke-linecap="round"/><path d="M235 55 C220 115 245 165 210 235" fill="none" stroke="black" stroke-width="10"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：字形大小略有變化，相鄰</tspan><tspan x="465" dy="21">筆畫偶爾牽絲，多數部件仍完整</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：提按與連帶交替，速度比</tspan><tspan x="465" dy="21">楷書自由</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：行距不等，遇到長詞時字</tspan><tspan x="465" dy="21">距變密</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
