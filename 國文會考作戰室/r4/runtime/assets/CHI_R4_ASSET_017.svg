<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡五</title><desc id="desc">書法觀察卡五為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：筆畫大量連寫與省略，字形變化大，需熟悉草法才能辨讀；線條：連綿迅疾，部件常以簡化符號替代；行款：縱向行氣連續，字距忽密忽疏但整行仍有走勢；載體提示：墨跡立軸，濃淡枯潤與飛白直接保留。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡五（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M120 115 C190 45 325 65 280 125 C245 165 155 125 170 185 C185 240 315 225 355 165" fill="none" stroke="black" stroke-width="18" stroke-linecap="round"/><path d="M305 70 C250 130 245 185 205 235" fill="none" stroke="black" stroke-width="9"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：筆畫大量連寫與省略，字</tspan><tspan x="465" dy="21">形變化大，需熟悉草法才能辨讀</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：連綿迅疾，部件常以簡化</tspan><tspan x="465" dy="21">符號替代</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：縱向行氣連續，字距忽密</tspan><tspan x="465" dy="21">忽疏但整行仍有走勢</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
