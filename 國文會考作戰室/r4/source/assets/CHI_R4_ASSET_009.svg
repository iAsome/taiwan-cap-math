<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">地方展覽圖說資料來源比例</title><desc id="desc">地方展覽圖說資料來源比例，單位為百分比。館藏登錄35百分比；報紙檔案30百分比；口述訪談25百分比；現場量測10百分比。每則圖說只依主要證據類型歸入一類，共計四十則。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">地方展覽圖說資料來源比例</text><path d="M235,235 L235.00,90.00 A145,145 0 0,1 352.31,320.23 Z" fill="#111" stroke="black" stroke-width="2"/><path d="M235,235 L352.31,320.23 A145,145 0 0,1 117.69,320.23 Z" fill="#666" stroke="black" stroke-width="2"/><path d="M235,235 L117.69,320.23 A145,145 0 0,1 149.77,117.69 Z" fill="#aaa" stroke="black" stroke-width="2"/><path d="M235,235 L149.77,117.69 A145,145 0 0,1 235.00,90.00 Z" fill="#fff" stroke="black" stroke-width="2"/><rect x="440" y="115" width="28" height="28" fill="#111" stroke="black" stroke-width="2"/><text x="482" y="136" font-size="17" font-family="sans-serif">館藏登錄：35%</text><rect x="440" y="180" width="28" height="28" fill="#666" stroke="black" stroke-width="2"/><text x="482" y="201" font-size="17" font-family="sans-serif">報紙檔案：30%</text><rect x="440" y="245" width="28" height="28" fill="#aaa" stroke="black" stroke-width="2"/><text x="482" y="266" font-size="17" font-family="sans-serif">口述訪談：25%</text><rect x="440" y="310" width="28" height="28" fill="#fff" stroke="black" stroke-width="2"/><text x="482" y="331" font-size="17" font-family="sans-serif">現場量測：10%</text><text x="360" y="435" text-anchor="middle" font-size="14" font-family="sans-serif">每一扇區均以文字圖例直接標示分類與百分比，不只靠灰階辨識。</text></svg>
