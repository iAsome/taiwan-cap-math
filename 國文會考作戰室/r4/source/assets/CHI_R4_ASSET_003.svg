<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">七年級學生到校方式比例</title><desc id="desc">七年級學生到校方式比例，單位為百分比。步行40百分比；公車30百分比；自行車20百分比；家人接送10百分比。班級匿名問卷共一百份有效回覆，各類互斥且合計百分之百。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">七年級學生到校方式比例</text><path d="M235,235 L235.00,90.00 A145,145 0 0,1 320.23,352.31 Z" fill="#111" stroke="black" stroke-width="2"/><path d="M235,235 L320.23,352.31 A145,145 0 0,1 97.10,279.81 Z" fill="#666" stroke="black" stroke-width="2"/><path d="M235,235 L97.10,279.81 A145,145 0 0,1 149.77,117.69 Z" fill="#aaa" stroke="black" stroke-width="2"/><path d="M235,235 L149.77,117.69 A145,145 0 0,1 235.00,90.00 Z" fill="#fff" stroke="black" stroke-width="2"/><rect x="440" y="115" width="28" height="28" fill="#111" stroke="black" stroke-width="2"/><text x="482" y="136" font-size="17" font-family="sans-serif">步行：40%</text><rect x="440" y="180" width="28" height="28" fill="#666" stroke="black" stroke-width="2"/><text x="482" y="201" font-size="17" font-family="sans-serif">公車：30%</text><rect x="440" y="245" width="28" height="28" fill="#aaa" stroke="black" stroke-width="2"/><text x="482" y="266" font-size="17" font-family="sans-serif">自行車：20%</text><rect x="440" y="310" width="28" height="28" fill="#fff" stroke="black" stroke-width="2"/><text x="482" y="331" font-size="17" font-family="sans-serif">家人接送：10%</text><text x="360" y="435" text-anchor="middle" font-size="14" font-family="sans-serif">每一扇區均以文字圖例直接標示分類與百分比，不只靠灰階辨識。</text></svg>
