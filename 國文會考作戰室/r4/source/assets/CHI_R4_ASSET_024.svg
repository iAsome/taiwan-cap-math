<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡十二</title><desc id="desc">書法觀察卡十二為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：基本字形可辨，轉折處常順勢帶到下一筆，少量省筆不妨礙閱讀；線條：連帶柔和，粗細隨速度自然變化；行款：短行依畫面空白安排，行距配合主體構圖；載體提示：墨跡題跋，可見後加文字與主體作品位置不同。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡十二（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M135 85 C205 50 305 75 330 105 C280 105 215 110 165 140 C210 155 285 145 315 170 C270 195 195 205 125 225" fill="none" stroke="black" stroke-width="15" stroke-linecap="round"/><path d="M235 55 C220 115 245 165 210 235" fill="none" stroke="black" stroke-width="10"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：基本字形可辨，轉折處常</tspan><tspan x="465" dy="21">順勢帶到下一筆，少量省筆不妨</tspan><tspan x="465" dy="21">礙閱讀</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：連帶柔和，粗細隨速度自</tspan><tspan x="465" dy="21">然變化</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：短行依畫面空白安排，行</tspan><tspan x="465" dy="21">距配合主體構圖</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
