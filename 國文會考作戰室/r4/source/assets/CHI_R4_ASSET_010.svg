<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">閱覽室四時段座位使用數</title><desc id="desc">閱覽室四時段座位使用數，單位為席。上午九時16席；中午十二時23席；下午三時19席；晚上六時28席。同一日四次瞬間計數，閱覽室共有三十二席。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">閱覽室四時段座位使用數</text><line x1="70" y1="370" x2="675" y2="370" stroke="black" stroke-width="2"/><line x1="70" y1="70" x2="70" y2="370" stroke="black" stroke-width="2"/><text x="26" y="78" font-size="15" font-family="sans-serif">席</text><rect x="95" y="210" width="72" height="160" fill="#222" stroke="black" stroke-width="2"/><text x="131" y="202" text-anchor="middle" font-size="17" font-family="sans-serif">16</text><text x="131" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">上午九時</text><rect x="240" y="140" width="72" height="230" fill="#777" stroke="black" stroke-width="2"/><text x="276" y="132" text-anchor="middle" font-size="17" font-family="sans-serif">23</text><text x="276" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">中午十二時</text><rect x="385" y="180" width="72" height="190" fill="#222" stroke="black" stroke-width="2"/><text x="421" y="172" text-anchor="middle" font-size="17" font-family="sans-serif">19</text><text x="421" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">下午三時</text><rect x="530" y="90" width="72" height="280" fill="#777" stroke="black" stroke-width="2"/><text x="566" y="82" text-anchor="middle" font-size="17" font-family="sans-serif">28</text><text x="566" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">晚上六時</text><text x="360" y="442" text-anchor="middle" font-size="14" font-family="sans-serif">灰階深淺不代表額外數值；請依標籤與數字閱讀。</text></svg>
