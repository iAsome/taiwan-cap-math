<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡七</title><desc id="desc">書法觀察卡七為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：多數字取扁方，長橫向左右展開，撇捺較有張力；線條：橫畫起伏形成波磔，縱畫相對收斂；行款：字字獨立，橫向伸展使行內節奏開闊；載體提示：碑刻拓本，缺角可能來自石面損傷而非原書漏筆。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡七（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M115 105 C145 86 315 86 355 112" fill="none" stroke="black" stroke-width="18" stroke-linecap="square"/><path d="M155 72 L155 225 M300 72 L300 220" stroke="black" stroke-width="13"/><path d="M105 218 C170 245 305 245 370 205" fill="none" stroke="black" stroke-width="20" stroke-linecap="round"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：多數字取扁方，長橫向左</tspan><tspan x="465" dy="21">右展開，撇捺較有張力</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：橫畫起伏形成波磔，縱畫</tspan><tspan x="465" dy="21">相對收斂</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：字字獨立，橫向伸展使行</tspan><tspan x="465" dy="21">內節奏開闊</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
