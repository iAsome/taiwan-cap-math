<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">四次演練平均換景時間</title><desc id="desc">四次演練平均換景時間，單位為分鐘。第一次14分鐘；第二次11分鐘；第三次8分鐘；第四次7分鐘。場地與布景相同；第三次起改用設備依賴順序表。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">四次演練平均換景時間</text><line x1="70" y1="360" x2="675" y2="360" stroke="black" stroke-width="2"/><line x1="70" y1="70" x2="70" y2="360" stroke="black" stroke-width="2"/><text x="26" y="78" font-size="15" font-family="sans-serif">分鐘</text><path d="M100,105 L275,207.85714285714286 L450,310.7142857142857 L625,345" fill="none" stroke="black" stroke-width="4"/><circle cx="100" cy="105" r="7" fill="white" stroke="black" stroke-width="3"/><text x="100" y="91" text-anchor="middle" font-size="17" font-family="sans-serif">14</text><text x="100" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">第一次</text><circle cx="275" cy="207.85714285714286" r="7" fill="white" stroke="black" stroke-width="3"/><text x="275" y="193.85714285714286" text-anchor="middle" font-size="17" font-family="sans-serif">11</text><text x="275" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">第二次</text><circle cx="450" cy="310.7142857142857" r="7" fill="white" stroke="black" stroke-width="3"/><text x="450" y="296.7142857142857" text-anchor="middle" font-size="17" font-family="sans-serif">8</text><text x="450" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">第三次</text><circle cx="625" cy="345" r="7" fill="white" stroke="black" stroke-width="3"/><text x="625" y="331" text-anchor="middle" font-size="17" font-family="sans-serif">7</text><text x="625" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">第四次</text><text x="360" y="435" text-anchor="middle" font-size="14" font-family="sans-serif">各點均附直接數字標籤，折線只連接相鄰觀察時點。</text></svg>
