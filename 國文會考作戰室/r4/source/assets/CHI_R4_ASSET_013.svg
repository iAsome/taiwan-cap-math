<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">書法觀察卡一</title><desc id="desc">書法觀察卡一為原創書體特徵示意，不是古帖臨摹或真蹟鑑定樣本。可見字形與筆畫：字形較縱長，轉折多呈圓轉，部件排列勻稱，筆畫粗細變化不明顯；線條：線條圓轉而均勻，結構偏對稱；行款：縱向成行，字距均勻，行距略寬；載體提示：石刻拓本，紙面墨色呈現刻線輪廓，局部可見石面斑駁。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">書法觀察卡一（原創特徵示意）</text><rect x="70" y="55" width="360" height="300" fill="white" stroke="black" stroke-width="2"/><line x1="250" y1="55" x2="250" y2="355" stroke="#bbb"/><line x1="70" y1="205" x2="430" y2="205" stroke="#bbb"/><path d="M150 80 Q235 35 320 80 Q365 145 320 205 Q235 250 150 205 Q105 145 150 80 Z" fill="none" stroke="black" stroke-width="13" stroke-linecap="round"/><path d="M190 92 Q235 130 280 92 M190 195 Q235 155 280 195" fill="none" stroke="black" stroke-width="13" stroke-linecap="round"/><text x="465" y="78" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">字形：字形較縱長，轉折多呈圓</tspan><tspan x="465" dy="21">轉，部件排列勻稱，筆畫粗細變</tspan><tspan x="465" dy="21">化不明顯</tspan></text><text x="465" y="175" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">筆勢：線條圓轉而均勻，結構偏</tspan><tspan x="465" dy="21">對稱</tspan></text><text x="465" y="260" font-size="14" font-family="sans-serif"><tspan x="465" dy="0">行款：縱向成行，字距均勻，行</tspan><tspan x="465" dy="21">距略寬</tspan></text><text x="360" y="405" text-anchor="middle" font-size="14" font-family="sans-serif">示意線條只呈現觀察維度；辨識須合併字形、筆畫、結構與載體，不依顏色。</text><text x="360" y="435" text-anchor="middle" font-size="13" font-family="sans-serif">黑白列印可讀；不是古代真蹟、拓本複製或特定作者作品。</text></svg>
