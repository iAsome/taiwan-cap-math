<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">菜園盆土同日濕度變化</title><desc id="desc">菜園盆土同日濕度變化，單位為百分比。上午八時62百分比；上午十時49百分比；中午十二時38百分比；下午二時28百分比。同一花盆、同一感測器；上午八時澆水後未再補水。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">菜園盆土同日濕度變化</text><line x1="70" y1="360" x2="675" y2="360" stroke="black" stroke-width="2"/><line x1="70" y1="70" x2="70" y2="360" stroke="black" stroke-width="2"/><text x="26" y="78" font-size="15" font-family="sans-serif">百分比</text><path d="M100,105 L275,196.76470588235293 L450,274.4117647058823 L625,345" fill="none" stroke="black" stroke-width="4"/><circle cx="100" cy="105" r="7" fill="white" stroke="black" stroke-width="3"/><text x="100" y="91" text-anchor="middle" font-size="17" font-family="sans-serif">62</text><text x="100" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">上午八時</text><circle cx="275" cy="196.76470588235293" r="7" fill="white" stroke="black" stroke-width="3"/><text x="275" y="182.76470588235293" text-anchor="middle" font-size="17" font-family="sans-serif">49</text><text x="275" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">上午十時</text><circle cx="450" cy="274.4117647058823" r="7" fill="white" stroke="black" stroke-width="3"/><text x="450" y="260.4117647058823" text-anchor="middle" font-size="17" font-family="sans-serif">38</text><text x="450" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">中午十二時</text><circle cx="625" cy="345" r="7" fill="white" stroke="black" stroke-width="3"/><text x="625" y="331" text-anchor="middle" font-size="17" font-family="sans-serif">28</text><text x="625" y="385" text-anchor="middle" font-size="15" font-family="sans-serif">下午二時</text><text x="360" y="435" text-anchor="middle" font-size="14" font-family="sans-serif">各點均附直接數字標籤，折線只連接相鄰觀察時點。</text></svg>
