<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">圖書館四區單日使用人次</title><desc id="desc">圖書館四區單日使用人次，單位為人次。親子共讀區24人次；期刊區31人次；自習區27人次；展覽區18人次。同一開館日由入口計數器分區統計；一人進入不同區會分別計次。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">圖書館四區單日使用人次</text><line x1="70" y1="370" x2="675" y2="370" stroke="black" stroke-width="2"/><line x1="70" y1="70" x2="70" y2="370" stroke="black" stroke-width="2"/><text x="26" y="78" font-size="15" font-family="sans-serif">人次</text><rect x="95" y="153" width="72" height="217" fill="#222" stroke="black" stroke-width="2"/><text x="131" y="145" text-anchor="middle" font-size="17" font-family="sans-serif">24</text><text x="131" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">親子共讀區</text><rect x="240" y="90" width="72" height="280" fill="#777" stroke="black" stroke-width="2"/><text x="276" y="82" text-anchor="middle" font-size="17" font-family="sans-serif">31</text><text x="276" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">期刊區</text><rect x="385" y="126" width="72" height="244" fill="#222" stroke="black" stroke-width="2"/><text x="421" y="118" text-anchor="middle" font-size="17" font-family="sans-serif">27</text><text x="421" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">自習區</text><rect x="530" y="207" width="72" height="163" fill="#777" stroke="black" stroke-width="2"/><text x="566" y="199" text-anchor="middle" font-size="17" font-family="sans-serif">18</text><text x="566" y="400" text-anchor="middle" font-size="15" font-family="sans-serif">展覽區</text><text x="360" y="442" text-anchor="middle" font-size="14" font-family="sans-serif">灰階深淺不代表額外數值；請依標籤與數字閱讀。</text></svg>
