<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 460"><title id="title">市場自備袋材質比例</title><desc id="desc">市場自備袋材質比例，單位為百分比。布袋45百分比；紙袋25百分比；網袋20百分比；其他10百分比。在同一入口連續記錄兩百個自備袋，以主要材質歸類。</desc><rect width="720" height="460" fill="white"/><text x="360" y="32" text-anchor="middle" font-size="22" font-family="sans-serif" fill="black">市場自備袋材質比例</text><path d="M235,235 L235.00,90.00 A145,145 0 0,1 279.81,372.90 Z" fill="#111" stroke="black" stroke-width="2"/><path d="M235,235 L279.81,372.90 A145,145 0 0,1 97.10,279.81 Z" fill="#666" stroke="black" stroke-width="2"/><path d="M235,235 L97.10,279.81 A145,145 0 0,1 149.77,117.69 Z" fill="#aaa" stroke="black" stroke-width="2"/><path d="M235,235 L149.77,117.69 A145,145 0 0,1 235.00,90.00 Z" fill="#fff" stroke="black" stroke-width="2"/><rect x="440" y="115" width="28" height="28" fill="#111" stroke="black" stroke-width="2"/><text x="482" y="136" font-size="17" font-family="sans-serif">布袋：45%</text><rect x="440" y="180" width="28" height="28" fill="#666" stroke="black" stroke-width="2"/><text x="482" y="201" font-size="17" font-family="sans-serif">紙袋：25%</text><rect x="440" y="245" width="28" height="28" fill="#aaa" stroke="black" stroke-width="2"/><text x="482" y="266" font-size="17" font-family="sans-serif">網袋：20%</text><rect x="440" y="310" width="28" height="28" fill="#fff" stroke="black" stroke-width="2"/><text x="482" y="331" font-size="17" font-family="sans-serif">其他：10%</text><text x="360" y="435" text-anchor="middle" font-size="14" font-family="sans-serif">每一扇區均以文字圖例直接標示分類與百分比，不只靠灰階辨識。</text></svg>
