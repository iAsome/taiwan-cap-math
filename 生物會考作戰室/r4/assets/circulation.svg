<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d"><title id="t">人體雙循環</title><desc id="d">以箭頭呈現右心、肺、左心和全身組織的循環方向。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><g fill="#fff" stroke="#111" stroke-width="4"><rect x="300" y="205" width="160" height="120" rx="18"/><line x1="380" y1="205" x2="380" y2="325"/><ellipse cx="380" cy="85" rx="110" ry="48"/><rect x="275" y="430" width="210" height="55" rx="10"/></g><g fill="none" stroke="#111" stroke-width="5" marker-end="url(#a)"><path d="M340 205Q250 145 315 105" stroke-dasharray="11 8"/><path d="M445 105Q520 145 420 205"/><path d="M420 325Q535 380 455 430"/><path d="M305 430Q225 375 340 325" stroke-dasharray="11 8"/></g><g font-family="sans-serif" fill="#111" text-anchor="middle"><text x="380" y="92" font-size="27">肺</text><text x="340" y="270" font-size="23">右心</text><text x="420" y="270" font-size="23">左心</text><text x="380" y="465" font-size="25">全身組織</text><text x="120" y="175" font-size="20">虛線：含氧較少</text><text x="610" y="175" font-size="20">實線：含氧較多</text></g></svg>
