<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d"><title id="t">溫度與每分鐘氣泡數</title><desc id="d">氣泡數由十度到三十度增加，四十與五十度下降。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><g stroke="#111" stroke-width="3" fill="none"><path d="M110 430V70M110 430H680" marker-end="url(#a)"/><path d="M110 350H650M110 270H650M110 190H650M110 110H650" stroke="#777" stroke-dasharray="5 7"/><path d="M210 350L310 250L410 130L510 290L610 410" stroke-width="5"/></g><g fill="#fff" stroke="#111" stroke-width="4"><circle cx="210" cy="350" r="9"/><circle cx="310" cy="250" r="9"/><circle cx="410" cy="130" r="9"/><circle cx="510" cy="290" r="9"/><circle cx="610" cy="410" r="9"/></g><g font-family="sans-serif" fill="#111" font-size="20" text-anchor="middle"><text x="210" y="460">10</text><text x="310" y="460">20</text><text x="410" y="460">30</text><text x="510" y="460">40</text><text x="610" y="460">50</text><text x="400" y="500">溫度（°C）</text><text x="75" y="435">0</text><text x="75" y="355">4</text><text x="75" y="275">8</text><text x="75" y="195">12</text><text x="75" y="115">16</text><text x="30" y="250" transform="rotate(-90 30 250)">每分鐘氣泡數（個）</text></g></svg>
