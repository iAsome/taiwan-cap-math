<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>加熱試管安全裝置</title><desc>試管由夾具固定並斜向上，管口朝向無人處；酒精燈位在液面下方，操作者戴護目鏡並站在側面。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">加熱試管安全示意圖（非依比例）</text><line class="line" x1="90" y1="335" x2="640" y2="335"/><line class="line" x1="205" y1="320" x2="250" y2="105"/><line class="line" x1="250" y1="105" x2="475" y2="170"/><line class="line" x1="258" y1="118" x2="478" y2="182"/><path class="thin" d="M285 143 L430 185"/><text x="455" y="145" class="small">管口朝無人處</text><path class="arrow" d="M455 150 L520 170"/><rect class="box" x="270" y="270" width="70" height="60"/><path class="thin" d="M290 270 Q305 220 320 270"/><text x="245" y="365" class="small">熱源在液面下方</text><circle class="box" cx="125" cy="105" r="35"/><path class="line" d="M95 140 L70 255 M155 140 L175 255 M105 255 L80 330 M150 255 L175 330"/><text x="35" y="65" class="small">護目鏡</text><path class="arrow" d="M95 70 L112 90"/></svg>
