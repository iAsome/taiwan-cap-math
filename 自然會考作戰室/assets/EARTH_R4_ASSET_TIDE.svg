<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">24小時潮位原創資料圖</title>
  <desc id="desc">橫軸0到24時，縱軸潮位0到3公尺。曲線在3時與15時達約2.8公尺滿潮，在9時與21時達約0.5公尺乾潮，兩次相鄰滿潮約隔12小時。</desc>
  <rect width="720" height="440" fill="#fff" stroke="#111"/>
  <text x="24" y="30" font-size="20" font-weight="700">甲港 24 小時潮位（原創教學資料）</text>
  <path d="M75 350V70M75 350h590" stroke="#111" stroke-width="3"/>
  <g font-size="13"><text x="35" y="356">0</text><text x="35" y="270">1</text><text x="35" y="185">2</text><text x="35" y="100">3 m</text><text x="68" y="374">0</text><text x="211" y="374">6</text><text x="352" y="374">12</text><text x="495" y="374">18</text><text x="645" y="374">24時</text></g>
  <g stroke="#bbb"><path d="M75 265h590M75 180h590M75 95h590M218 70v280M360 70v280M503 70v280"/></g>
  <path d="M75 205C95 150 120 112 149 112C185 112 230 310 296 310C350 310 395 112 444 112C495 112 545 310 591 310C625 310 650 230 665 205" fill="none" stroke="#111" stroke-width="4"/>
  <g fill="#fff" stroke="#111" stroke-width="3"><circle cx="149" cy="112" r="6"/><circle cx="296" cy="310" r="6"/><circle cx="444" cy="112" r="6"/><circle cx="591" cy="310" r="6"/></g>
  <g font-size="14"><text x="126" y="95">滿潮2.8 m</text><text x="274" y="335">乾潮0.5 m</text><text x="421" y="95">滿潮2.8 m</text><text x="568" y="335">乾潮0.5 m</text></g>
  <rect x="76" y="395" width="590" height="25" fill="#f3f3f3"/>
  <text x="88" y="413" font-size="13">座標：時間（時）× 潮位（m）；量測間隔1小時，曲線僅連接觀測點；來源：Codex原創教學合成資料。</text>
