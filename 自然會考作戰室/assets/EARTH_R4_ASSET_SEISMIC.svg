<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">P波與S波到時原創地震紀錄</title><desc id="desc">橫軸0到40秒，縱軸相對振幅。0至8秒接近基線，8秒P波到達後出現小振幅，20秒S波到達後振幅增大，P與S到時差12秒。</desc><rect width="760" height="440" fill="#fff" stroke="#111"/><text x="24" y="30" font-size="20" font-weight="700">測站甲地震紀錄（原創教學資料）</text><path d="M70 220h640M70 370V70" stroke="#111" stroke-width="3"/><path d="M70 220h118l7-10 8 22 8-17 8 10 8-8 10 5h115l9-40 10 82 11-103 12 130 11-97 12 56 11-28 15 14 20-7 20 4 35-2 50 0" fill="none" stroke="#111" stroke-width="3"/><path d="M198 80v290M352 80v290" stroke="#111" stroke-dasharray="8 6"/><text x="174" y="94" font-size="15">P波到時 8 s</text><text x="328" y="116" font-size="15">S波到時 20 s</text><g font-size="13"><text x="62" y="390">0</text><text x="218" y="390">10</text><text x="372" y="390">20</text><text x="526" y="390">30</text><text x="687" y="390">40秒</text><text x="14" y="82">正振幅</text><text x="14" y="365">負振幅</text></g><rect x="70" y="399" width="640" height="37" fill="#f3f3f3"/><g font-size="13"><text x="84" y="416">座標：時間（s）×相對振幅；P–S到時差＝12 s。</text><text x="84" y="432">波形為示意，不能直接當規模或震度。</text></g></svg>
