<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">日月地相對位置與八月相原創圖</title>
  <desc id="desc">太陽在左方，光由左向右，地球在中央，月球八個位置由北極上空看為逆時針公轉。白色代表從地球看見的亮面，黑色代表暗面；由朔依序為眉月、上弦、盈凸、望、虧凸、下弦與殘月。</desc>
  <rect width="760" height="460" fill="#fff" stroke="#111"/>
  <text x="24" y="30" font-size="20" font-weight="700">日—月—地位置與月相（俯視北極上空；距離、大小皆非比例）</text>
  <circle cx="75" cy="230" r="42" fill="#fff" stroke="#111" stroke-width="4"/><text x="51" y="236" font-size="18">太陽</text>
  <g stroke="#111"><path d="M125 180h85m-12-8 12 8-12 8M125 230h85m-12-8 12 8-12 8M125 280h85m-12-8 12 8-12 8" stroke-width="3"/></g><text x="132" y="164" font-size="14">陽光方向</text>
  <circle cx="430" cy="230" r="34" fill="#ddd" stroke="#111"/><text x="410" y="236" font-size="17">地球</text>
  <ellipse cx="430" cy="230" rx="235" ry="165" fill="none" stroke="#777" stroke-dasharray="8 6"/>
  <path d="M430 65c-15 0-28 2-42 5m0 0 16-10m-16 10 17 7" stroke="#111" stroke-width="2" fill="none"/>
  <g stroke="#111" stroke-width="2">
    <circle cx="195" cy="230" r="22" fill="#111"/>
    <circle cx="264" cy="347" r="22" fill="#111"/><path d="M264 325a22 22 0 0 1 0 44a15 22 0 0 0 0-44Z" fill="#fff"/>
    <circle cx="430" cy="395" r="22" fill="#111"/><path d="M430 373a22 22 0 0 1 0 44Z" fill="#fff"/>
    <circle cx="596" cy="347" r="22" fill="#fff"/><path d="M596 325a15 22 0 0 1 0 44a22 22 0 0 0 0-44Z" fill="#111"/>
    <circle cx="665" cy="230" r="22" fill="#fff"/>
    <circle cx="596" cy="113" r="22" fill="#fff"/><path d="M596 91a15 22 0 0 0 0 44a22 22 0 0 1 0-44Z" fill="#111"/>
    <circle cx="430" cy="65" r="22" fill="#111"/><path d="M430 43a22 22 0 0 0 0 44Z" fill="#fff"/>
    <circle cx="264" cy="113" r="22" fill="#111"/><path d="M264 91a22 22 0 0 0 0 44a15 22 0 0 1 0-44Z" fill="#fff"/>
  </g>
  <g font-size="14" text-anchor="middle"><text x="195" y="270">朔／新月</text><text x="258" y="385">眉月</text><text x="430" y="432">上弦月</text><text x="604" y="385">盈凸月</text><text x="665" y="270">望／滿月</text><text x="604" y="83">虧凸月</text><text x="430" y="48">下弦月</text><text x="258" y="83">殘月</text></g>
  <rect x="24" y="406" width="330" height="30" fill="#f3f3f3" stroke="#111"/><text x="35" y="427" font-size="13">圖例：白＝亮面｜黑＝暗面｜虛線＝軌道｜箭頭＝逆時針</text>
</svg>
