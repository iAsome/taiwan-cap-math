<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">雨量坡度與崩塌面積原創資料圖</title>
  <desc id="desc">三個站點以同一橫軸比較雨量、坡度與崩塌面積。甲站雨量430毫米、坡度34度、崩塌8.2公頃；乙站雨量410毫米、坡度18度、崩塌1.1公頃；丙站雨量250毫米、坡度36度、崩塌2.5公頃。圖中特別標示丙站資料完整率僅72%，不能只憑單一變因下因果結論。</desc>
  <defs><pattern id="rain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 8 0" stroke="#777"/></pattern><pattern id="slope" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 8 8" stroke="#333"/></pattern></defs>
  <rect width="760" height="460" fill="#fff" stroke="#111"/>
  <text x="24" y="30" font-size="20" font-weight="700">跨資料對齊：雨量、坡度與崩塌（原創教學合成資料）</text>
  <path d="M82 350V70M82 350h600" stroke="#111" stroke-width="3"/>
  <g font-size="13"><text x="32" y="355">0</text><text x="25" y="300">100</text><text x="25" y="245">200</text><text x="25" y="190">300</text><text x="25" y="135">400</text><text x="25" y="80">500</text><text x="202" y="375">甲</text><text x="382" y="375">乙</text><text x="562" y="375">丙</text><text x="12" y="52">雨量（mm）</text></g>
  <g fill="url(#rain)" stroke="#111"><rect x="155" y="113" width="48" height="237"/><rect x="335" y="124" width="48" height="226"/><rect x="515" y="212" width="48" height="138"/></g>
  <g fill="url(#slope)" stroke="#111"><rect x="207" y="180" width="36" height="170"/><rect x="387" y="260" width="36" height="90"/><rect x="567" y="170" width="36" height="180"/></g>
  <g fill="#fff" stroke="#111" stroke-width="3"><circle cx="225" cy="97" r="10"/><circle cx="405" cy="286" r="10"/><circle cx="585" cy="247" r="10"/></g>
  <g font-size="13"><text x="148" y="105">430 mm</text><text x="202" y="170">34°</text><text x="238" y="101">8.2 ha</text><text x="328" y="116">410 mm</text><text x="384" y="250">18°</text><text x="418" y="290">1.1 ha</text><text x="508" y="204">250 mm</text><text x="564" y="160">36°</text><text x="598" y="251">2.5 ha</text></g>
  <rect x="82" y="395" width="600" height="46" fill="#f3f3f3" stroke="#111"/>
  <text x="94" y="414" font-size="13">圖例：斜線柱＝24小時雨量（左軸）｜反斜線窄柱＝坡度（標值）｜○＝崩塌面積（標值）</text>
  <text x="94" y="433" font-size="13">資料完整率：甲98%、乙100%、丙72%；三變因量尺不同，須讀標值，不可比較圖形高度。</text>
</svg>
