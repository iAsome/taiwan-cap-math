<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-labelledby="title desc"><title id="title">臺灣星空方位高度原創觀測圖</title><desc id="desc">以觀察者為中心的半球天空圖，地平圈標示東南西北，高度圈30、60、90度，甲星位於東南方高度30度，乙星位於南方高度60度。時間為2026年7月16日20時，位置北緯24度。</desc><rect width="680" height="460" fill="#fff" stroke="#111"/><text x="24" y="30" font-size="20" font-weight="700">星空觀測圖｜臺灣北緯24°｜2026-07-16 20:00（示意）</text><ellipse cx="340" cy="250" rx="270" ry="145" fill="#fafafa" stroke="#111" stroke-width="3"/><ellipse cx="340" cy="250" rx="180" ry="97" fill="none" stroke="#777" stroke-dasharray="8 6"/><ellipse cx="340" cy="250" rx="90" ry="48" fill="none" stroke="#777" stroke-dasharray="8 6"/><path d="M70 250h540M340 105v290" stroke="#777"/><text x="332" y="94" font-size="17">北 N</text><text x="617" y="256" font-size="17">東 E</text><text x="332" y="418" font-size="17">南 S</text><text x="28" y="256" font-size="17">西 W</text><text x="436" y="164" font-size="14">高度30°圈</text><text x="384" y="211" font-size="14">高度60°圈</text><text x="348" y="242" font-size="14">天頂90°</text><path d="m500 314 7 15 16 2-12 11 4 16-15-8-14 8 3-16-12-11 17-2Z" fill="#111"/><text x="527" y="342" font-size="16">甲星：東南，高度30°</text><path d="m338 328 6 13 15 2-11 10 3 14-13-7-13 7 3-14-11-10 15-2Z" fill="#111"/><text x="365" y="365" font-size="16">乙星：南，高度60°</text><rect x="22" y="430" width="636" height="22" fill="#f3f3f3"/><text x="32" y="446" font-size="12">投影：地平座標半球示意；中心為天頂、外圈為地平線；角度才是量測尺度，圖上直線距離不可當天體真實距離。</text></svg>
