<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
  <title id="title">三類板塊邊界原創剖面</title><desc id="desc">三個面板依序顯示張裂、海洋板塊隱沒聚合與錯動。箭頭標示相對運動，並標出海嶺、海溝、火山弧和淺深源地震。</desc>
  <rect width="780" height="440" fill="#fff" stroke="#111"/><text x="24" y="30" font-size="20" font-weight="700">板塊邊界剖面（教學示意，非等比例）</text>
  <g transform="translate(20 60)"><rect width="235" height="300" fill="#fafafa" stroke="#111"/><text x="74" y="25" font-size="17" font-weight="700">張裂邊界</text><path d="M0 125h85l32-25 32 25h86v55H0Z" fill="#ddd" stroke="#111"/><path d="M117 100v150" stroke="#111" stroke-width="3"/><path d="M105 95 80 75m37 20 25-20" stroke="#111" stroke-width="4"/><path d="M78 70H35m0 0 15-8m-15 8 15 8M156 70h43m0 0-15-8m15 8-15 8" stroke="#111" stroke-width="3"/><text x="78" y="285" font-size="13">海嶺、新地殼、淺源地震</text></g>
  <g transform="translate(272 60)"><rect width="235" height="300" fill="#fafafa" stroke="#111"/><text x="74" y="25" font-size="17" font-weight="700">聚合邊界</text><path d="M0 135h95l20 18 120-15v52H0Z" fill="#ddd" stroke="#111"/><path d="M0 135h95q55 80 132 142" fill="none" stroke="#111" stroke-width="12"/><path d="M111 150 78 95m-5 0h-42m42 0-15-8m15 8-15 8M154 95h42m-42 0 15-8m-15 8 15 8" stroke="#111" stroke-width="3"/><path d="M158 135 172 96l14 39" fill="#fff" stroke="#111"/><circle cx="126" cy="170" r="4"/><circle cx="151" cy="205" r="4"/><circle cx="184" cy="245" r="4"/><text x="10" y="292" font-size="13">海溝、火山弧、斜列深淺震</text></g>
  <g transform="translate(524 60)"><rect width="235" height="300" fill="#fafafa" stroke="#111"/><text x="74" y="25" font-size="17" font-weight="700">錯動邊界</text><path d="M0 115h235v80H0Z" fill="#ddd" stroke="#111"/><path d="M118 70v190" stroke="#111" stroke-width="5"/><path d="M25 100h70m0 0-15-8m15 8-15 8M210 210h-70m0 0 15-8m-15 8 15 8" stroke="#111" stroke-width="3"/><circle cx="118" cy="135" r="5"/><circle cx="118" cy="180" r="5"/><circle cx="118" cy="225" r="5"/><text x="25" y="285" font-size="13">水平錯移、線狀淺源地震</text></g>
  <rect x="24" y="382" width="732" height="38" fill="#f3f3f3" stroke="#111"/><text x="37" y="406" font-size="14">圖例：粗灰帶＝板塊｜箭頭＝相對運動｜●＝震源｜三角錐＝火山；剖面方向依各面板箭頭，不代表固定地理方位。</text>
</svg>
