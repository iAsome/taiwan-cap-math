<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">地層剖面與事件先後原創示意</title>
  <desc id="desc">西到東剖面含A、B、C三層，岩脈D截切三層，斷層F截切岩脈與地層，上方侵蝕面被E層覆蓋。各層用不同黑白線紋。</desc>
  <defs><pattern id="a" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 12 0" stroke="#777"/></pattern><pattern id="b" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 3h12M0 9h12" stroke="#777"/></pattern><pattern id="c" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.5"/><circle cx="11" cy="10" r="1.5"/></pattern></defs>
  <rect width="720" height="440" fill="#fff" stroke="#111"/>
  <text x="24" y="30" font-size="20" font-weight="700">地層剖面（西—東；垂直與水平皆非等比例）</text>
  <path d="M52 330Q180 318 300 326T668 315V380H52Z" fill="url(#a)" stroke="#111"/><text x="90" y="362" font-size="20">A</text>
  <path d="M52 258Q180 247 300 260T668 248V315Q540 324 410 316T52 330Z" fill="url(#b)" stroke="#111"/><text x="100" y="291" font-size="20">B</text>
  <path d="M52 190Q170 204 293 188T668 195V248Q530 257 410 248T52 258Z" fill="url(#c)" stroke="#111"/><text x="105" y="230" font-size="20">C</text>
  <path d="M52 165Q180 130 300 160T668 142V195Q530 183 410 194T52 190Z" fill="#ddd" stroke="#111"/><text x="96" y="177" font-size="20">E</text>
  <path d="M310 380 348 380 412 191 383 190Z" fill="#fff" stroke="#111" stroke-width="3"/><text x="365" y="285" font-size="20">岩脈 D</text>
  <path d="M222 380 430 191" stroke="#111" stroke-width="5" stroke-dasharray="12 7"/><text x="390" y="235" font-size="18">斷層 F</text>
  <path d="M52 165Q180 130 300 160T668 142V195Q530 183 410 194T52 190Z" fill="#ddd" stroke="#111"/><text x="96" y="177" font-size="20">E</text>
  <path d="M52 190Q170 204 293 188T668 195" fill="none" stroke="#111" stroke-width="4"/><text x="540" y="188" font-size="15">侵蝕面</text>
  <text x="50" y="405" font-size="16">西 W</text><text x="635" y="405" font-size="16">東 E</text><path d="M112 400h480m0 0-16-8m16 8-16 8" stroke="#111" stroke-width="2"/>
  <rect x="485" y="272" width="190" height="102" fill="#fff" stroke="#111"/><text x="496" y="292" font-size="14" font-weight="700">圖例</text><text x="496" y="314" font-size="13">斜線：A層</text><text x="496" y="334" font-size="13">橫線：B層</text><text x="496" y="354" font-size="13">點紋：C層；灰：E層</text><text x="496" y="371" font-size="12">虛線粗線：斷層F</text>
</svg>
