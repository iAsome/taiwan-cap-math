<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="title desc">
  <title id="title">臺灣坡地風險原創示意圖</title>
  <desc id="desc">北箭頭向上，臺灣輪廓內有中央山脈點紋、兩條活動斷層粗虛線、甲乙丙三聚落。甲位於高雨量順向坡，乙人口較多但坡緩，丙雨量較低。圖例與100公里比例尺完整。</desc>
  <defs><pattern id="mount" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5"/></pattern><pattern id="rain" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 10 0" stroke="#777"/></pattern></defs>
  <rect width="700" height="470" fill="#fff" stroke="#111"/>
  <text x="24" y="30" font-size="20" font-weight="700">臺灣坡地風險圖（2026教學合成資料；蘭伯特方位示意投影）</text>
  <path d="M345 70c48 31 75 83 69 133-6 53-39 94-58 142-14 34-25 65-55 81-29-37-39-80-33-124 7-48 1-89 16-136 14-43 25-75 61-96Z" fill="url(#mount)" stroke="#111" stroke-width="3"/>
  <path d="M326 105c42 34 42 83 24 123-19 42-26 80-25 129" fill="none" stroke="#111" stroke-width="5" stroke-dasharray="12 7"/>
  <path d="M381 127c-21 39-17 87-35 127-13 28-29 54-30 91" fill="none" stroke="#111" stroke-width="5" stroke-dasharray="12 7"/>
  <path d="M280 170c45-33 90-24 126 2l-22 72c-39-20-77-18-112 5Z" fill="url(#rain)" opacity=".9" stroke="#111"/>
  <g fill="#fff" stroke="#111" stroke-width="3"><circle cx="365" cy="203" r="9"/><rect x="278" y="274" width="18" height="18"/><path d="m350 355 10 18h-20Z"/></g>
  <g font-size="16"><text x="380" y="208">甲：高雨量、順向坡</text><text x="214" y="286">乙：坡緩、戶數多</text><text x="367" y="370">丙：雨量較低</text></g>
  <path d="M620 105V55m0 0-9 17m9-17 9 17" stroke="#111" stroke-width="3"/><text x="612" y="47" font-size="16">北</text>
  <path d="M500 410h100" stroke="#111" stroke-width="6"/><path d="M500 402v16M550 402v16M600 402v16" stroke="#111" stroke-width="2"/><text x="500" y="438" font-size="13">0　50　100 km</text>
  <rect x="25" y="330" width="205" height="112" fill="#fff" stroke="#111"/>
  <text x="37" y="350" font-size="14" font-weight="700">圖例</text><text x="37" y="372" font-size="13">點紋：中央山地</text><text x="37" y="392" font-size="13">斜紋：24小時雨量≥400 mm</text><text x="37" y="412" font-size="13">粗虛線：活動斷層示意</text><text x="37" y="432" font-size="13">○甲　□乙　△丙：聚落</text>
</svg>
