<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">碳循環原創系統圖</title><desc id="desc">大氣、陸地生物、表層海洋、深海與岩石化石碳庫以方框表示。箭頭標出光合作用、呼吸分解、海氣交換、沉降、火山與化石燃料燃燒；箭頭粗細僅分自然過程與人為新增，不代表精確通量。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z"/></marker></defs><rect width="760" height="460" fill="#fff" stroke="#111"/><text x="24" y="30" font-size="20" font-weight="700">碳循環（系統示意；箭頭非精確通量）</text><g fill="#fff" stroke="#111" stroke-width="2"><rect x="295" y="60" width="170" height="60"/><rect x="60" y="205" width="170" height="60"/><rect x="530" y="205" width="170" height="60"/><rect x="530" y="340" width="170" height="60"/><rect x="60" y="340" width="210" height="60"/></g><g font-size="16" text-anchor="middle"><text x="380" y="95">大氣碳庫</text><text x="145" y="240">陸地生物與土壤</text><text x="615" y="240">表層海洋</text><text x="615" y="375">深海與沉積物</text><text x="165" y="375">岩石與化石燃料碳庫</text></g><g fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arr)"><path d="M300 105 205 205"/><path d="M215 215 320 115"/><path d="M462 95 555 205"/><path d="M570 205 470 105"/><path d="M615 265v75"/><path d="M530 375H270"/><path d="M165 340 310 120"/><path d="M105 340 86 280 295 105"/></g><g font-size="13"><text x="210" y="145">光合作用</text><text x="237" y="185">呼吸、分解</text><text x="505" y="145">海氣交換</text><text x="625" y="306">沉降</text><text x="355" y="367">地質作用</text><text x="180" y="250">火山與風化</text><text x="70" y="300" font-weight="700">化石燃料燃燒（人為新增）</text></g><rect x="25" y="420" width="710" height="23" fill="#f3f3f3"/><text x="38" y="437" font-size="13">圖例：方框＝碳庫；細箭頭＝自然交換；粗字標示＝人為快速移入大氣。系統邊界為全球長期碳循環。</text></svg>
