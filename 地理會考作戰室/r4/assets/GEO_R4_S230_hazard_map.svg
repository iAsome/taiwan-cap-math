<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">青川鎮洪水危害與重要設施示意圖</title>
  <desc id="desc">北方朝上、比例尺零至一公里。河川由北向南穿過中央，高危害區以密斜線、中危害區以疏點、低危害區以白底表示。甲里位於西北低危害區，乙里位於中央高危害區，丙里位於東南中危害區，丁里位於西南中危害區。醫院在乙里河東側，避難所在東北低危害高地，唯一跨河橋位於中央高危害區。</desc>
  <defs>
    <pattern id="high" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#111" stroke-width="4"/></pattern>
    <pattern id="medium" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#555"/></pattern>
  </defs>
  <rect width="920" height="620" fill="white"/>
  <text x="36" y="42" font-family="sans-serif" font-size="25" font-weight="700">青川鎮洪水危害與重要設施示意圖</text>
  <g transform="translate(70 80)" stroke="#222">
    <rect x="0" y="0" width="600" height="450" fill="white" stroke-width="3"/>
    <path d="M240 0 C210 85 285 120 250 205 C220 285 300 340 265 450 L390 450 C420 360 340 305 375 220 C410 130 335 80 370 0Z" fill="url(#medium)" stroke-width="2"/>
    <path d="M285 0 C260 80 325 125 295 210 C270 285 345 340 315 450 L355 450 C385 350 315 300 340 215 C370 120 305 75 330 0Z" fill="url(#high)" stroke-width="2"/>
    <path d="M305 0 C280 85 345 125 315 215 C290 285 365 345 335 450" fill="none" stroke="#111" stroke-width="14"/>
    <path d="M305 0 C280 85 345 125 315 215 C290 285 365 345 335 450" fill="none" stroke="white" stroke-width="4" stroke-dasharray="18 10"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#999" stroke-dasharray="5 6"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#999" stroke-dasharray="5 6"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#999" stroke-dasharray="5 6"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#999" stroke-dasharray="5 6"/>
    <g font-family="sans-serif" font-size="21" font-weight="700" fill="#111" stroke="none">
      <text x="90" y="105">甲里</text><text x="315" y="205">乙里</text><text x="455" y="375">丙里</text><text x="90" y="385">丁里</text>
    </g>
    <g fill="white" stroke="#111" stroke-width="4">
      <rect x="365" y="225" width="32" height="32"/><path d="M381 230V252M370 241H392"/>
      <polygon points="505,70 529,110 481,110"/>
      <line x1="235" y1="260" x2="390" y2="260" stroke-width="12"/><line x1="235" y1="260" x2="390" y2="260" stroke="white" stroke-width="4"/>
    </g>
    <g font-family="sans-serif" font-size="18" fill="#111" stroke="none">
      <text x="402" y="250">醫院</text><text x="470" y="135">避難所</text><text x="245" y="292">唯一跨河橋</text><text x="345" y="65">青川</text>
      <text x="-45" y="15">2.25</text><text x="-35" y="165">1.5</text><text x="-35" y="315">0.75</text><text x="-25" y="452">0 km</text>
      <text x="-3" y="480">0</text><text x="195" y="480">1</text><text x="395" y="480">2</text><text x="585" y="480">3 km</text>
    </g>
    <g transform="translate(535 20)" fill="none" stroke="#111" stroke-width="3"><path d="M0 55 L18 0 L36 55 L18 42 Z" fill="white"/><text x="11" y="-8" font-family="sans-serif" font-size="21" fill="#111" stroke="none">北</text></g>
  </g>
  <g transform="translate(700 92)" font-family="sans-serif" font-size="18" fill="#111">
    <text x="0" y="0" font-size="21" font-weight="700">圖例</text>
    <rect x="0" y="20" width="48" height="30" fill="url(#high)" stroke="#111"/><text x="60" y="42">高危害</text>
    <rect x="0" y="65" width="48" height="30" fill="url(#medium)" stroke="#111"/><text x="60" y="87">中危害</text>
    <rect x="0" y="110" width="48" height="30" fill="white" stroke="#111"/><text x="60" y="132">低危害</text>
    <line x1="0" y1="175" x2="52" y2="175" stroke="#111" stroke-width="12"/><line x1="0" y1="175" x2="52" y2="175" stroke="white" stroke-width="4" stroke-dasharray="12 7"/><text x="60" y="181">河川</text>
    <rect x="7" y="205" width="32" height="32" fill="white" stroke="#111" stroke-width="3"/><path d="M23 210V232M12 221H34" stroke="#111" stroke-width="3"/><text x="60" y="230">醫院</text>
    <polygon points="23,252 45,290 1,290" fill="white" stroke="#111" stroke-width="3"/><text x="60" y="280">避難所</text>
    <text x="0" y="340" font-weight="700">比例尺</text><line x1="0" y1="365" x2="200" y2="365" stroke="#111" stroke-width="5"/><line x1="0" y1="355" x2="0" y2="375" stroke="#111"/><line x1="100" y1="355" x2="100" y2="375" stroke="#111"/><line x1="200" y1="355" x2="200" y2="375" stroke="#111"/><text x="0" y="397">0</text><text x="90" y="397">0.5</text><text x="175" y="397">1 km</text>
  </g>
  <text x="70" y="590" font-family="sans-serif" font-size="16">原創教學示意圖；危害分區與聚落均為虛構，比例尺只供本圖空間判讀。</text>
</svg>
