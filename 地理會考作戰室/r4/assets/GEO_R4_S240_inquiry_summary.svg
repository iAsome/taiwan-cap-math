<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">三街區遮蔭與高溫日探究摘要</title>
  <desc id="desc">左側為北向街區示意圖，甲在西北、乙在中央、丙在東南；甲樹蔭點紋最多，乙次之，丙最少。右上長條圖顯示甲乙丙每年高溫日分別十二、二十一、三十四日，縱軸從零至四十日。右下文字結論指出遮蔭較少與高溫日較多相伴，但三個街區樣本不足以單獨證明因果，仍需控制建物密度與測站條件。</desc>
  <defs><pattern id="shade" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2" fill="#444"/></pattern><pattern id="dense" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#222" stroke-width="3"/></pattern></defs>
  <rect width="960" height="640" fill="white"/><text x="36" y="42" font-family="sans-serif" font-size="26" font-weight="700">三街區遮蔭與高溫日探究摘要</text>
  <g transform="translate(45 80)" font-family="sans-serif" fill="#111">
    <text x="0" y="0" font-size="21" font-weight="700">一、位置與遮蔭示意</text><rect x="0" y="20" width="390" height="360" fill="white" stroke="#111" stroke-width="3"/>
    <path d="M0 140H390M0 260H390M130 20V380M260 20V380" stroke="#888" stroke-dasharray="5 5"/>
    <rect x="20" y="42" width="90" height="78" fill="url(#shade)" stroke="#111"/><rect x="150" y="160" width="90" height="78" fill="url(#shade)" stroke="#111"/><rect x="280" y="280" width="90" height="78" fill="url(#dense)" stroke="#111"/>
    <text x="48" y="88" font-size="24" font-weight="700">甲</text><text x="178" y="207" font-size="24" font-weight="700">乙</text><text x="308" y="327" font-size="24" font-weight="700">丙</text>
    <g transform="translate(315 35)" fill="none" stroke="#111" stroke-width="3"><path d="M0 55L18 0L36 55L18 42Z" fill="white"/><text x="11" y="-5" font-size="20" fill="#111" stroke="none">北</text></g>
    <rect x="15" y="405" width="34" height="24" fill="url(#shade)" stroke="#111"/><text x="58" y="424" font-size="17">樹蔭較多</text><rect x="170" y="405" width="34" height="24" fill="url(#dense)" stroke="#111"/><text x="213" y="424" font-size="17">建物密集、樹蔭少</text>
  </g>
  <g transform="translate(505 80)" font-family="sans-serif" fill="#111">
    <text x="0" y="0" font-size="21" font-weight="700">二、每年高溫日數</text><line x1="55" y1="330" x2="390" y2="330" stroke="#111" stroke-width="3"/><line x1="55" y1="30" x2="55" y2="330" stroke="#111" stroke-width="3"/>
    <g stroke="#aaa" stroke-dasharray="4 5"><line x1="55" y1="255" x2="390" y2="255"/><line x1="55" y1="180" x2="390" y2="180"/><line x1="55" y1="105" x2="390" y2="105"/><line x1="55" y1="30" x2="390" y2="30"/></g>
    <g font-size="16"><text x="30" y="335">0</text><text x="20" y="260">10</text><text x="20" y="185">20</text><text x="20" y="110">30</text><text x="20" y="35">40</text><text x="2" y="15">日</text></g>
    <rect x="90" y="240" width="60" height="90" fill="white" stroke="#111" stroke-width="4"/><rect x="195" y="172.5" width="60" height="157.5" fill="url(#shade)" stroke="#111" stroke-width="4"/><rect x="300" y="75" width="60" height="255" fill="url(#dense)" stroke="#111" stroke-width="4"/>
    <text x="110" y="232" font-size="18">12</text><text x="215" y="165" font-size="18">21</text><text x="320" y="68" font-size="18">34</text><text x="112" y="355" font-size="20">甲</text><text x="217" y="355" font-size="20">乙</text><text x="322" y="355" font-size="20">丙</text>
    <text x="0" y="405" font-size="21" font-weight="700">三、結論與限制</text><text x="0" y="438" font-size="18">遮蔭較少的街區，高溫日較多。</text><text x="0" y="468" font-size="18">但只有三個街區，尚不能單獨證明因果；</text><text x="0" y="498" font-size="18">需控制建物密度、測站位置與同期氣象。</text>
  </g>
  <text x="45" y="612" font-family="sans-serif" font-size="16">資料：原創虛構教學情境；高溫日門檻與三街區測量期間相同。圖形不依賴顏色並附數值標籤。</text>
</svg>
