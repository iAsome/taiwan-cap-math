<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">十五至十六世紀三條遠洋航路示意圖</title>
  <desc id="desc">非比例世界示意圖。實線一由歐洲繞非洲到印度，虛線二由歐洲向西到加勒比海，點線三由歐洲向西跨越太平洋與印度洋後返回。所有航路都有編號、箭頭與文字標籤。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#111"/></marker>
    <pattern id="ocean" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 12 Q4 8 8 12 T16 12" fill="none" stroke="#d1d5db" stroke-width="1"/></pattern>
  </defs>
  <rect width="960" height="680" fill="#fff"/>
  <text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">十五至十六世紀遠洋航路示意</text>
  <text x="480" y="62" text-anchor="middle" font-family="sans-serif" font-size="15">位置與航跡為示意，非比例；箭頭表示主要航向</text>
  <rect x="30" y="82" width="900" height="430" fill="url(#ocean)" stroke="#111" stroke-width="2"/>
  <g fill="#f2f2f2" stroke="#333" stroke-width="2.5" font-family="sans-serif" font-size="16" font-weight="700">
    <path d="M92 146 L176 116 250 140 274 189 238 230 183 222 151 267 111 249 78 201 Z"/>
    <text x="170" y="185" text-anchor="middle" stroke="none" fill="#111">北美洲</text>
    <path d="M224 282 L286 268 319 304 302 371 272 443 235 469 214 400 195 329 Z"/>
    <text x="258" y="347" text-anchor="middle" stroke="none" fill="#111">南美洲</text>
    <path d="M420 132 L487 117 532 139 516 176 466 181 432 166 Z"/>
    <text x="474" y="151" text-anchor="middle" stroke="none" fill="#111">歐洲</text>
    <path d="M442 192 L513 183 557 231 542 318 493 414 447 359 418 270 Z"/>
    <text x="488" y="279" text-anchor="middle" stroke="none" fill="#111">非洲</text>
    <path d="M523 123 L681 110 824 156 849 227 784 267 682 238 620 277 552 225 507 182 Z"/>
    <text x="683" y="174" text-anchor="middle" stroke="none" fill="#111">亞洲</text>
    <path d="M739 363 L814 349 856 389 822 439 758 431 720 397 Z"/>
    <text x="789" y="399" text-anchor="middle" stroke="none" fill="#111">澳洲</text>
  </g>
  <g fill="#fff" stroke="#111" stroke-width="3">
    <circle cx="449" cy="160" r="7"/><circle cx="495" cy="405" r="7"/><circle cx="628" cy="239" r="7"/><circle cx="248" cy="235" r="7"/><circle cx="253" cy="438" r="7"/><circle cx="721" cy="278" r="7"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#111">
    <text x="414" y="146">伊比利半島</text><text x="505" y="426">好望角</text><text x="633" y="258">印度</text><text x="189" y="226">加勒比海</text><text x="174" y="456">南美洲南端</text><text x="727" y="299">東南亞</text>
  </g>
  <path d="M449 160 C430 222 432 327 495 405 C548 399 581 322 628 239" fill="none" stroke="#111" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M449 160 C377 133 315 159 248 235" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="14 9" marker-end="url(#arrow)"/>
  <path d="M449 160 C369 140 290 175 248 235 C217 286 223 372 253 438" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="3 9" marker-end="url(#arrow)"/>
  <path d="M253 438 C178 475 102 451 45 394" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="3 9" marker-end="url(#arrow)"/>
  <path d="M915 394 C850 424 775 390 721 278" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="3 9" marker-end="url(#arrow)"/>
  <path d="M721 278 C686 373 585 462 495 405 C446 354 434 238 449 160" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="3 9" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" font-size="13" fill="#111"><text x="48" y="382">向西跨越太平洋</text><text x="783" y="421">由左側接續</text></g>
  <g font-family="sans-serif" font-size="18" font-weight="700">
    <circle cx="526" cy="338" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="526" y="345" text-anchor="middle">1</text>
    <circle cx="340" cy="177" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="184" text-anchor="middle">2</text>
    <circle cx="152" cy="414" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="152" y="421" text-anchor="middle">3</text>
  </g>
  <g transform="translate(40 535)" font-family="sans-serif" fill="#111">
    <rect width="880" height="118" fill="#fff" stroke="#111" stroke-width="2"/>
    <line x1="25" y1="28" x2="120" y2="28" stroke="#111" stroke-width="5"/><text x="135" y="34" font-size="16">1 達伽馬：繞非洲進入印度洋（1497–1498）</text>
    <line x1="25" y1="61" x2="120" y2="61" stroke="#111" stroke-width="4" stroke-dasharray="14 9"/><text x="135" y="67" font-size="16">2 哥倫布：橫越大西洋抵達加勒比海（1492）</text>
    <line x1="25" y1="94" x2="120" y2="94" stroke="#111" stroke-width="4" stroke-dasharray="3 9"/><text x="135" y="100" font-size="16">3 麥哲倫船隊：完成首次環球航行（1519–1522；麥哲倫本人未返航）</text>
    <text x="760" y="28" font-size="17" font-weight="700">北 ↑</text>
    <text x="760" y="55" font-size="14">非距離比例</text>
  </g>
</svg>
