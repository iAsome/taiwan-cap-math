<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">十九世紀末至二十世紀初部分殖民統治案例分布圖</title>
  <desc id="desc">非比例世界區域圖以A到H及不同黑白線紋標示印度、法屬印度支那、荷屬東印度、菲律賓、臺灣與朝鮮、埃及、阿爾及利亞、剛果等八個案例及其主要統治國。</desc>
  <defs>
    <pattern id="uk" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#111" stroke-width="2"/></pattern>
    <pattern id="fr" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 2 H8 M0 6 H8" stroke="#111" stroke-width="1.5"/></pattern>
    <pattern id="nl" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2 0 V8 M6 0 V8" stroke="#111" stroke-width="1.5"/></pattern>
    <pattern id="us" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#111"/><circle cx="6" cy="6" r="1.2" fill="#111"/></pattern>
    <pattern id="jp" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 H10 M5 0 V10" stroke="#111" stroke-width="1.2"/></pattern>
    <pattern id="be" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#111" stroke-width="1.2"/></pattern>
  </defs>
  <rect width="960" height="720" fill="#fff"/>
  <text x="480" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">部分帝國與殖民統治案例分布</text>
  <text x="480" y="60" text-anchor="middle" font-family="sans-serif" font-size="15">約十九世紀末至二十世紀初；選例示意，非完整疆域圖</text>
  <rect x="30" y="80" width="900" height="430" fill="#fff" stroke="#111" stroke-width="2"/>
  <g fill="#f2f2f2" stroke="#444" stroke-width="2.5" font-family="sans-serif" font-size="17" font-weight="700">
    <path d="M81 148 L193 110 291 138 302 206 243 245 153 239 92 206 Z"/><text x="190" y="181" text-anchor="middle" stroke="none" fill="#111">美洲</text>
    <path d="M250 279 L318 265 346 306 315 438 271 474 231 383 Z"/>
    <path d="M394 130 L480 111 548 137 529 178 462 183 416 166 Z"/><text x="468" y="149" text-anchor="middle" stroke="none" fill="#111">歐洲</text>
    <path d="M425 193 L524 182 575 248 548 379 490 459 432 360 401 264 Z"/><text x="489" y="294" text-anchor="middle" stroke="none" fill="#111">非洲</text>
    <path d="M522 118 L716 105 865 159 881 244 817 290 709 247 625 293 548 230 504 177 Z"/><text x="694" y="169" text-anchor="middle" stroke="none" fill="#111">亞洲</text>
    <path d="M734 373 L821 353 876 400 839 462 762 448 716 408 Z"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#111" stroke="#111" stroke-width="2.5">
    <circle cx="677" cy="247" r="18" fill="url(#uk)"/><text x="677" y="252" text-anchor="middle" stroke="none" font-weight="700">A</text><text x="628" y="278" stroke="none">印度／英</text>
    <circle cx="752" cy="250" r="18" fill="url(#fr)"/><text x="752" y="255" text-anchor="middle" stroke="none" font-weight="700">B</text><text x="729" y="282" stroke="none">印度支那／法</text>
    <circle cx="777" cy="331" r="18" fill="url(#nl)"/><text x="777" y="336" text-anchor="middle" stroke="none" font-weight="700">C</text><text x="740" y="361" stroke="none">東印度／荷</text>
    <circle cx="828" cy="270" r="18" fill="url(#us)"/><text x="828" y="275" text-anchor="middle" stroke="none" font-weight="700">D</text><text x="809" y="301" stroke="none">菲律賓／美</text>
    <circle cx="820" cy="190" r="18" fill="url(#jp)"/><text x="820" y="195" text-anchor="middle" stroke="none" font-weight="700">E</text><text x="777" y="221" stroke="none">臺灣、朝鮮／日</text>
    <circle cx="537" cy="216" r="18" fill="url(#uk)"/><text x="537" y="221" text-anchor="middle" stroke="none" font-weight="700">F</text><text x="552" y="204" stroke="none">埃及／英</text>
    <circle cx="446" cy="219" r="18" fill="url(#fr)"/><text x="446" y="224" text-anchor="middle" stroke="none" font-weight="700">G</text><text x="382" y="249" stroke="none">阿爾及利亞／法</text>
    <circle cx="497" cy="330" r="18" fill="url(#be)"/><text x="497" y="335" text-anchor="middle" stroke="none" font-weight="700">H</text><text x="514" y="350" stroke="none">剛果／比</text>
  </g>
  <g transform="translate(36 532)" font-family="sans-serif" fill="#111">
    <rect width="888" height="162" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="18" y="26" font-size="16" font-weight="700">圖例（線紋與文字代碼並用）</text>
    <rect x="20" y="42" width="42" height="22" fill="url(#uk)" stroke="#111"/><text x="72" y="59" font-size="15">英：英國</text>
    <rect x="160" y="42" width="42" height="22" fill="url(#fr)" stroke="#111"/><text x="212" y="59" font-size="15">法：法國</text>
    <rect x="300" y="42" width="42" height="22" fill="url(#nl)" stroke="#111"/><text x="352" y="59" font-size="15">荷：荷蘭</text>
    <rect x="440" y="42" width="42" height="22" fill="url(#us)" stroke="#111"/><text x="492" y="59" font-size="15">美：美國</text>
    <rect x="580" y="42" width="42" height="22" fill="url(#jp)" stroke="#111"/><text x="632" y="59" font-size="15">日：日本</text>
    <rect x="720" y="42" width="42" height="22" fill="url(#be)" stroke="#111"/><text x="772" y="59" font-size="15">比：比利時</text>
    <text x="20" y="96" font-size="15">讀圖限制：八個標記是比較案例，不代表全部殖民地，也不表示各地行政地位相同。</text>
    <text x="20" y="124" font-size="15">位置、輪廓與面積均為示意，不可由標記大小比較統治範圍；精確年代見資料表替代。</text>
    <text x="795" y="28" font-size="17" font-weight="700">北 ↑</text>
  </g>
</svg>
