<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">清末臺灣四個通商口岸位置示意圖</title>
  <desc id="desc">北部西側的滬尾略在北部東側的雞籠以北，西南部由北往南標示安平與打狗。北部主要出口茶與樟腦，南部主要出口糖。位置為示意，並非等比例地圖。</desc>
  <rect width="640" height="900" fill="#fff"/>
  <text x="320" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">清末臺灣通商口岸示意</text>
  <text x="320" y="70" text-anchor="middle" font-family="sans-serif" font-size="16">約 1860 年代後；位置示意，非比例</text>
  <path d="M405 116 C453 147 476 208 474 276 C471 356 439 430 412 501 C386 569 358 640 311 716 C285 757 251 799 221 782 C194 766 205 718 226 674 C258 610 272 540 292 469 C311 398 334 331 343 263 C351 201 353 148 380 120 C389 111 397 111 405 116 Z" fill="#f5f5f5" stroke="#111" stroke-width="5"/>
  <g font-family="sans-serif" font-size="18" fill="#111" stroke="#111">
    <circle cx="408" cy="158" r="9" fill="#fff" stroke-width="4"/>
    <line x1="417" y1="158" x2="490" y2="139" stroke-width="2"/>
    <text x="496" y="144" stroke="none">雞籠（基隆）</text>

    <circle cx="357" cy="145" r="9" fill="#fff" stroke-width="4"/>
    <line x1="348" y1="145" x2="250" y2="126" stroke-width="2"/>
    <text x="92" y="130" stroke="none">滬尾（淡水）</text>

    <circle cx="252" cy="652" r="9" fill="#fff" stroke-width="4"/>
    <line x1="243" y1="652" x2="130" y2="630" stroke-width="2"/>
    <text x="67" y="634" stroke="none">安平</text>

    <circle cx="226" cy="721" r="9" fill="#fff" stroke-width="4"/>
    <line x1="217" y1="721" x2="115" y2="740" stroke-width="2"/>
    <text x="33" y="746" stroke="none">打狗（高雄）</text>
  </g>

  <g font-family="sans-serif" fill="#111">
    <text x="538" y="178" font-size="19" font-weight="700">北</text>
    <path d="M548 220 L548 187 M548 187 L536 202 M548 187 L560 202" fill="none" stroke="#111" stroke-width="4"/>
  </g>

  <g transform="translate(55 805)" font-family="sans-serif" fill="#111">
    <rect width="530" height="64" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="25" cy="22" r="8" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="44" y="28" font-size="16">通商口岸</text>
    <text x="190" y="28" font-size="16">北部出口：茶、樟腦</text>
    <text x="382" y="28" font-size="16">南部出口：糖</text>
    <text x="25" y="52" font-size="14">方位：圖上為北　比例：位置關係示意，非距離比例</text>
  </g>
</svg>
