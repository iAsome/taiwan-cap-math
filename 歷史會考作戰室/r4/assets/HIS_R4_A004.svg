<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">臺灣多類史料時間、空間與證據對齊示例</title>
  <desc id="desc">1860年代到1935年的五個節點由左至右排列，節點間距不按實際年數比例；下方分列空間或制度線索和可使用的證據類型。虛線表示時間對齊，不代表必然因果。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111"/></marker></defs>
  <rect width="1100" height="720" fill="#fff"/>
  <text x="550" y="37" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">臺灣多類史料對齊示例（1860年代—1935）</text>
  <text x="550" y="65" text-anchor="middle" font-family="sans-serif" font-size="15">由左至右推進；節點間距非年數比例；時間相鄰不等於必然因果</text>
  <line x1="92" y1="145" x2="1010" y2="145" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" fill="#111" text-anchor="middle">
    <g transform="translate(120 0)"><circle cx="0" cy="145" r="10" fill="#fff" stroke="#111" stroke-width="4"/><text x="0" y="105" font-size="17" font-weight="700">1860年代</text><text x="0" y="127" font-size="15">開港通商</text></g>
    <g transform="translate(335 0)"><circle cx="0" cy="145" r="10" fill="#fff" stroke="#111" stroke-width="4"/><text x="0" y="105" font-size="17" font-weight="700">1885</text><text x="0" y="127" font-size="15">臺灣建省</text></g>
    <g transform="translate(550 0)"><circle cx="0" cy="145" r="10" fill="#fff" stroke="#111" stroke-width="4"/><text x="0" y="105" font-size="17" font-weight="700">1895</text><text x="0" y="127" font-size="15">日本統治開始</text></g>
    <g transform="translate(765 0)"><circle cx="0" cy="145" r="10" fill="#fff" stroke="#111" stroke-width="4"/><text x="0" y="105" font-size="17" font-weight="700">1915</text><text x="0" y="127" font-size="15">噍吧哖事件</text></g>
    <g transform="translate(980 0)"><circle cx="0" cy="145" r="10" fill="#fff" stroke="#111" stroke-width="4"/><text x="0" y="105" font-size="17" font-weight="700">1935</text><text x="0" y="127" font-size="15">地方選舉</text></g>
  </g>
  <g stroke="#777" stroke-width="2" stroke-dasharray="6 6"><line x1="120" y1="155" x2="120" y2="590"/><line x1="335" y1="155" x2="335" y2="590"/><line x1="550" y1="155" x2="550" y2="590"/><line x1="765" y1="155" x2="765" y2="590"/><line x1="980" y1="155" x2="980" y2="590"/></g>
  <g font-family="sans-serif" fill="#111">
    <text x="25" y="205" font-size="17" font-weight="700">空間／制度</text>
    <text x="25" y="396" font-size="17" font-weight="700">可用證據</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#111" text-anchor="middle">
    <g transform="translate(45 225)"><rect width="150" height="105" fill="#f6f6f6" stroke="#111" stroke-width="2"/><text x="75" y="28">四個通商口岸</text><text x="75" y="52">連入國際貿易</text><text x="75" y="80">各口岸發展不同</text></g>
    <g transform="translate(260 225)"><rect width="150" height="105" fill="#fff" stroke="#111" stroke-width="2"/><text x="75" y="28">行政層級調整</text><text x="75" y="52">交通與防務建設</text><text x="75" y="80">落實程度不一</text></g>
    <g transform="translate(475 225)"><rect width="150" height="105" fill="#f6f6f6" stroke="#111" stroke-width="2"/><text x="75" y="28">殖民統治架構</text><text x="75" y="52">法令制度更替</text><text x="75" y="80">生活有延續與變化</text></g>
    <g transform="translate(690 225)"><rect width="150" height="105" fill="#fff" stroke="#111" stroke-width="2"/><text x="75" y="28">臺南山區及</text><text x="75" y="52">相關地區抗爭</text><text x="75" y="80">參與者背景多元</text></g>
    <g transform="translate(905 225)"><rect width="150" height="105" fill="#f6f6f6" stroke="#111" stroke-width="2"/><text x="75" y="28">有限地方參與</text><text x="75" y="52">資格並非普遍</text><text x="75" y="80">不等同完整自治</text></g>
    <g transform="translate(45 415)"><rect width="150" height="120" fill="#fff" stroke="#111" stroke-width="2"/><text x="75" y="27">條約、海關紀錄</text><text x="75" y="52">商業帳冊</text><line x1="18" y1="70" x2="132" y2="70" stroke="#111"/><text x="75" y="94">留意形成時間</text></g>
    <g transform="translate(260 415)"><rect width="150" height="120" fill="#f6f6f6" stroke="#111" stroke-width="2"/><text x="75" y="27">官署檔案、地圖</text><text x="75" y="52">財政建設資料</text><line x1="18" y1="70" x2="132" y2="70" stroke="#111"/><text x="75" y="94">規劃不等於完成</text></g>
    <g transform="translate(475 415)"><rect width="150" height="120" fill="#fff" stroke="#111" stroke-width="2"/><text x="75" y="27">條約、法令</text><text x="75" y="52">人口與地方紀錄</text><line x1="18" y1="70" x2="132" y2="70" stroke="#111"/><text x="75" y="94">比較制度與實況</text></g>
    <g transform="translate(690 415)"><rect width="150" height="120" fill="#f6f6f6" stroke="#111" stroke-width="2"/><text x="75" y="27">判決、官方報告</text><text x="75" y="52">地方記憶、研究</text><line x1="18" y1="70" x2="132" y2="70" stroke="#111"/><text x="75" y="94">來源目的可能不同</text></g>
    <g transform="translate(905 415)"><rect width="150" height="120" fill="#fff" stroke="#111" stroke-width="2"/><text x="75" y="27">制度、選舉名冊</text><text x="75" y="52">報刊與參與資料</text><line x1="18" y1="70" x2="132" y2="70" stroke="#111"/><text x="75" y="94">檢查資格與比例</text></g>
  </g>
  <g transform="translate(55 610)" font-family="sans-serif" fill="#111"><rect width="990" height="78" fill="#fff" stroke="#111" stroke-width="2"/><text x="18" y="29" font-size="15" font-weight="700">讀圖方法：</text><text x="105" y="29" font-size="15">先對齊時間與空間，再比較材料形成者、目的及範圍；不同材料一致時可互證，衝突時要保留限制。</text><text x="18" y="57" font-size="14">虛線只協助對齊節點；節點間距非年數比例，也不表示前一事件必然造成下一事件；完整限制見資料表。</text></g>
</svg>
