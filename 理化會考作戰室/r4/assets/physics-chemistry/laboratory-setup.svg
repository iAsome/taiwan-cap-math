<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>加熱試管安全裝置</title><desc>試管由夾具固定，封閉端較低、管口斜向右上並朝向無人處。灰色液體不超過試管容量三分之一，酒精燈位在液體部分下方；操作者戴護目鏡並站在封閉端側面，視線不在管口延長線上。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">加熱試管安全示意圖（非依比例）</text><line class="line" x1="70" y1="335" x2="650" y2="335"/><line class="line" x1="205" y1="320" x2="250" y2="105"/><path class="line" d="M270 195 Q252 191 257 175 L500 105 M270 195 L505 122"/><path d="M257 175 Q252 191 270 195 L354 170 L274 170 Z" fill="#ddd" stroke="#111" stroke-width="2"/><line class="thin" x1="500" y1="105" x2="505" y2="122"/><path class="line" d="M225 155 L307 161 M225 177 L322 171"/><text x="185" y="205" class="small">試管夾</text><text x="455" y="88" class="small">管口朝無人處</text><path class="arrow" d="M520 92 L500 110"/><text x="300" y="215" class="small">液體不超過試管容量 1/3</text><path class="arrow" d="M390 205 L330 176"/><rect class="box" x="275" y="275" width="72" height="55"/><path class="thin" d="M294 275 Q311 218 328 275"/><text x="250" y="365" class="small">熱源對準液體部分</text><circle class="box" cx="115" cy="105" r="38"/><ellipse class="thin" cx="102" cy="101" rx="14" ry="10"/><ellipse class="thin" cx="130" cy="101" rx="14" ry="10"/><path class="thin" d="M88 97 Q75 102 78 112 M144 97 Q157 102 154 112"/><path class="line" d="M87 144 L62 255 M143 144 L165 255 M96 255 L72 330 M140 255 L165 330"/><text x="28" y="65" class="small">護目鏡</text><path class="arrow" d="M82 68 L99 91"/><text x="30" y="385" class="small">人站側面，避開管口延長線</text></svg>
