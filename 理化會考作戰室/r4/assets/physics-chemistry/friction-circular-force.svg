<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>車輛轉彎時的速度與向心合力</title><desc>俯視圓形道路，車位於圓周右側；速度箭頭沿切線向上，向心合力箭頭由車指向圓心，兩者互相垂直。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">等速轉彎的方向關係（俯視）</text><circle class="line" cx="330" cy="235" r="135"/><circle cx="330" cy="235" r="7" fill="#111"/><text x="305" y="265">圓心</text><rect class="box" x="445" y="205" width="80" height="55"/><text x="464" y="240">車</text><path class="arrow" d="M485 205 L485 85"/><text x="500" y="105">速度 v</text><path class="arrow" d="M445 232 L345 232"/><text x="365" y="215">向心合力</text></svg>
