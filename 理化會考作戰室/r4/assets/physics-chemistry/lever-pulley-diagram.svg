<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>槓桿的支點、施力與抗力</title><desc>水平槓桿由中間偏右的三角支點支撐，左端有向下施力四十牛頓，右端有向下抗力六十牛頓，兩側力臂分別標一點五公尺與一公尺。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">槓桿平衡示意圖</text><line class="line" x1="75" y1="225" x2="645" y2="225"/><path class="line" d="M410 225 L365 315 L455 315 Z"/><text x="385" y="345">支點</text><path class="arrow" d="M110 90 L110 215"/><text x="125" y="125">施力 40 N</text><path class="arrow" d="M610 90 L610 215"/><text x="485" y="125">抗力 60 N</text><path class="thin" d="M110 265 L610 265 M110 255 L110 275 M410 255 L410 275 M610 255 L610 275"/><text x="235" y="295">1.5 m</text><text x="490" y="295">1.0 m</text></svg>
