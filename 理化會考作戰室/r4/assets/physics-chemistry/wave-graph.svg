<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>繩波的空間波形</title><desc>橫軸為位置公尺，縱軸為位移公分。波峰位於一與五公尺，兩峰距離四公尺；振幅二公分。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">繩波空間圖</text><line class="arrow" x1="90" y1="330" x2="660" y2="330"/><line class="arrow" x1="100" y1="370" x2="100" y2="70"/><text x="620" y="365">位置 (m)</text><text x="20" y="85">位移 (cm)</text><path class="line" d="M100 330 C150 210 200 210 250 330 S350 450 400 330 S500 210 550 330 S650 450 700 330"/><line class="dash" x1="175" y1="210" x2="175" y2="330"/><line class="dash" x1="475" y1="210" x2="475" y2="330"/><path class="arrow" d="M185 185 L465 185"/><text x="275" y="170">波長 λ = 4 m</text><path class="arrow" d="M135 330 L135 215"/><text x="145" y="270">振幅 2 cm</text></svg>
