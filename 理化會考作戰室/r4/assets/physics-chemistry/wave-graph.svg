<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>繩波的空間波形</title><desc>橫軸表示位置 x，縱軸表示相對平衡線的位移 y。虛線通過兩個相鄰波峰，兩峰的水平距離以波長 λ 標示；平衡線到波峰的垂直距離以振幅 A 標示。此圖只表示相對幾何關係，不提供數值刻度。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">繩波空間圖（示意）</text><line class="arrow" x1="90" y1="230" x2="675" y2="230"/><line class="arrow" x1="100" y1="365" x2="100" y2="70"/><text x="610" y="265">位置 x</text><text x="25" y="85">位移 y</text><path class="line" d="M140 230 Q200 110 260 230 T380 230 T500 230 T620 230"/><line class="dash" x1="200" y1="110" x2="200" y2="230"/><line class="dash" x1="440" y1="110" x2="440" y2="230"/><path class="arrow" d="M210 90 L430 90"/><text x="295" y="78">波長 λ</text><path class="arrow" d="M125 230 L125 115"/><text x="110" y="105">A（振幅）</text></svg>
