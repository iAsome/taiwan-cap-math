<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>位置時間圖</title><desc>橫軸為時間秒，縱軸為位置公尺。折線第一段斜率為正，表示物體向正方向移動；第二段水平，表示位置不變而靜止；第三段斜率為負，表示物體向負方向移動。圖中不提供可計算速率的數值刻度。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">位置—時間圖（示意）</text><line class="arrow" x1="100" y1="350" x2="660" y2="350"/><line class="arrow" x1="100" y1="365" x2="100" y2="70"/><text x="595" y="385">時間 (s)</text><text x="25" y="85">位置 (m)</text><polyline class="line" points="100,350 270,135 430,135 610,265"/><text x="165" y="205">向正方向</text><text x="325" y="120">靜止</text><text x="500" y="190">向負方向</text><line class="dash" x1="270" y1="135" x2="270" y2="350"/><line class="dash" x1="430" y1="135" x2="430" y2="350"/></svg>
