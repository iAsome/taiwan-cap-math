<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>發電機的能量與裝置關係</title><desc>手搖把手帶動線圈在磁場中轉動，線圈兩側有北南磁極，導線連接燈泡；箭頭標示力學能輸入與電能輸出。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">簡化發電機：力學能轉為電能</text><rect class="box" x="120" y="135" width="90" height="150"/><text x="153" y="215">N</text><rect class="box" x="480" y="135" width="90" height="150"/><text x="513" y="215">S</text><rect class="box" x="290" y="145" width="110" height="130"/><path class="arrow" d="M345 315 C245 315 245 105 345 105"/><text x="250" y="90">線圈轉動</text><path class="line" d="M290 210 L235 210 L235 350 L455 350 L455 210 L400 210"/><circle class="box" cx="345" cy="350" r="35"/><path class="thin" d="M325 350 Q345 320 365 350 Q345 380 325 350"/><text x="385" y="390">燈泡（電能輸出）</text><path class="arrow" d="M80 330 L205 330"/><text x="35" y="310">手搖力學能</text></svg>
