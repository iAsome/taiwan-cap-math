<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>發電機的能量與裝置關係</title><desc>北極在左、南極在右，磁場中的矩形線圈由上方手搖曲柄帶動，繞中央轉軸旋轉。線圈兩端接至兩個滑環，固定電刷再以封閉導線連接燈泡；線圈轉動時輸出交流電，兩端極性隨轉動週期交替。能量由手搖機械能轉為電能，最後由燈泡轉為光與內能。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">簡化發電機：機械能轉為電能</text><rect class="box" x="70" y="120" width="130" height="170"/><text x="125" y="210">N</text><rect class="box" x="520" y="120" width="130" height="170"/><text x="575" y="210">S</text><path class="line" d="M348 275 L290 275 L290 135 L430 135 L430 275 L372 275"/><text x="325" y="210">轉動線圈</text><line class="dash" x1="360" y1="70" x2="360" y2="300"/><path class="line" d="M360 70 L315 70"/><circle class="box" cx="300" cy="70" r="10"/><text x="205" y="118" class="small">手搖曲柄（機械能輸入）</text><path class="arrow" d="M405 95 A65 65 0 0 0 315 95"/><line class="thin" x1="348" y1="275" x2="348" y2="297"/><line class="thin" x1="372" y1="275" x2="372" y2="314"/><ellipse class="thin" cx="348" cy="305" rx="18" ry="8"/><ellipse class="thin" cx="372" cy="322" rx="18" ry="8"/><line class="line" x1="290" y1="305" x2="330" y2="305"/><line class="line" x1="390" y1="322" x2="430" y2="322"/><path class="line" d="M290 305 L250 305 L250 365 L325 365 M395 365 L470 365 L470 322 L430 322"/><circle class="box" cx="360" cy="365" r="35"/><path class="thin" d="M340 365 Q360 335 380 365 Q360 395 340 365"/><text x="445" y="300" class="small">滑環與固定電刷</text><text x="425" y="395" class="small">燈泡：光與內能輸出</text><text x="455" y="345" class="small">交流，極性交替</text></svg>
