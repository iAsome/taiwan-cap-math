<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>相同作用力下接觸面積不同的壓力比較</title><desc>兩個相同方塊都受向下六十牛頓作用力；甲以寬面接觸，面積零點零三平方公尺，乙以窄面接觸，面積零點零一平方公尺。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">相同作用力、不同接觸面積</text><text x="150" y="95">甲</text><rect class="box" x="90" y="195" width="200" height="95"/><path class="arrow" d="M190 80 L190 185"/><text x="205" y="125">60 N</text><text x="105" y="325">面積 0.03 m²</text><text x="510" y="95">乙</text><rect class="box" x="490" y="125" width="90" height="165"/><path class="arrow" d="M535 80 L535 120"/><text x="550" y="105">60 N</text><text x="465" y="325">面積 0.01 m²</text><line class="line" x1="45" y1="292" x2="665" y2="292"/></svg>
