<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>浸沒物體的浮力與重量</title><desc>方塊完全浸在液體中。上表面有兩支較短的向下壓力箭頭，下表面有兩支較長的向上壓力箭頭；左右同深度的水平壓力互相抵消，因此液體壓力的垂直合力為向上的浮力 B。另以向下箭頭標示重量 W。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">浸沒物體受力與液體壓力</text><rect class="box" x="70" y="80" width="580" height="300"/><path class="thin" d="M70 130 Q215 112 360 130 T650 130"/><text x="85" y="108">液面</text><rect class="box" x="285" y="195" width="150" height="90"/><path class="arrow" d="M315 155 L315 191"/><path class="arrow" d="M405 155 L405 191"/><text x="260" y="150" class="small">上表面壓力（較小）</text><path class="arrow" d="M315 335 L315 289"/><path class="arrow" d="M405 335 L405 289"/><text x="260" y="355" class="small">下表面壓力（較大）</text><path class="arrow" d="M245 220 L281 220"/><path class="arrow" d="M475 220 L439 220"/><path class="arrow" d="M225 260 L281 260"/><path class="arrow" d="M495 260 L439 260"/><text x="82" y="235" class="small">同深度水平分量</text><text x="82" y="258" class="small">大小相等、方向相反</text><path class="arrow" d="M555 285 L555 145"/><text x="570" y="170">浮力 B</text><text x="570" y="192" class="small">壓力的垂直合力</text><path class="arrow" d="M360 240 L360 330"/><text x="375" y="325">重量 W</text></svg>
