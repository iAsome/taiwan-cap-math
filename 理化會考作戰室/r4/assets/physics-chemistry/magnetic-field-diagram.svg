<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>條形磁鐵外部磁場方向</title><desc>條形磁鐵左端為北極、右端為南極，外部磁力線箭頭由北極指向南極；越靠近兩極線條越密。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">條形磁鐵磁場（磁力線為模型）</text><rect class="box" x="260" y="175" width="200" height="75"/><line class="line" x1="360" y1="175" x2="360" y2="250"/><text x="305" y="220">N</text><text x="405" y="220">S</text><path class="arrow" d="M260 190 C110 60 610 60 460 190"/><path class="arrow" d="M260 235 C90 370 630 370 460 235"/><path class="arrow" d="M260 205 C170 125 550 125 460 205"/><path class="arrow" d="M260 220 C170 300 550 300 460 220"/><text x="470" y="155" class="small">磁鐵外部 N → S</text><text x="245" y="395" class="small">線條疏密表示相對強弱；磁力線不是物質線條</text></svg>
