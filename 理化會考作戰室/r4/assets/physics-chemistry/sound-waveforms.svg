<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>兩個聲音波形比較</title><desc>波形甲與乙使用相同時間軸；甲的振幅較大但週期相同，用來比較響度，不能由此宣稱聲速不同。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">聲音波形（同一時間尺度）</text><text x="35" y="135">甲</text><line class="arrow" x1="80" y1="140" x2="665" y2="140"/><path class="line" d="M80 140 Q120 65 160 140 T240 140 T320 140 T400 140 T480 140 T560 140 T640 140"/><text x="35" y="305">乙</text><line class="arrow" x1="80" y1="310" x2="665" y2="310"/><path class="line" d="M80 310 Q120 275 160 310 T240 310 T320 310 T400 310 T480 310 T560 310 T640 310"/><text x="570" y="365">時間 (ms)</text><text x="500" y="90" class="small">甲振幅較大</text><path class="arrow" d="M520 95 L470 115"/></svg>
