<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>白光、物體反射與眼睛看見顏色</title><desc>白光箭頭射向紅色物體，圖中以文字標示物體主要反射紅光並吸收其他色光，反射光再進入眼睛；圖形不用顏色區分資訊。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">物體顏色來自進入眼睛的反射光</text><rect class="box" x="50" y="150" width="130" height="90"/><text x="82" y="200">白光光源</text><path class="arrow" d="M180 195 L300 195"/><text x="215" y="180" class="small">白光</text><rect class="box" x="300" y="125" width="150" height="140"/><text x="330" y="180">紅色物體</text><text x="320" y="215" class="small">反射紅光</text><text x="320" y="240" class="small">吸收其他色光</text><path class="arrow" d="M450 165 L555 125"/><text x="470" y="112" class="small">反射紅光</text><path class="line" d="M560 125 Q610 82 660 125 Q610 168 560 125"/><circle cx="610" cy="125" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="510" y="215" class="small">紅光進入眼睛</text><text x="510" y="240" class="small">形成紅色視覺</text></svg>
