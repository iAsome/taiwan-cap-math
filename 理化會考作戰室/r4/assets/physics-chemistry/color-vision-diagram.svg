<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>白光、物體反射與眼睛看見顏色</title><desc>白光箭頭射向紅色物體，圖中以文字標示物體主要反射紅光並吸收其他色光，反射光再進入眼睛；圖形不用顏色區分資訊。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">物體顏色來自進入眼睛的反射光</text><rect class="box" x="60" y="145" width="130" height="90"/><text x="92" y="195">白光光源</text><path class="arrow" d="M190 190 L320 190"/><text x="215" y="175" class="small">白光</text><rect class="box" x="320" y="120" width="130" height="140"/><text x="342" y="180">紅色物體</text><text x="338" y="210" class="small">反射紅光</text><text x="338" y="235" class="small">吸收其他色光</text><path class="arrow" d="M450 165 L565 115"/><text x="480" y="105" class="small">反射光</text><path class="line" d="M570 115 Q625 70 665 115 Q625 160 570 115"/><circle cx="625" cy="115" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="570" y="205">只有進入眼睛的光</text><text x="570" y="230">能形成視覺</text></svg>
