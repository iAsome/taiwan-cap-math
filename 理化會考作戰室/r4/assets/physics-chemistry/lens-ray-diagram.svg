<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>凸透鏡成倒立實像光路</title><desc>主軸水平，薄凸透鏡位於中央；左右焦點 F 與兩倍焦距 2F 都有標示。物體位於左側 2F 外，物頂發出的平行主軸光線折射後通過右焦點，通過光心的光線保持直線，兩線在右側 F 與 2F 之間交會，形成較小的倒立實像。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">凸透鏡光線圖（示意）</text><line class="line" x1="55" y1="230" x2="675" y2="230"/><path class="line" d="M365 70 Q325 230 365 390 Q405 230 365 70"/><circle cx="265" cy="230" r="5" fill="#111"/><circle cx="465" cy="230" r="5" fill="#111"/><line class="thin" x1="165" y1="222" x2="165" y2="238"/><line class="thin" x1="565" y1="222" x2="565" y2="238"/><text x="255" y="260">F</text><text x="455" y="260">F</text><text x="150" y="260">2F</text><text x="550" y="260">2F</text><path class="arrow" d="M120 230 L120 115"/><text x="82" y="105">物</text><path class="line" d="M120 115 L365 115 L535 310"/><path class="line" d="M120 115 L365 230 L535 310"/><path class="arrow" d="M220 115 L300 115"/><path class="arrow" d="M195 150 L270 185"/><path class="arrow" d="M535 230 L535 310"/><text x="548" y="325">倒立實像</text></svg>
