<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>平面鏡反射光路</title><desc>水平鏡面上有一條垂直虛線法線。入射線由左上射向交點，反射線由交點射向右上，入射角與反射角都標為四十度。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">平面鏡反射（角度由法線量起）</text><line class="line" x1="80" y1="315" x2="650" y2="315"/><line class="dash" x1="365" y1="75" x2="365" y2="380"/><text x="380" y="90">法線</text><path class="arrow" d="M120 90 L355 305"/><path class="arrow" d="M375 305 L610 90"/><text x="130" y="90">入射線</text><text x="545" y="90">反射線</text><path class="thin" d="M365 230 A75 75 0 0 0 310 264"/><path class="thin" d="M420 264 A75 75 0 0 0 365 230"/><text x="300" y="235">40°</text><text x="405" y="235">40°</text><text x="570" y="345">鏡面</text></svg>
