<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>速度時間圖與加速度</title><desc>橫軸為時間秒，縱軸為速度公尺每秒。折線先上升、再水平、最後下降回速度零線，依序表示正加速度、零加速度與負加速度；圖中不提供可計算加速度的數值刻度。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">速度—時間圖（示意）</text><line class="arrow" x1="100" y1="350" x2="660" y2="350"/><line class="arrow" x1="100" y1="365" x2="100" y2="70"/><text x="595" y="385">時間 (s)</text><text x="15" y="85">速度 (m/s)</text><polyline class="line" points="100,350 270,130 430,130 610,350"/><text x="145" y="215">正加速度</text><text x="320" y="115">加速度為 0</text><text x="480" y="215">負加速度</text></svg>
