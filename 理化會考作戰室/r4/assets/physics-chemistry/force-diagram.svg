<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker><style>text{font-family:Arial,'Noto Sans TC',sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#111;stroke-width:3}.thin{fill:none;stroke:#111;stroke-width:2}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:3}</style></defs><title>水平面上方塊的受力圖</title><desc>方塊受到向上的正向力 N、向下的重量 W、向右的推力 F 與向左的摩擦力 f。每支箭頭都從方塊出發並標示名稱。</desc><rect x="1" y="1" width="718" height="418" fill="#fff" stroke="#111" stroke-width="2"/><text x="32" y="38">方塊受力圖（箭頭長度僅示意）</text><rect class="box" x="290" y="175" width="140" height="100"/><text x="345" y="230">物體</text><path class="arrow" d="M360 175 L360 70"/><text x="375" y="95">N</text><path class="arrow" d="M360 275 L360 375"/><text x="375" y="360">W</text><path class="arrow" d="M430 225 L580 225"/><text x="555" y="210">F</text><path class="arrow" d="M290 225 L140 225"/><text x="145" y="210">f</text><line class="line" x1="75" y1="277" x2="650" y2="277"/></svg>
